</style></head><body><header><small>QUICK PRACTICE / LISTEN · THINK · SPEAK</small><h1>英语面试急救</h1><p>先听懂在问什么，再用两三句把意思说清楚。</p><nav class="links"><a href="index.html">五科串讲</a><a href="predictions.html">预测100题</a><a href="project-rescue.html">项目面试急救</a></nav></header><div class="shell"><div class="bar"><div class="row"><button id="overview">先看急救地图</button><button id="list">逐题练习</button><button id="random">随机模拟</button><select id="group" aria-label="题目类别"><option value="">全部类别</option></select><input id="search" type="search" aria-label="搜索" placeholder="搜题号或关键词"><label><input type="checkbox" id="weak"> 待复习</label></div><div class="row controls" style="margin-top:10px"><button id="export">导出记录</button><button id="import">导入记录</button><input id="file" type="file" accept="application/json" hidden><span id="stats" class="muted"></span></div><div id="audioTools" class="row controls" style="margin-top:10px" hidden><label>音频语速 <select id="rate"><option value="0.85">慢速0.85×</option><option value="1" selected>正常1×</option><option value="1.1">稍快1.1×</option></select></label><button id="stopAudio">停止声音</button><span class="audio-status" id="audioStatus">点击按钮播放；不录音、不上传声音。</span></div></div><div id="notice" role="status"></div><main id="main"></main><footer>2026-09-15 · 不署名公开练习稿。未附个人简历、身份信息、项目原始文件或数据。笔记只存当前浏览器，可导入导出；本页不录音。英语题目音频为预先合成的通用练习内容，系统朗读只使用页面预设英文。网页和音频来自同一站点，无统计脚本。</footer></div><script id="rescueData" type="application/json">{"kind":"english","title":"英语面试急救","subtitle":"先听懂在问什么，再用两三句把意思说清楚。","cards":[{"id":"E01","group":"常用必背","q":"Please introduce yourself.","variant":"Could you tell us a little about yourself?","meaning":"自我介绍","keys":"introduce / yourself / background","a":"I study software engineering, and I am interested in law and technology. I have worked on a small recommendation prototype with AI assistance. I hope to build a solid foundation in law and keep improving my English.","translation":"我学软件工程，关注法律与科技。我在AI辅助下做过小型推荐原型，希望打牢法律基础并提高英语。","hint":"临场只说四个意思：专业、一个项目、兴趣、学习计划；需要时自行补姓名学校，公开页不保存这些信息。"},{"id":"E02","group":"常用必背","q":"Why do you want to study law?","variant":"Why are you changing your major?","meaning":"为什么跨专业","keys":"why / law / change / major","a":"When I worked on a software project, I started thinking about how data should be used and who should be responsible for mistakes. I want to understand these questions through legal study. That is why I am applying for law.","translation":"做软件项目时，我开始思考数据应如何使用、出错谁负责。我希望通过法律学习理解这些问题。","hint":"不贬低工科，也不用说自己突然放弃过去全部学习。"},{"id":"E03","group":"常用必背","q":"Why did you choose our university?","variant":"Why do you want to study here?","meaning":"为什么选择本校","keys":"why / university / here","a":"I am interested in the way your program connects law and technology. It fits the questions I want to study. I also know that I need solid legal training, and I hope to develop it here.","translation":"关注课程对法律与科技的结合，也希望在这里接受扎实的法律训练。","hint":"说这段前确认目标项目确有相关培养内容；不要编导师论文或保证一定能获得某项资源。"},{"id":"E04","group":"常用必背","q":"Tell us about your hometown.","variant":"Where are you from?","meaning":"介绍家乡","keys":"hometown / where / from","a":"My hometown has a strong sense of local culture. What I value most is the close connection between people. Living there taught me to listen and communicate. I would be happy to share more about it.","translation":"家乡有自己的地方文化。我重视人与人的联系，也从生活中学习倾听和沟通。","hint":"这是无地名公开骨架；现场开头补真实城市，再补一个自己熟悉的地方或食物即可，不背旅游宣传词。"},{"id":"E05","group":"常用必背","q":"Could you introduce your project?","variant":"What was your project about?","meaning":"项目概述","keys":"project / about / introduce","a":"I worked on a small food recommendation prototype with AI assistance. It combines images and numerical information to predict scores and show suggestions. I used simulated data to test the process, so I cannot claim that it has proven health benefits.","translation":"AI辅助完成小型饮食推荐原型，融合图片和数值预测评分；模拟数据只能验证流程，不能证明健康效果。","hint":"prototype读不顺可说a small demo system；simulated data可解释成data made for testing。"},{"id":"E06","group":"常用必背","q":"What did you do in the project?","variant":"What was your own contribution?","meaning":"本人贡献","keys":"you / do / own / contribution","a":"I organized the data and helped connect the model with the interface. AI assisted me with the code. I am still improving my understanding, but I can explain the main data flow and the limits of the current version.","translation":"负责整理数据、连接模型和界面，AI辅助代码；仍在加深理解，能说明主流程和边界。","hint":"不要说I wrote every line myself；能够现场解释什么就说到什么。"},{"id":"E07","group":"常用必背","q":"What is the main limitation of your project?","variant":"What would you improve first?","meaning":"项目局限","keys":"limitation / improve / first","a":"The main limitation is the use of simulated ratings. They help test the process, but they do not prove that real users will like the results. I would first improve the data and compare the model with a simple baseline.","translation":"主要局限是模拟评分；先改善数据，再与简单基线比较。","hint":"听到improve回答改进；听到limitation先点明一个缺点，不把两者顺序说反。"},{"id":"E08","group":"常用必背","q":"What are your strengths?","variant":"What makes you a suitable candidate?","meaning":"个人优势","keys":"strengths / suitable / candidate","a":"I am willing to learn unfamiliar things step by step. I also try to make complicated information clear. These habits helped me in project work, and I think they can help me when I study law.","translation":"愿意一步步学习陌生领域，努力把复杂信息理清，这些习惯能帮助法律学习。","hint":"说一个能对应实际经历的习惯即可，不堆十个形容词。"},{"id":"E09","group":"常用必背","q":"What is your biggest weakness?","variant":"What do you need to improve?","meaning":"不足","keys":"weakness / need / improve","a":"My spoken English still needs work, especially when I hear a question quickly. I am practicing short questions and answering aloud. I want to understand the main point first and give a clear answer.","translation":"口语尤其快速听题还需提高，正在练短问题与开口回答，先抓主旨再清楚表达。","hint":"不要说My English is very poor之后停住；不足后面接正在做的具体动作。"},{"id":"E10","group":"常用必背","q":"What are your plans for graduate study?","variant":"What will you do during your master's studies?","meaning":"研究生计划","keys":"plans / graduate / master's","a":"First, I want to study the basic legal subjects carefully. Then I hope to explore data protection and intellectual property through real cases. I will also keep practicing English so that I can read and discuss legal materials more confidently.","translation":"先学基础法，再结合案例了解数据保护和知识产权，同时提高英语。","hint":"first / then / also三个连接词足够，不必背复杂年度规划。"},{"id":"E11","group":"常用必背","q":"What are your career goals?","variant":"What would you like to do in the future?","meaning":"职业规划","keys":"career / goals / future","a":"I hope to work on legal issues related to technology, such as software licensing or data protection. I am still learning about the different roles. For now, my priority is to build sound legal knowledge and practical skills.","translation":"希望接触软件许可、数据保护等工作，仍在了解职业分工，当前重点是法律知识和实践能力。","hint":"承认具体岗位还在了解，比同时声称精通多个业务方向可信。"},{"id":"E12","group":"常用必背","q":"Do you have any legal experience?","variant":"Have you studied law before?","meaning":"法学经历","keys":"legal / experience / studied","a":"I have started learning the basic structure of civil law, criminal law, and other core subjects. I do not have formal legal practice experience. My technical work has given me questions about data use and responsibility, which I want to study further.","translation":"开始学习基础法框架，没有正式法律执业经历；技术工作带来了数据与责任问题。","hint":"行政协助、景区实践不能直接包装成办案或提供法律意见。"},{"id":"E13","group":"常用话题","q":"How do you deal with pressure?","variant":"What do you do when you feel stressed?","meaning":"压力","keys":"pressure / stressed / deal with","a":"I break a large task into smaller steps and start with the most urgent one. If I get stuck, I check what I do not understand and ask for help. Having a clear next step usually makes me calmer.","translation":"拆小任务，先做紧急部分，卡住时明确问题并求助。","hint":"只要真实即可，不编“从不焦虑”。"},{"id":"E14","group":"常用话题","q":"Tell us about teamwork.","variant":"How do you work with other people?","meaning":"合作","keys":"teamwork / other people / work with","a":"I think teamwork starts with clear responsibilities. I try to explain what I can do and ask about the parts I do not understand. When there is a disagreement, I prefer to compare the reasons and evidence before deciding.","translation":"先明确职责，不懂就问，有分歧时比较理由和证据。","hint":"被追问具体竞赛时，另用真实分工回答，不能把全部团队成果当成个人成果。"},{"id":"E15","group":"常用话题","q":"What was a challenge you faced?","variant":"Tell us about a difficulty in your project.","meaning":"困难","keys":"challenge / difficulty / faced","a":"One challenge was keeping different data sources consistent. A small mismatch could affect the whole process. I learned to check the links between inputs and outputs, instead of only looking at whether the program could run.","translation":"不同来源数据要一致，小错配会影响流程；检查输入输出的对应关系。","hint":"这是可解释的技术难点，不等于声称某个具体bug已由自己修好。"},{"id":"E16","group":"常用话题","q":"What do you do in your free time?","variant":"What are your hobbies?","meaning":"兴趣","keys":"free time / hobbies / enjoy","a":"I like taking a walk when I need a break. It helps me slow down and organize my thoughts. I prefer simple activities that help me return to my work with a clear mind.","translation":"以散步为例，说明如何放松和理清思路。","hint":"可替换示例：仅在确实喜欢散步时使用；否则换成自己的真实活动，不编阅读或运动经历。"},{"id":"E17","group":"常用话题","q":"What course did you enjoy most?","variant":"What is your favorite subject?","meaning":"课程","keys":"course / favorite / subject","a":"I found data analysis useful because it taught me to check information before drawing a conclusion. I also learned that the quality of the data matters. I think this careful attitude can help with legal study.","translation":"数据分析帮助检查信息和重视数据质量，这种谨慎态度也能用于法律学习。","hint":"若不是最喜欢这门课，可说One subject I found useful was data analysis；不要硬造排名第一的偏好。"},{"id":"E18","group":"常用话题","q":"What have you read about law recently?","variant":"Can you recommend a legal book?","meaning":"阅读","keys":"read / recently / book","a":"I am still building my foundation, so I have focused on basic legal materials and the Civil Code. One point that interests me is how the law protects personal information. I would rather discuss a point I understand than give a long list of books.","translation":"目前集中基础材料和民法典，愿讨论真正理解的知识点，不罗列书名。","hint":"没读完整本就不要声称读完；上面是回答思路，现场按实际阅读进度说。"},{"id":"E19","group":"常用话题","q":"How will your technical background help you study law?","variant":"What connects software engineering and law?","meaning":"法工联系","keys":"technical / background / connects","a":"My technical background helps me understand how a system uses data and produces a result. Legal study asks further questions about rights, duties, and responsibility. I think the two can support each other, but technical skills cannot replace legal training.","translation":"技术帮助理解流程，法律进一步讨论权利义务责任，二者互补。","hint":"不要说工科生比文科生更理性，也不要说软件规则与法律完全相同。"},{"id":"E20","group":"常用话题","q":"How do you improve your English?","variant":"What is your English study plan?","meaning":"英语计划","keys":"improve / English / plan","a":"I listen to short interview questions and try to catch the key words. Then I answer in simple sentences and say the answer again without reading. I also check words that I often miss and practice them separately.","translation":"听短题抓关键词，用简单句答，再脱稿复述，单练听漏的词。","hint":"这是本页能马上执行的练法，不许诺短期彻底解决全部听说问题。"},{"id":"E21","group":"常用话题","q":"Will you accept our offer?","variant":"Are you serious about joining our program?","meaning":"录取意愿","keys":"offer / accept / join","a":"I am serious about this application. I value the chance to study in your program. If I accept an offer, I will honor my decision and complete the required steps on time.","translation":"认真申请、珍惜机会；一旦接受承诺就按时完成手续。","hint":"若你已经确定“录取就来”，可真实改为Yes, I will accept it. 未确定时不能背虚假无条件承诺。"},{"id":"E22","group":"常用话题","q":"What do you expect from your supervisor?","variant":"How would you communicate with a professor?","meaning":"导师沟通","keys":"supervisor / expect / communicate","a":"I hope to receive guidance on how to ask a clear research question and support my answer with evidence. I would prepare before a meeting and explain where I need help. I also understand that I must do the basic work myself.","translation":"希望学习提出清晰问题与证据论证，会前准备、明确求助点，基础工作自己完成。","hint":"不编已联系某位导师或已获导师认可。"},{"id":"E23","group":"常用话题","q":"Do you have any questions for us?","variant":"Is there anything you would like to ask?","meaning":"反问","keys":"questions / for us / ask","a":"Thank you. I would like to know how students from a technical background usually build their legal foundation in the first year.","translation":"询问技术背景学生第一年怎样建立法律基础。","hint":"只问一个与学习有关、官网没直接说明的问题；也可礼貌说没有其他问题。"},{"id":"E24","group":"常用话题","q":"Tell us about a practical experience.","variant":"What did you learn outside the classroom?","meaning":"社会实践","keys":"practical / experience / outside","a":"In a practical activity, I helped explain information to visitors and answer their questions. I learned to adjust my words to different people. It reminded me that knowing something and explaining it clearly are different skills.","translation":"以真实的讲解协助经历说明如何因人调整表达；知道与讲清楚不同。","hint":"公开版省去机构、地点和时间。现场可以补真实经历，不说自己提供过法律咨询。"},{"id":"L01","group":"法律英语","q":"What is law, in your view?","variant":"How do you understand law?","meaning":"如何理解法律","keys":"law / view / understand","a":"To me, law provides rules for how people live and work together. It protects rights, sets duties, and limits public power. Studying law also means learning how to explain and apply these rules fairly.","translation":"法律提供共同生活规则，保护权利、设定义务、约束公权力，也涉及公平解释和适用。","hint":"rights是权利，duties是义务；不要把rights说成powers。"},{"id":"L02","group":"法律英语","q":"What is personal information?","variant":"Why is data protection important?","meaning":"个人信息","keys":"personal / information / data protection","a":"Personal information is information that can identify a person, on its own or together with other information. Protecting it helps people keep control over how information about them is used. Health information needs particular care.","translation":"能单独或结合识别个人的信息；保护其使用，健康信息尤需谨慎。","hint":"此处简单概念答复；被追问法律时可以说China's Personal Information Protection Law。"},{"id":"L03","group":"法律英语","q":"What is intellectual property?","variant":"What legal issues can software raise?","meaning":"知识产权","keys":"intellectual property / software / legal issues","a":"Intellectual property protects certain creations and technical achievements. For software, I would first consider copyright and licensing. Some technical solutions may raise patent questions, but a software project does not automatically receive a patent.","translation":"软件先想到著作权与许可，技术方案可能涉及专利，但不会自动获得专利。","hint":"copyright著作权；patent专利；license许可。"},{"id":"L04","group":"法律英语","q":"How can AI be used in legal work?","variant":"What is the future of AI in law?","meaning":"AI与法律","keys":"AI / legal work / future","a":"AI can help with legal research, document review, and drafting. But it may produce incorrect facts or legal references. People should check important results and remain responsible for decisions. I see it as a useful tool with clear limits.","translation":"AI可辅助检索、审阅和起草，但会出错，重要结果需核实，人承担决策责任。","hint":"研究research、审阅review、起草drafting三选一两项就够，不必全念。"},{"id":"L05","group":"法律英语","q":"What is a contract?","variant":"Why should a contract be respected?","meaning":"合同","keys":"contract / agreement / respected","a":"A contract is an agreement that creates, changes, or ends legal rights and duties between parties. It helps people plan and cooperate. But not every agreement is valid, so we also need to consider the legal requirements.","translation":"合同安排当事人权利义务，帮助合作和预期；仍要满足法律要求。","hint":"不要说所有双方同意的内容都有效。"},{"id":"L06","group":"法律英语","q":"What is the difference between civil law and criminal law?","variant":"How do civil and criminal liability differ?","meaning":"民刑区别","keys":"civil / criminal / difference","a":"In this comparison, civil law mainly deals with personal and property relations between equal parties. Criminal law defines crimes and penalties. The same event may raise both kinds of issues, but their rules and purposes are different.","translation":"民法调整平等主体人身财产关系，刑法规定犯罪与刑罚，同一事件可能涉及两者。","hint":"civil law也可指大陆法系；若问题含common law，应改答法系比较，先确认语境。"},{"id":"L07","group":"法律英语","q":"Why does fairness matter in an algorithm?","variant":"Should AI decisions be explained?","meaning":"算法公平","keys":"fairness / algorithm / explained","a":"A result may look accurate overall but still treat some people unfairly. We need to check who is affected and whether they can question a decision. An explanation should help people understand the result and seek a review when necessary.","translation":"总体准确不等于对每个人公平，应看影响、说明和复核机会。","hint":"这里是简短观点；法定义务仍取决于自动化决策的具体场景。"},{"id":"L08","group":"法律英语","q":"What interests you about cross-border legal work?","variant":"What should we consider when data crosses borders?","meaning":"涉外与数据","keys":"cross-border / borders / data","a":"I am interested in how different legal systems deal with the same technology. When data moves across borders, we need to consider who receives it, how it will be used, and what legal protections apply.","translation":"关注不同法律制度如何处理同一技术，跨境时看接收者、用途和适用保护。","hint":"不声称已有跨境合规实务经验；cross-border是“跨境”。"}],"introFull":"Good morning, professors. Thank you for this opportunity. I study software engineering, and I am interested in law and technology. I have worked on a small recommendation prototype with AI assistance. This made me think about data protection and responsibility. I know that I still need solid legal training, so I am now working on the basic subjects. I am also practicing my English every day. I hope to bring a careful approach to my future studies. Thank you.","introShort":"Good morning, professors. I study software engineering and want to learn more about law and technology. My project work made me think about data protection and responsibility. I hope to build a solid legal foundation and keep improving my English. Thank you.","repairs":[["R1","Sorry, could you repeat the question, please?","抱歉，可以重复一下问题吗？"],["R2","Could you speak a little more slowly, please?","可以说得稍慢一些吗？"],["R3","Do you mean my role in the project?","您是指我在项目中的职责吗？确认后再答，不自顾自换题。"],["R4","May I have a moment to think?","可以给我一点时间思考吗？随后必须开始回答。"],["R5","Let me put it more simply.","让我用更简单的话说明。说乱时收回一句核心。"],["R6","I have not studied that in detail yet. My basic understanding is that...","还未深入学习；先诚实说明，再接你确实知道的一点，不胡编。"]],"intro":[["考前30分钟","5分钟：一分以内介绍读两遍，再只看关键词讲一遍。15分钟：常用必背12题先听后答。5分钟：法律英语只练L02、L03、L04。最后5分钟：随机盲听，听不懂就练请求重复。"],["自然表达的节奏","每句表达一个意思。介绍里的停顿放在专业、项目、兴趣、计划之间；停一秒再接下一句，比用很长句子赶时间更清楚。别因为漏掉一个冠词就从头重来。"],["公开稿与真实表达","不填写姓名、学校、家乡具体城市、奖项分数和单位名称。现场需要时自行补充。标注“可替换示例”的兴趣或偏好按真实情况调整；公共练习稿不等于替你确认每一项个人事实。"]],"sections":[{"title":"听题分流：抓住动词和对象","rows":[["Why…","问原因：because＋一个具体原因。"],["What did you do / your role…","问个人贡献：I organized… / I helped…，不要重讲项目背景。"],["How…","问方法：First… Then…，两步就能起答。"],["What is…","问定义：先给一句概念，再一个简单例子。"],["Difference…","问比较：A… while B…，抓一个关键区别。"],["Limitation / improve…","问不足或改进：The main limitation is… / I would first…。"],["Could you elaborate / give an example?","要求展开或举例，别误听成换新话题；补一个具体场景即可。"]]},{"title":"12个法律词：会听、会解释即可","rows":[["law / rule of law","法律 / 法治"],["rights / duties","权利 / 义务"],["public power","公权力"],["personal information","个人信息"],["data protection","数据保护"],["consent","同意"],["intellectual property","知识产权"],["copyright / patent","著作权 / 专利"],["license / contract","许可 / 合同"],["liability / responsibility","法律责任 / 责任（较宽泛）"],["fairness / transparency","公平 / 透明"],["legal research / review","法律检索研究 / 审阅或复核"]]}],"sources":[["个人信息保护法中文原文","https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm"],["民法典中文原文","https://www.cac.gov.cn/2020-06/01/c_1592561777268319.htm"]],"audio":{"file":"english-listening.wav","voice":"Microsoft Zira Desktop (locally synthesized)","bytes":8965004,"seconds":280.15,"clips":{"introFull":{"start":0,"end":36.41},"introShort":{"start":36.66,"end":56.92},"R1":{"start":57.17,"end":61.675},"R2":{"start":61.925, 'use strict';const D=JSON.parse(document.querySelector('#rescueData').textContent),EN=D.kind==='english',KEY='rescue-'+D.kind+'-v1',$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved={},deck=[],current=null,left=60,timer=null,audio=null,clipEnd=0,clipWatcher=null;
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(_) {$('#notice').textContent='保存不可用，请使用导出。'}stats()}
function pool(){const g=$('#group').value,t=$('#search').value.trim().toLowerCase();return D.cards.filter(c=>(!g||c.group===g)&&(!$('#weak').checked||saved[c.id]?.mark===0)&&(!t||[c.id,c.q,c.a,c.meaning,c.keys,c.variant].join(' ').toLowerCase().includes(t)))}
function stats(){$('#stats').textContent=`筛选 ${pool().length}/${D.cards.length} · 已会 ${D.cards.filter(c=>saved[c.id]?.mark===1).length} · 待复习 ${D.cards.filter(c=>saved[c.id]?.mark===0).length}`}
let playbackToken=0;
function stopTimer(){clearInterval(timer);timer=null}function stopAudio(){playbackToken++;if(audio)audio.pause();clearInterval(clipWatcher);if('speechSynthesis'in window)speechSynthesis.cancel();if(EN)$('#audioStatus').textContent='已停止。'}
function play(id){const c=D.audio?.clips?.[id];stopAudio();const token=playbackToken;if(!c){$('#audioStatus').textContent='此条无预录音频，可使用系统朗读。';return}if(!audio){audio=new Audio(D.audio.file);audio.preload='none';audio.addEventListener('error',()=>{$('#audioStatus').textContent='音频加载失败，请检查网络，或使用系统朗读。'})}const failed=()=>{if(token===playbackToken)$('#audioStatus').textContent='浏览器暂未播放，请再次点击播放按钮。'};function begin(){if(token!==playbackToken)return;clipEnd=c.end;audio.playbackRate=+$('#rate').value;audio.currentTime=c.start;const pr=audio.play();if(pr)pr.catch(failed);$('#audioStatus').textContent='正在播放通用练习音频。';clipWatcher=setInterval(()=>{if(audio.currentTime>=clipEnd){audio.pause();clearInterval(clipWatcher);$('#audioStatus').textContent='播放完毕，可以重复。'}},45)}if(audio.readyState>=1)begin();else{audio.addEventListener('loadedmetadata',begin,{once:true});const pr=audio.play();if(pr)pr.catch(failed);$('#audioStatus').textContent='正在加载练习音频（约9MB，首次可能需要片刻）。'}}
function speak(text){stopAudio();if(!('speechSynthesis'in window)){$('#audioStatus').textContent='此浏览器不支持系统朗读，请读短答并使用题目预录音频。';return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=+$('#rate').value;const voices=speechSynthesis.getVoices(),v=voices.find(v=>/^en/i.test(v.lang)&&v.localService)||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);$('#audioStatus').textContent='系统朗读中；是否联网取决于设备语音设置，只朗读预设英文。'}
function introCard(){if(!EN)return '';return `<section class="card"><h2>约45—60秒自我介绍</h2><p class="muted">79词，实际时长因语速而异。现场若补姓名和学校，适当缩短一句。不要逐词死背，记住五个意思即可。</p><p class="english">${e(D.introFull)}</p><div class="row controls"><button data-audio="introFull">播放介绍</button><button data-say="introFull">系统朗读</button></div><p>中文逻辑：感谢机会 → 软件背景 → AI辅助项目 → 数据与责任兴趣 → 补法律和英语基础。</p><p class="warning">关键词：software engineering / small prototype / data protection / legal training / English。换词不会说时，用small project替代prototype，不要整段重来。</p><details><summary>紧张时：约25—35秒短版</summary><p class="english">${e(D.introShort)}</p><button data-audio="introShort">播放短版</button></details></section><section class="card"><h2>听不懂时，先稳住六句话</h2>${D.repairs.map(([id,en,cn])=>`<div class="word"><button data-audio="${id}">听 ${id}</button><div><strong>${e(en)}</strong><br>${e(cn)}</div></div>`).join('')}</section>`}
function overview(){stopTimer();stopAudio();current=null;stats();$('#main').innerHTML=introCard()+D.intro.map(([t,p])=>`<section class="card"><h2>${e(t)}</h2><p>${e(p)}</p></section>`).join('')+D.sections.map(s=>`<section class="card"><h2>${e(s.title)}</h2>${s.rows.map(([a,b])=>`<div class="word"><strong>${e(a)}</strong><div>${e(b)}</div></div>`).join('')}</section>`).join('')+`<section class="card"><h2>核对来源</h2><p>技术事实按当前源码梳理；法律和技术参考入口如下。英文是便于开口的学习表达，不冒充法律官方译文。</p>${D.sources.map(([t,u])=>`<p><a href="${e(u)}" target="_blank" rel="noopener noreferrer">${e(t)}</a></p>`).join('')}</section>`;history.replaceState(null,'',location.pathname)}
function list(){stopTimer();stopAudio();current=null;stats();const p=pool();$('#main').innerHTML=p.length?p.map(c=>`<button class="listitem" data-open="${c.id}"><small>${e(c.id+' · '+c.group)} · ${saved[c.id]?.mark===1?'已会':saved[c.id]?.mark===0?'待复习':'未标记'}</small><br>${e(c.q)}${EN?'<br><small>'+e(c.meaning)+'</small>':''}</button>`).join(''):'<section class="card">没有匹配题目，请清空搜索或取消待复习。</section>'}
function show(id,blind=false){const c=D.cards.find(c=>c.id===id);if(!c)return;stopTimer();stopAudio();current=id;left=60;const s=saved[id]||{};$('#main').innerHTML=`<article class="card" id="practice"><span class="tag">${e(c.id+' · '+c.group)} · ${blind&&EN?'盲听模式':'逐题练习'}</span><h2>${blind&&EN?'先听问题，再开口回答':e(c.q)}</h2>${EN?`<div class="row controls"><button data-audio="${c.id}-q">听原问法</button><button data-audio="${c.id}-v">听另一种问法</button><button data-say="question">系统读题</button><button id="showQuestion">看题意与关键词</button></div><div id="question" ${blind?'hidden':''}><p class="english">${e(c.q)}</p><p class="english muted">${e(c.variant)}</p><p><strong>题意：</strong>${e(c.meaning)}<br><strong>听这些词：</strong>${e(c.keys)}</p></div>`:''}<div class="row controls" style="margin-top:15px"><span id="clock" class="timer">60秒</span><button id="timer">开始／暂停</button><button id="reset">重置</button><button id="reveal">看回答</button></div><div id="answer" hidden><div class="answer"><strong>${EN?'简单短答':'自然短答'}</strong><p class="${EN?'english':''}">${e(c.a)}</p>${EN?`<button data-say="answer">系统朗读回答</button><p>${e(c.translation)}</p>`:''}</div>${EN?`<p class="warning">${e(c.hint)}</p>`:`<details><summary>${e(c.fq)}</summary><p>${e(c.fa)}</p></details>`}</div><div class="row controls" style="margin-top:15px"><button data-mark="0" class="${s.mark===0?'active':''}">待复习</button><button data-mark="1" class="${s.mark===1?'active':''}">能说清</button><button id="back">返回题目清单</button></div><label style="display:block;margin-top:16px">我的关键词<textarea id="note" placeholder="记几个能带出答案的词">${e(s.note||'')}</textarea></label></article>`;$('#note').oninput=()=>{saved[id]={...saved[id],note:$('#note').value};save()};history.replaceState(null,'','#q='+id);stats();if(blind&&EN)play(id+'-q');if(blind)$('#practice').scrollIntoView({block:'start',behavior:'smooth'})}
$('#main').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.open)show(b.dataset.open);if(b.dataset.audio)play(b.dataset.audio);if(b.dataset.say){const c=D.cards.find(c=>c.id===current);speak(b.dataset.say==='question'?c.q:b.dataset.say==='answer'?c.a:D[b.dataset.say])}if(b.id==='showQuestion')$('#question').hidden=false;if(b.id==='reveal'){$('#answer').hidden=!$('#answer').hidden;b.textContent=$('#answer').hidden?'看回答':'收起回答'}if(b.id==='timer'){if(timer)stopTimer();else if(left>0)timer=setInterval(()=>{left--;$('#clock').textContent=left+'秒';if(!left){stopTimer();$('#notice').textContent='时间到。用一句话结束，再看答案。'}},1000)}if(b.id==='reset'){stopTimer();left=60;$('#clock').textContent='60秒'}if(b.dataset.mark!==undefined){saved[current]={...saved[current],mark:+b.dataset.mark};save();document.querySelectorAll('[data-mark]').forEach(x=>x.classList.toggle('active',x===b))}if(b.id==='back')list()};
$('#overview').onclick=overview;$('#list').onclick=list;$('#random').onclick=()=>{const p=pool();if(!p.length){list();return}if(!deck.length){deck=p.map(c=>c.id);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}show(deck.pop(),true);$('#notice').textContent='本轮剩余 '+deck.length+' 题，抽完前不重复。'};
for(const g of [...new Set(D.cards.map(c=>c.group))])$('#group').add(new Option(g,g));for(const id of ['#group','#search','#weak'])$(id).addEventListener(id==='#search'?'input':'change',()=>{deck=[];list()});
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({format:KEY,progress:saved},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=D.kind+'-practice.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{const x=JSON.parse(await $('#file').files[0].text());if(x.format!==KEY||!x.progress)throw Error();for(const [id,v]of Object.entries(x.progress)){if(!D.cards.some(c=>c.id===id)||!v||typeof v!=='object')continue;const s={};if([0,1].includes(v.mark))s.mark=v.mark;if(typeof v.note==='string')s.note=v.note.slice(0,10000);saved[id]={...saved[id],...s}}save();$('#notice').textContent='已合并记录。';if(current)show(current);else list()}catch(_) {$('#notice').textContent='导入失败，请选择当前页面导出的记录。'}$('#file').value=''};
if(EN){$('#audioTools').hidden=false;$('#stopAudio').onclick=stopAudio;$('#rate').onchange=()=>{if(audio)audio.playbackRate=+$('#rate').value}}
function route(){const id=(location.hash.match(/^#q=([A-Z]\d+)$/)||[])[1];if(id&&D.cards.some(c=>c.id===id))show(id);else overview()}window.addEventListener('hashchange',route);window.addEventListener('pagehide',()=>{stopTimer();stopAudio()});route();
