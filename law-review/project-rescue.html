</style></head><body><header><small>QUICK PRACTICE / LISTEN · THINK · SPEAK</small><h1>项目面试急救</h1><p>把流程讲顺，把贡献说实，把法律问题落到具体规则。</p><nav class="links"><a href="index.html">五科串讲</a><a href="predictions.html">预测100题</a><a href="english-rescue.html">英语面试急救</a></nav></header><div class="shell"><div class="bar"><div class="row"><button id="overview">先看急救地图</button><button id="list">逐题练习</button><button id="random">随机模拟</button><select id="group" aria-label="题目类别"><option value="">全部类别</option></select><input id="search" type="search" aria-label="搜索" placeholder="搜题号或关键词"><label><input type="checkbox" id="weak"> 待复习</label></div><div class="row controls" style="margin-top:10px"><button id="export">导出记录</button><button id="import">导入记录</button><input id="file" type="file" accept="application/json" hidden><span id="stats" class="muted"></span></div><div id="audioTools" class="row controls" style="margin-top:10px" hidden><label>音频语速 <select id="rate"><option value="0.85">慢速0.85×</option><option value="1" selected>正常1×</option><option value="1.1">稍快1.1×</option></select></label><button id="stopAudio">停止声音</button><span class="audio-status" id="audioStatus">点击按钮播放；不录音、不上传声音。</span></div></div><div id="notice" role="status"></div><main id="main"></main><footer>2026-09-15 · 不署名公开练习稿。未附个人简历、身份信息、项目原始文件或数据。笔记只存当前浏览器，可导入导出；本页不录音。英语题目音频为预先合成的通用练习内容，系统朗读只使用页面预设英文。网页和音频来自同一站点，无统计脚本。</footer></div><script id="rescueData" type="application/json">{"kind":"project","title":"项目面试急救","subtitle":"把流程讲顺，把贡献说实，把法律问题落到具体规则。","cards":[{"id":"P01","group":"必背","q":"请用半分钟介绍一下项目。","a":"我做的是一个饮食推荐原型。它把用户信息、菜品营养和图片放到同一条流程里，先预测评分，再按预算等条件筛选展示。我负责数据梳理和系统搭建，代码实现借助了AI。现阶段主要用模拟评分验证流程，还不能据此说推荐已经改善了真实用户的健康。","fq":"再问：你最想让老师记住哪一点？","fa":"我能把数据、模型和界面串起来，也知道现阶段的结果能说明什么、不能说明什么。"},{"id":"P02","group":"必背","q":"代码是AI写的，你到底做了什么？","a":"AI确实参与了代码实现，我不想把这说成全部手写。我主要做的是整理数据、组织系统流程，并在AI辅助下把不同模块接起来。对关键代码，我现在能沿着输入、训练和输出说明它的作用。理解还不够深入的地方，我会继续补，不能把生成出来等同于自己已经掌握。","fq":"再问：能离开AI写吗？","fa":"简单的数据读取、筛选和数据结构我可以先自己写；完整模型的实现我还会查文档。具体掌握程度以我能现场解释和完成的内容为准。"},{"id":"P03","group":"必背","q":"你为什么做这个项目？","a":"“今天吃什么”是个很具体的问题，而且人做选择时会同时考虑预算和身体情况。我想借这个场景练习从整理数据到展示结果的完整流程。后来我更在意的是，界面一旦写“健康推荐”，用户会不会过度相信它，这让我开始关注技术表达和责任的边界。","fq":"再问：一开始就是为了研究法律吗？","fa":"不是一开始就有完整法律研究计划。是在回看功能和数据使用时，才逐渐形成这些问题意识。"},{"id":"P04","group":"必背","q":"数据真实吗？你做过真实用户实验吗？","a":"用户画像和评分主要是模拟生成的。评分根据口味、菜系匹配加上随机扰动构造，不是真实点击或问卷反馈。因此我把它当作流程验证，不能把验证损失当作真实推荐效果。目前没有可以支撑医疗效果或商业效果的用户实验结论。","fq":"再问：这样还有价值吗？","fa":"有工程练习价值，能检查数据能否进入模型、模型能否接到界面。但真实效果是下一阶段要重新验证的事。"},{"id":"P05","group":"必背","q":"多模态具体体现在哪里？","a":"模型有三类输入：用户和菜品ID、身体与营养数值、菜品图片。ID经过Embedding，图片经过预训练ResNet18提取特征，数值经过全连接层，最后拼接并预测一个分数。这里没有接入文本大模型，也没有把菜名描述编码成文本向量。","fq":"再问：图片是识别菜名吗？","fa":"当前主要是提取图片表示供评分使用，没有单独输出菜品类别，也没有完成用户上传照片的识别闭环。"},{"id":"P06","group":"必背","q":"你预测的到底是什么？","a":"预测的是模拟用户对一道菜的评分，所以训练按回归任务处理。得到各候选菜品的分数后，再排序和筛选。这个分数不是营养安全概率，也不是疾病风险，更不能解释成“适合程度百分之多少”。","fq":"再问：函数叫classifier，不是分类吗？","fa":"要看标签、输出和损失，不只看变量名。这里输出一个连续值，用的是MSE评分回归。"},{"id":"P07","group":"必背","q":"用一句话把数据流讲清楚。","a":"用户表、菜品表和评分表先按ID对齐；每条评分取出用户数值、菜品数值和图片，交给融合模型预测分数，训练后保存权重。界面输入身体信息，再对候选菜品批量评分，按价格和可选低热量条件筛选，展示前几项。","fq":"再问：为什么要三张表？","fa":"用户和菜品各有自己的属性，评分表记录二者的关系；分开保存便于复用和检查ID对应。"},{"id":"P08","group":"必背","q":"真实输入字段有哪些？是不是所有字段都用了？","a":"真正进入数值分支的是年龄、BMI、体重，以及热量、蛋白质、脂肪。身高用于计算BMI。界面有性别，但当前没有进入模型；价格用于后筛选。表里存在的字段，不等于训练实际使用的特征。","fq":"再问：健康目标、过敏史呢？","fa":"当前没有完整的疾病或过敏硬约束，不能把这些说成已经实现的安全保障。"},{"id":"P09","group":"必背","q":"你怎么训练和评价模型？","a":"训练脚本把评分记录随机分为训练和验证两部分，用MSE衡量预测与模拟评分的误差，Adam更新参数，保存验证损失更低的权重。代码里没有完整的独立测试、基线和消融结果，所以我不会临时编一个准确率。","fq":"再问：下一步怎么评？","fa":"先与简单规则或均值基线比较，再做去掉图片的消融；有合法真实反馈后，才用排名指标和用户评价判断实际价值。"},{"id":"P10","group":"必背","q":"模拟标签由规则生成，为什么不直接用规则？","a":"这个问题很关键。以当前数据规模和标签来源，规则方法完全值得作为基线，深度学习并没有被证明更好。我采用融合模型主要是练习多类输入如何接入统一评分流程。真要做产品，我会先用比较实验决定复杂度是否值得。","fq":"再问：那你的创新是什么？","fa":"我不把组合成熟模型说成算法原创。这个阶段的价值是流程整合和对局限的识别。"},{"id":"P11","group":"必背","q":"你觉得项目最大的缺点是什么？","a":"首先是模拟标签限制了结论；其次，新用户在界面里共用默认ID，个性化能力很有限；另外，还缺少可靠的健康约束和充分评估。我会优先解决数据与评价，而不是先换一个更大的模型。","fq":"再问：系统不是能运行吗？","fa":"能运行说明工程链路连通，不等于结论可信，更不等于适合真实健康决策。"},{"id":"P12","group":"必背","q":"这个项目和法律有什么具体联系？","a":"我会先从数据和图片说起：真实身体信息怎么收集和使用，图片有没有使用许可，推荐理由会不会误导用户。如果服务进一步上线，还要考虑自动化决策的说明和救济。对我来说，这些问题很具体，比只说“AI需要监管”更值得继续学习。","fq":"再问：能说出法律名称吗？","fa":"首先是个人信息保护法、民法典和著作权法；涉及对外服务的算法推荐或跨境数据时，再判断相应规则是否适用。"},{"id":"P13","group":"技术","q":"Embedding是什么？它和LabelEncoder有什么区别？","a":"LabelEncoder把ID映射成连续整数，方便索引，它不学习偏好。Embedding是一张可训练的向量表，每个ID对应一段参数，训练中会更新。ID数字大小本身没有“用户更相似”的含义。","fq":"再问：新ID怎么办？","fa":"如果编码器没见过该ID，直接转换可能报错；新用户也没有学好的向量，所以需要专门的冷启动策略。"},{"id":"P14","group":"技术","q":"ResNet18在这里做什么？是否冻结了参数？","a":"它提供预训练的图像特征提取结构，去掉最后分类层后得到512维表示，再降为64维。当前代码没有显式冻结CNN参数，优化器接收整个模型参数，不能说“只训练最后一层”。","fq":"再问：为什么叫残差网络？","fa":"残差连接给网络提供跨层传递信息的路径，帮助较深网络训练；我使用了成熟结构，没有自己提出这套网络。"},{"id":"P15","group":"技术","q":"各路特征怎么融合？","a":"用户和菜品ID各是32维，视觉分支64维，六个数值输入经线性层成为32维，拼接后共160维，再经过多层全连接输出一个分数。拼接让信息一起进入模型，但不能只凭结构就证明每一路都有效。","fq":"再问：怎么证明图片有用？","fa":"需要有无图片的对照实验，保持数据划分和其他条件一致，再看评价变化。"},{"id":"P16","group":"技术","q":"MSE、反向传播和Adam分别是什么？","a":"MSE把预测与标签的差平方后求平均，是训练目标。反向传播计算这个误差对参数的梯度；Adam根据梯度调整参数。简单说就是预测、算误差、算更新方向、调整参数，再重复。","fq":"再问：为什么不用交叉熵？","fa":"当前是连续评分回归，用MSE比较直接。若任务改成类别预测，才要重新设计输出和损失。"},{"id":"P17","group":"技术","q":"batch、epoch和学习率怎么理解？","a":"batch是一次处理的一批样本，epoch是把训练集完整学习一轮，学习率影响参数每次更新的幅度。当前脚本设置批量32、学习率0.001、训练10轮，验证占20%；这是配置，不代表最优组合或已跑完的证明。","fq":"再问：怎么过拟合？","fa":"训练误差变小而验证表现变差是警示，还应检查数据划分、模型复杂度和样本规模。"},{"id":"P18","group":"技术","q":"训练和推理有何不同？eval与no_grad一样吗？","a":"训练会计算梯度并更新参数，推理用学到的参数生成结果。eval切换Dropout和BatchNorm等层的行为；no_grad关闭梯度记录以节省资源。两者作用不同，通常推理时一起用。","fq":"再问：Dropout是什么？","fa":"训练时随机屏蔽一部分单元，减少过度依赖某些特征；评估时不这样随机屏蔽。"},{"id":"P19","group":"技术","q":"预处理做了什么？","a":"图片转RGB、缩放到224乘224，再转张量并做标准化；ID进行编码。六个数值字段在当前代码中直接输入，没有完整保存并复用的数值Scaler。图片缺失时用零张量兜底，但仍应记录和检查缺失，避免问题被静默掩盖。","fq":"再问：零张量就是黑图吗？","fa":"只能称零张量兜底。经过标准化的空间中，零值不等于把原始黑图正常预处理后的结果。"},{"id":"P20","group":"技术","q":"新用户的推荐可靠吗？","a":"当前界面对所有新输入使用默认用户ID零，所以缺少这个人的历史偏好向量；身体数值虽然改变，排序质量仍未充分验证。我不会说已经解决冷启动。可以考虑内容特征方案、未知用户表示或明确的初始偏好问卷，再做验证。","fq":"再问：ID顺序会影响结果吗？","fa":"会。训练编码与推理菜品顺序必须一致，当前推理直接按行编号，有潜在错配风险，应保存并复用映射。"},{"id":"P21","group":"技术","q":"为什么用Python、PyTorch、Streamlit？","a":"Python方便做表格处理和连接不同模块；PyTorch负责张量计算、模型和训练；Streamlit能较快把输入和结果做成演示界面。选择这些主要是为了把原型做完整，不代表我比较过所有框架或有大型线上服务经验。","fq":"再问：pandas和NumPy分别做什么？","fa":"pandas更方便处理带列名的表格，NumPy主要处理数组和数值运算；项目里也用Pillow读取图片。"},{"id":"P22","group":"技术","q":"虚拟环境怎么用？依赖怎么复现？","a":"虚拟环境把不同项目依赖隔开，降低版本冲突。一般先创建并激活环境，再用同一个Python解释器运行pip安装依赖，记录Python和依赖版本。当前目录的requirements文件没有提供完整依赖清单，所以复现说明还需要补齐。","fq":"再问：-i和--index-url能同时当两个源吗？","fa":"它们是同一选项的短长写法，不是两个独立源。安装PyTorch应按官方命令选择对应版本和设备，不随意混用源。"},{"id":"P23","group":"技术","q":"没有GPU能做吗？你在Linux部署过吗？","a":"小规模原型可以用CPU训练和推理，速度取决于模型与数据，代码会检查CUDA是否可用再选择设备。服务器部署需要处理环境、路径、端口和资源限制。如果没有实际完成部署记录，我会把这些说成部署思路，不说成自己的服务器经验。","fq":"再问：必须装完整CUDA Toolkit吗？","fa":"不能一概而论。使用预编译PyTorch通常重点是兼容驱动和合适构建，编译源码或自定义CUDA扩展另有要求。"},{"id":"P24","group":"技术","q":"你遇到过什么困难？","a":"我能具体说明的一个难点是把多张表和图片按ID正确对齐。模型每次要拿到同一个用户、同一道菜对应的数据，这比只把某个函数跑通更重要。若老师问“哪次报错如何解决”，我只讲自己确实做过的排查，不把现在发现的问题包装成过去已解决。","fq":"再问：现在优先修什么？","fa":"统一训练推理的ID映射、明确缺失图片处理、检查数值尺度，再补基线和真实评价；先让流程可靠。"},{"id":"P25","group":"法律","q":"健康数据一定是敏感个人信息吗？","a":"先看信息能否识别到自然人，再结合场景判断是否属于医疗健康等敏感个人信息。单个年龄字段不能一概等同医疗健康信息；身体指标与健康目标结合时应更谨慎。个保法第28条强调特定目的、充分必要性和严格保护措施。","fq":"再问：只要同意就能随便收吗？","fa":"不行。仍要有合法基础、明确目的、最小必要等。依同意处理敏感信息时还需关注单独同意及特别告知，不能把同意当成万能许可。"},{"id":"P26","group":"法律","q":"推荐算法必须解释吗？需要公开源代码吗？","a":"个保法第24条对自动化决策提出透明、公平公正等要求；对个人权益有重大影响的自动化决定，个人有权要求说明，并拒绝仅由自动化决策作出决定。具体义务要看场景，不是所有推荐都必须公开全部源码。","fq":"再问：你界面上的高蛋白提示算解释吗？","fa":"那是阈值规则提示，能解释提示如何出现，但不是证明模型为什么给了这个分数。"},{"id":"P27","group":"法律","q":"网络图片能直接拿来用吗？","a":"能下载不等于有使用权。要核对作者或权利来源、许可范围、署名和商业使用条件。个人学习的合理使用有法定条件，不能理解成课程项目当然免责。若准备公开产品，我会优先使用自有或明确授权素材并保留来源记录。","fq":"再问：robots允许抓取就合法了吗？","fa":"robots是访问约定的一部分，不能代替著作权许可，也不能排除个人信息、合同或其他规则。"},{"id":"P28","group":"法律","q":"如果推荐造成损害，谁负责？","a":"我会先查服务承诺、谁提供信息、谁控制推荐、损害和因果关系，再判断合同或侵权责任。界面写“仅供参考”并不能当然免责，尤其不能用免责声明掩盖误导或安全问题。当前原型也不能用来指导疾病或过敏饮食。","fq":"再问：AI自己承担责任吗？","fa":"目前不应把模型当成可以替人承担责任的独立主体，应分析具体开发、运营和使用者的行为与义务。"},{"id":"P29","group":"法律","q":"软件最契合哪个部门法？是公法还是私法？","a":"若围绕代码保护和许可，我会先定位知识产权，具体常涉及著作权和合同，私权保护是核心。专利行政授权、行政执法和刑事保护又会参与，所以应说明具体关系，而不是只答“公私并存”就结束。","fq":"再问：写出软件就有专利吗？","fa":"不是。代码表达可涉及著作权，技术方案是否能获专利还要经过法定条件和授权程序，二者保护对象不同。"},{"id":"P30","group":"法律","q":"AI写的代码版权归谁？","a":"我不会直接说归AI或全部归使用者。需要看哪些部分有人的独创性贡献、是否复用了第三方代码，以及平台条款和开源许可。即使使用了AI，也要检查依赖许可、保留修改记录并厘清交付权利。","fq":"再问：能保证完全无侵权吗？","fa":"不能只凭“AI生成”作保证。具体来源、相似内容和授权情况还需要核查。"},{"id":"P31","group":"法律","q":"这个项目怎样联系涉外科技法治？","a":"如果软件向境外许可，或把可识别的用户信息交给境外服务，就会增加权利地域性、合同适用法律和数据出境问题。我会先从一个具体场景入手，不因为用了英文工具就称它有涉外业务。","fq":"再问：数据出境一定要安全评估吗？","fa":"不是所有情形都走同一路径，应结合个保法第38、39条和现行配套规则，判断评估、标准合同、认证及适用豁免，同时履行其他保护义务。"},{"id":"P32","group":"法律","q":"AI未来能代替律师或法官吗？","a":"我更看好它先帮助检索、整理事实材料和起草初稿。法律工作还要核实事实、解释规范、听取当事人并承担责任，模型可能编造法条或案例，所以关键输出需要人核验。是否采用某个系统，应看具体任务和纠错机制。","fq":"再问：为什么不继续只学计算机？","fa":"技术训练让我能理解系统怎么运行，但权利边界、许可安排和责任分配还需要法律训练。我希望把这两方面接起来，先把法学基础打牢。"}],"intro":[["30秒先说这一段","我做的是一个饮食推荐原型，负责数据梳理和系统搭建，代码借助AI辅助实现。模型融合ID、营养与身体数值、菜品图片，预测评分后再筛选展示。目前用模拟数据验证流程，还没有充分的真实效果验证。这个过程让我开始关心健康信息如何使用、推荐如何解释，以及出了问题谁负责。"],["20分钟路线","前5分钟：读下面技术地图和事实边界。中间10分钟：只练“必背”12题，先说30秒再看答案。最后5分钟：重点练AI辅助贡献、模拟数据、个人信息保护、软件知识产权。扩展技术题只在主线顺畅后再看。"],["公开练习说明","本页把饮食推荐原型作为不署名练习案例，保留必要技术事实和回答骨架，不公布个人履历、项目时间、数据记录或原始代码。第一人称供口述练习；只有与你实际经历相符的表述才使用。核对依据是当前源码阅读，不是本次重新训练或医学验证。"]],"sections":[{"title":"一张技术地图：输入 → 评分 → 筛选 → 展示","rows":[["数据","用户表＋菜品表＋评分表；用户及评分主要为模拟生成。"],["标签","口味和菜系匹配加分＋随机扰动，裁剪至1—5；没有健康疗效标签。"],["ID分支","用户ID与菜品ID → LabelEncoder索引 → 各32维Embedding。"],["视觉分支","RGB图片 → 224×224与标准化 → 预训练ResNet18去分类头 → 512维 → 64维。"],["数值分支","年龄、BMI、体重＋热量、蛋白质、脂肪，6维输入 → 32维。"],["融合与训练","32＋32＋64＋32＝160维 → MLP → 连续分数；MSE＋Adam；随机80/20训练验证。"],["界面","Streamlit输入 → 批量预测 → 价格与可选低热量后筛 → 展示前6项；命令行入口默认前5项。"]]},{"title":"能说到哪里：四条边界","rows":[["已有代码支持","多源输入、评分训练与权重保存逻辑、加载推理、交互界面、规则筛选；目录存在权重文件，但本轮未重训或复测模型指标。"],["不要当成完成","用户上传识别、医学级健康建议、过敏疾病约束、真实用户推荐成效、文本大模型理解、完善的冷启动。"],["优先承认的局限","模拟标签只验证流程；UI共用用户ID零；训练编码与推理按行编号存在潜在错配；数值未完整标准化；缺少基线及消融。"],["待核实再讲","你亲自排查过的报错、最优损失、准确率、训练耗时、服务器部署和用户实验，不根据脚本注释或旧问答猜测。"]]},{"title":"纠正旧材料中容易背错的内容","rows":[["“有模拟数据就解决冷启动”","模拟数据不等于解决新用户表示和真实偏好学习。"],["“模型学会了健康关系”","架构输入身体数值不代表学到了可信健康规律，标签不支持这个结论。"],["“图片可用于本地学习所以没版权问题”","合理使用有法定条件，本地和非商业也不是自动免责。"],["“pip的-i与--index-url结合可配两个源”","二者是同一参数的短长形式，不能这样解释。"],["“Linux必须手装完整CUDA Toolkit”","预编译框架运行与编译源码／扩展的要求不同，也不要声称拥有未经核实的硬件或部署经历。"]]},{"title":"法律急救：记名称，再记一个适用条件","rows":[["个人信息保护法（法律）","第6条：目的明确、合理与最小范围；第24条：自动化决策；第28—30条：敏感信息；第55条：处理敏感信息、自动化决策等事前影响评估。"],["民法典（法律）","第1034条个人信息保护；第1165条一般过错侵权；第496—497条格式条款。健康提示不等于免责。"],["著作权法（法律）","代码和图片先看保护对象、权利来源、许可范围；软件思想、算法思想与具体表达要区分。"],["互联网信息服务算法推荐管理规定（部门规章）","对实际服务性质、境内互联网信息服务及算法应用判断适用，不能把本地练习直接等同于已履行备案义务。"],["促进和规范数据跨境流动规定（部门规章）","涉及真实境外接收者与出境活动时，结合个保法及现行条件判断路径，不背“所有出境都审批”。"],["一个例子说到底","假设服务把真实身体画像发给境外模型：先辨识个人信息和必要性，再看接收者、合法基础和出境规则，最后考虑替代方案、保护和救济。当前原型并未因此被认定已做这些合规措施。"]]}],"sources":[["个人信息保护法","https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm"],["民法典","https://www.cac.gov.cn/2020-06/01/c_1592561777268319.htm"],["著作权法（2020年修正）","https://www.npc.gov.cn/c2/c30834/202011/t20201119_308796.html"],["算法推荐管理规定","https://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm"],["数据跨境规则官方说明","https://www.cac.gov.cn/2024-03/22/c_1712776612187994.htm"],["PyTorch损失函数文档","https://docs.pytorch.org/docs/stable/generated/torch.nn.MSELoss.html"],["Torchvision ResNet18","https://docs.pytorch.org/vision/stable/models/generated/torchvision.models.resnet18.html"],["pip安装参数","https://pip.pypa.io/en/stable/cli/pip_install/"]]}</script><script>
'use strict';const D=JSON.parse(document.querySelector('#rescueData').textContent),EN=D.kind==='english',KEY='rescue-'+D.kind+'-v1',$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved={},deck=[],current=null,left=60,timer=null,audio=null,clipEnd=0,clipWatcher=null;
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(_) {$('#notice').textContent='保存不可用，请使用导出。'}stats()}
function pool(){const g=$('#group').value,t=$('#search').value.trim().toLowerCase();return D.cards.filter(c=>(!g||c.group===g)&&(!$('#weak').checked||saved[c.id]?.mark===0)&&(!t||[c.id,c.q,c.a,c.meaning,c.keys,c.variant].join(' ').toLowerCase().includes(t)))}
function stats(){$('#stats').textContent=`筛选 ${pool().length}/${D.cards.length} · 已会 ${D.cards.filter(c=>saved[c.id]?.mark===1).length} · 待复习 ${D.cards.filter(c=>saved[c.id]?.mark===0).length}`}
let playbackToken=0;
function stopTimer(){clearInterval(timer);timer=null}function stopAudio(){playbackToken++;if(audio)audio.pause();clearInterval(clipWatcher);if('speechSynthesis'in window)speechSynthesis.cancel();if(EN)$('#audioStatus').textContent='已停止。'}
function play(id){const c=D.audio?.clips?.[id];stopAudio();const token=playbackToken;if(!c){$('#audioStatus').textContent='此条无预录音频，可使用系统朗读。';return}if(!audio){audio=new Audio(D.audio.file);audio.preload='none';audio.addEventListener('error',()=>{$('#audioStatus').textContent='音频加载失败，请检查网络，或使用系统朗读。'})}const failed=()=>{if(token===playbackToken)$('#audioStatus').textContent='浏览器暂未播放，请再次点击播放按钮。'};function begin(){if(token!==playbackToken)return;clipEnd=c.end;audio.playbackRate=+$('#rate').value;audio.currentTime=c.start;const pr=audio.play();if(pr)pr.catch(failed);$('#audioStatus').textContent='正在播放通用练习音频。';clipWatcher=setInterval(()=>{if(audio.currentTime>=clipEnd){audio.pause();clearInterval(clipWatcher);$('#audioStatus').textContent='播放完毕，可以重复。'}},45)}if(audio.readyState>=1)begin();else{audio.addEventListener('loadedmetadata',begin,{once:true});const pr=audio.play();if(pr)pr.catch(failed);$('#audioStatus').textContent='正在加载练习音频（约9MB，首次可能需要片刻）。'}}
function speak(text){stopAudio();if(!('speechSynthesis'in window)){$('#audioStatus').textContent='此浏览器不支持系统朗读，请读短答并使用题目预录音频。';return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=+$('#rate').value;const voices=speechSynthesis.getVoices(),v=voices.find(v=>/^en/i.test(v.lang)&&v.localService)||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);$('#audioStatus').textContent='系统朗读中；是否联网取决于设备语音设置，只朗读预设英文。'}
function introCard(){if(!EN)return '';return `<section class="card"><h2>约45—60秒自我介绍</h2><p class="muted">79词，实际时长因语速而异。现场若补姓名和学校，适当缩短一句。不要逐词死背，记住五个意思即可。</p><p class="english">${e(D.introFull)}</p><div class="row controls"><button data-audio="introFull">播放介绍</button><button data-say="introFull">系统朗读</button></div><p>中文逻辑：感谢机会 → 软件背景 → AI辅助项目 → 数据与责任兴趣 → 补法律和英语基础。</p><p class="warning">关键词：software engineering / small prototype / data protection / legal training / English。换词不会说时，用small project替代prototype，不要整段重来。</p><details><summary>紧张时：约25—35秒短版</summary><p class="english">${e(D.introShort)}</p><button data-audio="introShort">播放短版</button></details></section><section class="card"><h2>听不懂时，先稳住六句话</h2>${D.repairs.map(([id,en,cn])=>`<div class="word"><button data-audio="${id}">听 ${id}</button><div><strong>${e(en)}</strong><br>${e(cn)}</div></div>`).join('')}</section>`}
function overview(){stopTimer();stopAudio();current=null;stats();$('#main').innerHTML=introCard()+D.intro.map(([t,p])=>`<section class="card"><h2>${e(t)}</h2><p>${e(p)}</p></section>`).join('')+D.sections.map(s=>`<section class="card"><h2>${e(s.title)}</h2>${s.rows.map(([a,b])=>`<div class="word"><strong>${e(a)}</strong><div>${e(b)}</div></div>`).join('')}</section>`).join('')+`<section class="card"><h2>核对来源</h2><p>技术事实按当前源码梳理；法律和技术参考入口如下。英文是便于开口的学习表达，不冒充法律官方译文。</p>${D.sources.map(([t,u])=>`<p><a href="${e(u)}" target="_blank" rel="noopener noreferrer">${e(t)}</a></p>`).join('')}</section>`;history.replaceState(null,'',location.pathname)}
function list(){stopTimer();stopAudio();current=null;stats();const p=pool();$('#main').innerHTML=p.length?p.map(c=>`<button class="listitem" data-open="${c.id}"><small>${e(c.id+' · '+c.group)} · ${saved[c.id]?.mark===1?'已会':saved[c.id]?.mark===0?'待复习':'未标记'}</small><br>${e(c.q)}${EN?'<br><small>'+e(c.meaning)+'</small>':''}</button>`).join(''):'<section class="card">没有匹配题目，请清空搜索或取消待复习。</section>'}
function show(id,blind=false){const c=D.cards.find(c=>c.id===id);if(!c)return;stopTimer();stopAudio();current=id;left=60;const s=saved[id]||{};$('#main').innerHTML=`<article class="card" id="practice"><span class="tag">${e(c.id+' · '+c.group)} · ${blind&&EN?'盲听模式':'逐题练习'}</span><h2>${blind&&EN?'先听问题，再开口回答':e(c.q)}</h2>${EN?`<div class="row controls"><button data-audio="${c.id}-q">听原问法</button><button data-audio="${c.id}-v">听另一种问法</button><button data-say="question">系统读题</button><button id="showQuestion">看题意与关键词</button></div><div id="question" ${blind?'hidden':''}><p class="english">${e(c.q)}</p><p class="english muted">${e(c.variant)}</p><p><strong>题意：</strong>${e(c.meaning)}<br><strong>听这些词：</strong>${e(c.keys)}</p></div>`:''}<div class="row controls" style="margin-top:15px"><span id="clock" class="timer">60秒</span><button id="timer">开始／暂停</button><button id="reset">重置</button><button id="reveal">看回答</button></div><div id="answer" hidden><div class="answer"><strong>${EN?'简单短答':'自然短答'}</strong><p class="${EN?'english':''}">${e(c.a)}</p>${EN?`<button data-say="answer">系统朗读回答</button><p>${e(c.translation)}</p>`:''}</div>${EN?`<p class="warning">${e(c.hint)}</p>`:`<details><summary>${e(c.fq)}</summary><p>${e(c.fa)}</p></details>`}</div><div class="row controls" style="margin-top:15px"><button data-mark="0" class="${s.mark===0?'active':''}">待复习</button><button data-mark="1" class="${s.mark===1?'active':''}">能说清</button><button id="back">返回题目清单</button></div><label style="display:block;margin-top:16px">我的关键词<textarea id="note" placeholder="记几个能带出答案的词">${e(s.note||'')}</textarea></label></article>`;$('#note').oninput=()=>{saved[id]={...saved[id],note:$('#note').value};save()};history.replaceState(null,'','#q='+id);stats();if(blind&&EN)play(id+'-q');if(blind)$('#practice').scrollIntoView({block:'start',behavior:'smooth'})}
$('#main').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.open)show(b.dataset.open);if(b.dataset.audio)play(b.dataset.audio);if(b.dataset.say){const c=D.cards.find(c=>c.id===current);speak(b.dataset.say==='question'?c.q:b.dataset.say==='answer'?c.a:D[b.dataset.say])}if(b.id==='showQuestion')$('#question').hidden=false;if(b.id==='reveal'){$('#answer').hidden=!$('#answer').hidden;b.textContent=$('#answer').hidden?'看回答':'收起回答'}if(b.id==='timer'){if(timer)stopTimer();else if(left>0)timer=setInterval(()=>{left--;$('#clock').textContent=left+'秒';if(!left){stopTimer();$('#notice').textContent='时间到。用一句话结束，再看答案。'}},1000)}if(b.id==='reset'){stopTimer();left=60;$('#clock').textContent='60秒'}if(b.dataset.mark!==undefined){saved[current]={...saved[current],mark:+b.dataset.mark};save();document.querySelectorAll('[data-mark]').forEach(x=>x.classList.toggle('active',x===b))}if(b.id==='back')list()};
$('#overview').onclick=overview;$('#list').onclick=list;$('#random').onclick=()=>{const p=pool();if(!p.length){list();return}if(!deck.length){deck=p.map(c=>c.id);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}show(deck.pop(),true);$('#notice').textContent='本轮剩余 '+deck.length+' 题，抽完前不重复。'};
for(const g of [...new Set(D.cards.map(c=>c.group))])$('#group').add(new Option(g,g));for(const id of ['#group','#search','#weak'])$(id).addEventListener(id==='#search'?'input':'change',()=>{deck=[];list()});
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({format:KEY,progress:saved},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=D.kind+'-practice.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{const x=JSON.parse(await $('#file').files[0].text());if(x.format!==KEY||!x.progress)throw Error();for(const [id,v]of Object.entries(x.progress)){if(!D.cards.some(c=>c.id===id)||!v||typeof v!=='object')continue;const s={};if([0,1].includes(v.mark))s.mark=v.mark;if(typeof v.note==='string')s.note=v.note.slice(0,10000);saved[id]={...saved[id],...s}}save();$('#notice').textContent='已合并记录。';if(current)show(current);else list()}catch(_) {$('#notice').textContent='导入失败，请选择当前页面导出的记录。'}$('#file').value=''};
if(EN){$('#audioTools').hidden=false;$('#stopAudio').onclick=stopAudio;$('#rate').onchange=()=>{if(audio)audio.playbackRate=+$('#rate').value}}
function route(){const id=(location.hash.match(/^#q=([A-Z]\d+)$/)||[])[1];if(id&&D.cards.some(c=>c.id===id))show(id);else overview()}window.addEventListener('hashchange',route);window.addEventListener('pagehide',()=>{stopTimer();stopAudio()});route();
</script></body></html>
