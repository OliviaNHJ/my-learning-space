<script id="courseData" type="application/json">{"version":"public-2026-09-14-v1","subjects":[{"id":"civil","name":"民法","subtitle":"平等主体的生活与交易","color":"#346d5c","intro":"民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。先理解“平等主体”：强调法律地位平等，不是财富、能力、谈判实力相同。行政机关购买办公用品可以参与民事交易，行政处罚则是公权力活动。判断关系的性质，要看主体以什么身份、行使什么权力。","route":"先读民01—民06，掌握共同规则；再读民07—民14，把七编串起；最后用民15—民18解决时间、担保、知识产权和综合分析。","lessons":[{"id":"民01","title":"民法的定位与基本原则","priority":"P0","where":"总则编第一章；第2、4—10条","question":"民法调整什么？它为什么属于私法？","lecture":"你可以从“安排生活和交易”理解民法。民法通常属于私法，强调人格独立、地位平等和意思自治。自愿意味着当事人依法决定是否交易、与谁交易、怎样交易；但交易自由有边界，不能用合同排除人格尊严、公序良俗等要求。\n\n基本原则要连着作用记：**平等**防止身份当然优越；**自愿**尊重自主决定；**公平**合理确定权利义务；**诚信**保护真实信息和合理信赖；**守法与公序良俗**划定底线；**绿色**要求有利于节约资源、保护生态环境。\n\n公平不等于平均分配，也不等于谁弱谁当然胜诉。诚信原则可以解释和补充具体义务，但不能随意绕过明确规则。第10条允许在法律没有规定时适用不违背公序良俗的习惯，不是说所有习惯都高于法律。\n\n**教学假设：** 市场监管部门依法罚款，是行政关系；该部门向你购买软件服务，则可能是民事合同关系。区别在于这段关系的法律性质，不只是“谁参加”。","lectureHtml":"\u003cp>你可以从“安排生活和交易”理解民法。民法通常属于私法，强调人格独立、地位平等和意思自治。自愿意味着当事人依法决定是否交易、与谁交易、怎样交易；但交易自由有边界，不能用合同排除人格尊严、公序良俗等要求。\u003c/p>\n\u003cp>基本原则要连着作用记：\u003cstrong>平等\u003c/strong>防止身份当然优越；\u003cstrong>自愿\u003c/strong>尊重自主决定；\u003cstrong>公平\u003c/strong>合理确定权利义务；\u003cstrong>诚信\u003c/strong>保护真实信息和合理信赖；\u003cstrong>守法与公序良俗\u003c/strong>划定底线；\u003cstrong>绿色\u003c/strong>要求有利于节约资源、保护生态环境。\u003c/p>\n\u003cp>公平不等于平均分配，也不等于谁弱谁当然胜诉。诚信原则可以解释和补充具体义务，但不能随意绕过明确规则。第10条允许在法律没有规定时适用不违背公序良俗的习惯，不是说所有习惯都高于法律。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 市场监管部门依法罚款，是行政关系；该部门向你购买软件服务，则可能是民事合同关系。区别在于这段关系的法律性质，不只是“谁参加”。\u003c/p>\n","answer":"民法调整平等主体之间的人身关系和财产关系，通常属于私法。我理解它以权利保护和意思自治为中心，同时通过诚信、公序良俗等规则确定边界。例如政府购买软件也可能适用民法，但行政处罚属于公权力活动，不能混为一谈。","follow":[["私法是否意味着政府完全不能干预？","不是。主体自治受到法定限制，国家还通过规则和救济保护交易安全及弱势主体。"],["你认为公平就是一人承担一半吗？","不是。应结合具体法律、约定、过错和风险分配判断，平均不当然等于公平。"]],"refs":["civil0"],"subject":"civil"},{"id":"民02","title":"主体、行为能力与监护","priority":"P0","where":"总则编第二至四章；第13、16、18—24、27条","question":"权利能力和行为能力有什么区别？","lecture":"先区分“能不能享有权利”与“能不能自己有效作决定”。婴儿能够继承财产，说明有民事权利能力；但不能自己实施复杂交易。自然人的权利能力原则上始于出生、终于死亡。胎儿涉及继承、接受赠与等利益保护时视为有权利能力，娩出时为死体的，自始不存在。\n\n行为能力按年龄及辨认能力判断：不满8周岁为无行为能力人；8周岁以上未成年人原则上限制行为能力；18周岁以上原则上完全行为能力。16周岁以上、不满18周岁，以自己劳动收入为主要生活来源的，视为完全行为能力人。成年人不能辨认或不能完全辨认自己行为，也有相应分类。\n\n限制行为能力人可以独立实施纯获利益、或与年龄智力相适应的行为；超出范围的通常需要法定代理人同意或追认。**不要把这条直接套给无行为能力人。** 无行为能力人的民事法律行为依第144条判断，由法定代理人代理实施相关行为。\n\n监护保护被监护人的人身、财产等权益，不是监护人取得其财产所有权。监护应尊重适龄未成年人的真实意愿，并遵循最有利于被监护人的原则。法人是组织，法定代表人是代表组织的人；合伙企业等还可能属于非法人组织。","lectureHtml":"\u003cp>先区分“能不能享有权利”与“能不能自己有效作决定”。婴儿能够继承财产，说明有民事权利能力；但不能自己实施复杂交易。自然人的权利能力原则上始于出生、终于死亡。胎儿涉及继承、接受赠与等利益保护时视为有权利能力，娩出时为死体的，自始不存在。\u003c/p>\n\u003cp>行为能力按年龄及辨认能力判断：不满8周岁为无行为能力人；8周岁以上未成年人原则上限制行为能力；18周岁以上原则上完全行为能力。16周岁以上、不满18周岁，以自己劳动收入为主要生活来源的，视为完全行为能力人。成年人不能辨认或不能完全辨认自己行为，也有相应分类。\u003c/p>\n\u003cp>限制行为能力人可以独立实施纯获利益、或与年龄智力相适应的行为；超出范围的通常需要法定代理人同意或追认。\u003cstrong>不要把这条直接套给无行为能力人。\u003c/strong> 无行为能力人的民事法律行为依第144条判断，由法定代理人代理实施相关行为。\u003c/p>\n\u003cp>监护保护被监护人的人身、财产等权益，不是监护人取得其财产所有权。监护应尊重适龄未成年人的真实意愿，并遵循最有利于被监护人的原则。法人是组织，法定代表人是代表组织的人；合伙企业等还可能属于非法人组织。\u003c/p>\n","answer":"权利能力是成为民事权利义务主体的资格，行为能力是通过自己的行为独立发生法律效果的能力。婴儿可以继承财产，但不能独立订立复杂合同。具体行为效力要进一步看年龄、辨认能力、交易内容以及是否经过代理或追认。","follow":[["10岁孩子买文具与买昂贵设备有区别吗？","有。要审查是否与其年龄、智力相适应，不能把所有未成年人交易都认定无效。"],["公司法人就是老板吗？","不是。公司本身可以是法人，法定代表人是代表公司实施有关行为的自然人。"]],"refs":["civil0"],"subject":"civil"},{"id":"民03","title":"法律关系、法律事实与权利类型","priority":"P0","where":"总则编第五、六章；民事法律关系基础","question":"遇到民事案例，你先分析什么？","lecture":"先问“谁向谁，依据什么，主张什么”。民事法律关系有主体、内容、客体三要素；内容是权利义务，客体是权利义务所指向的对象。买卖关系中，买卖双方是主体，交付与付款等权利义务是内容，不能把合同当事人说成客体。\n\n法律事实是能够引起法律关系发生、变更、消灭的事实。死亡等事件、订立合同等法律行为、造成损害的侵权行为，都可能引起法律效果，**法律事实不等于民事法律行为**。法律行为以意思表示为核心，遗嘱也可以是单方行为，不以两个人达成协议为必要。\n\n为了串联后续制度，再记四种权利：支配权如所有权，直接支配客体；请求权如要求还款，要求特定人为或不为；形成权如符合法定条件的解除权，通过单方意思改变法律关系；抗辩权用来对抗请求，例如诉讼时效抗辩。\n\n**教学假设：** 买了房但未办理过户，先可能享有要求履行过户义务的请求权，不能直接跳到“已经是房屋所有权人”。同一生活事实会同时涉及合同和物权两个层面。","lectureHtml":"\u003cp>先问“谁向谁，依据什么，主张什么”。民事法律关系有主体、内容、客体三要素；内容是权利义务，客体是权利义务所指向的对象。买卖关系中，买卖双方是主体，交付与付款等权利义务是内容，不能把合同当事人说成客体。\u003c/p>\n\u003cp>法律事实是能够引起法律关系发生、变更、消灭的事实。死亡等事件、订立合同等法律行为、造成损害的侵权行为，都可能引起法律效果，\u003cstrong>法律事实不等于民事法律行为\u003c/strong>。法律行为以意思表示为核心，遗嘱也可以是单方行为，不以两个人达成协议为必要。\u003c/p>\n\u003cp>为了串联后续制度，再记四种权利：支配权如所有权，直接支配客体；请求权如要求还款，要求特定人为或不为；形成权如符合法定条件的解除权，通过单方意思改变法律关系；抗辩权用来对抗请求，例如诉讼时效抗辩。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 买了房但未办理过户，先可能享有要求履行过户义务的请求权，不能直接跳到“已经是房屋所有权人”。同一生活事实会同时涉及合同和物权两个层面。\u003c/p>\n","answer":"我会先确定当事人、请求内容和法律依据，再分析产生权利义务的法律事实。民事法律关系由主体、内容和客体组成。以买房为例，签订合同可能产生请求过户的债权，但房屋所有权是否转移，还需审查物权变动规则。","follow":[["死亡也是法律行为吗？","死亡可以是法律事实中的事件，并非以意思表示设立法律关系的民事法律行为。"],["为什么要区分请求权和形成权？","它们的行使方式和期限规则不同。诉讼时效主要涉及请求权，撤销权等形成权通常涉及除斥期间。"]],"refs":["civil0","civil1"],"subject":"civil"},{"id":"民04","title":"有效、无效、可撤销与效力待定","priority":"P0","where":"总则编第六章；第143—157条","question":"欺诈订立的合同一定无效吗？","lecture":"行为有效通常要求：主体有相应行为能力、意思表示真实、不违反导致无效的强制性规定且不违背公序良俗。这里审查的是民事法律行为，不仅限于合同。第153条明确保留了“该强制性规定不导致该民事法律行为无效”的例外，因此监管违规与合同无效不能直接画等号。\n\n无效，是不发生当事人预期的法律效果；可撤销，是存在重大误解、欺诈、胁迫、符合法定条件的显失公平等瑕疵，受保护一方可以依法请求撤销；效力待定，典型如限制行为能力人实施需要同意或追认的交易。不要把“未生效”作为这几类的共同答案。\n\n可撤销行为被依法撤销后，自始没有法律约束力。无效或被撤销并不代表毫无后果，还可能返还财产、折价补偿及按过错赔偿。部分无效不影响其他部分效力的，其他部分仍有效。\n\n**特殊期限：** 民法典第152条规定，重大误解一般自知道或应当知道撤销事由之日起90日；通常撤销事由为1年，胁迫自胁迫行为终止起1年；行为发生起5年未行使的，撤销权消灭。两天冲刺先懂权利性质，再记期限差异。","lectureHtml":"\u003cp>行为有效通常要求：主体有相应行为能力、意思表示真实、不违反导致无效的强制性规定且不违背公序良俗。这里审查的是民事法律行为，不仅限于合同。第153条明确保留了“该强制性规定不导致该民事法律行为无效”的例外，因此监管违规与合同无效不能直接画等号。\u003c/p>\n\u003cp>无效，是不发生当事人预期的法律效果；可撤销，是存在重大误解、欺诈、胁迫、符合法定条件的显失公平等瑕疵，受保护一方可以依法请求撤销；效力待定，典型如限制行为能力人实施需要同意或追认的交易。不要把“未生效”作为这几类的共同答案。\u003c/p>\n\u003cp>可撤销行为被依法撤销后，自始没有法律约束力。无效或被撤销并不代表毫无后果，还可能返还财产、折价补偿及按过错赔偿。部分无效不影响其他部分效力的，其他部分仍有效。\u003c/p>\n\u003cp>\u003cstrong>特殊期限：\u003c/strong> 民法典第152条规定，重大误解一般自知道或应当知道撤销事由之日起90日；通常撤销事由为1年，胁迫自胁迫行为终止起1年；行为发生起5年未行使的，撤销权消灭。两天冲刺先懂权利性质，再记期限差异。\u003c/p>\n","answer":"不一定。欺诈通常属于可撤销民事法律行为的问题，需要由受保护的一方依法行使撤销权。无效、可撤销和效力待定的原因及处理方式不同。即使行为无效或被撤销，也可能产生返还财产和过错赔偿等后果。","follow":[["违反行政管理规定就一定无效吗？","不一定，要判断规范层级、内容和是否旨在否定该行为效力等，不能只凭存在违规下结论。"],["合同撤销以后钱还用还吗？","通常要处理返还或折价补偿，存在过错的还可能承担损害赔偿。"]],"refs":["civil0"],"subject":"civil"},{"id":"民05","title":"代理与交易信赖","priority":"P1","where":"总则编第七章；第161—172条","question":"无权代理与表见代理有什么区别？","lecture":"代理使主体能够通过别人参与交易。代理人以被代理人名义，在代理权限内实施民事法律行为，效果原则上归属于被代理人。代理、居间介绍、法定代表人的代表行为，不能因为都“替别人做事”就混同。\n\n没有代理权、超越代理权或代理权终止后实施行为，原则上要看被代理人是否追认，不能当然约束被代理人。相对人的善意与相关撤销、催告权等，也需要区分。\n\n**教学假设：** 前员工拿着旧材料签约，是否足以让公司承担后果，要结合公司的外观形成、交易习惯、相对人审查等判断，不能见到公章照片便一概认定表见代理。","lectureHtml":"\u003cp>代理使主体能够通过别人参与交易。代理人以被代理人名义，在代理权限内实施民事法律行为，效果原则上归属于被代理人。代理、居间介绍、法定代表人的代表行为，不能因为都“替别人做事”就混同。\u003c/p>\n\u003cp>没有代理权、超越代理权或代理权终止后实施行为，原则上要看被代理人是否追认，不能当然约束被代理人。相对人的善意与相关撤销、催告权等，也需要区分。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 前员工拿着旧材料签约，是否足以让公司承担后果，要结合公司的外观形成、交易习惯、相对人审查等判断，不能见到公章照片便一概认定表见代理。\u003c/p>\n","answer":"无权代理是欠缺代理权，未经追认原则上不能对被代理人发生效力；表见代理则在符合法定条件时保护相对人的合理信赖。关键不只是相对人主观相信，还要有理由相信存在代理权。","follow":[["代理人和法定代表人相同吗？","不同，代理权和代表权有不同来源与规则，不能机械套用。"],["为什么不一律让无权代理人自己负责？","还要保护交易安全；符合法定条件的权利外观可能使相对人的合理信赖获得保护。"]],"refs":["civil0"],"subject":"civil"},{"id":"民06","title":"物权结构、登记交付与善意取得","priority":"P0","where":"物权编；第209、215、224、225、311、312条","question":"买卖合同有效，所有权就转移了吗？","lecture":"物权通常是对特定物的直接支配和排他性权利，债权通常是请求特定人作出给付的权利。所有权包括占有、使用、收益、处分；用益物权安排利用他人之物；担保物权保障债权实现。物权法定要求种类和内容依法确定，合同自由不能随意创造能对抗所有人的新物权。\n\n财产归属影响第三人，所以需要公示：不动产原则上登记，动产原则上交付。第215条将合同效力与物权变动区分，未登记通常不当然影响相应合同效力。机动车等特殊动产未经登记，不得对抗善意第三人，不能记成“不登记就绝对不取得所有权”。继承、生效法律文书等另有物权变动规则。\n\n善意取得处理无处分权人转让财产时的交易安全问题，通常要受让时善意、合理价格以及完成依法应有的登记或交付等条件。不是“我不知道就归我”。遗失物的追回及相关费用规则有特别安排，不能完全照搬一般善意取得。\n\n**教学假设：** 卖方签约后反悔，买方可以依合同主张权利；是否能向其他人主张物权，还要看是否取得该物权、第三人的状况等。","lectureHtml":"\u003cp>物权通常是对特定物的直接支配和排他性权利，债权通常是请求特定人作出给付的权利。所有权包括占有、使用、收益、处分；用益物权安排利用他人之物；担保物权保障债权实现。物权法定要求种类和内容依法确定，合同自由不能随意创造能对抗所有人的新物权。\u003c/p>\n\u003cp>财产归属影响第三人，所以需要公示：不动产原则上登记，动产原则上交付。第215条将合同效力与物权变动区分，未登记通常不当然影响相应合同效力。机动车等特殊动产未经登记，不得对抗善意第三人，不能记成“不登记就绝对不取得所有权”。继承、生效法律文书等另有物权变动规则。\u003c/p>\n\u003cp>善意取得处理无处分权人转让财产时的交易安全问题，通常要受让时善意、合理价格以及完成依法应有的登记或交付等条件。不是“我不知道就归我”。遗失物的追回及相关费用规则有特别安排，不能完全照搬一般善意取得。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 卖方签约后反悔，买方可以依合同主张权利；是否能向其他人主张物权，还要看是否取得该物权、第三人的状况等。\u003c/p>\n","answer":"不一定。合同效力与物权变动是两个层次。买房合同有效，通常先产生要求交付和过户的债权；所有权转移还要看登记等规则。物权变动影响第三人，所以比单纯合同关系更强调法定和公示。","follow":[["善意取得只要求不知道无处分权吗？","不是，还要合理价格和依法应有的登记或交付等条件，并注意遗失物等特别规则。"],["物权与债权最简区别？","物权强调对物的直接支配，债权强调对特定人的给付请求；具体效力还要结合制度细化。"]],"refs":["civil1"],"subject":"civil"},{"id":"民07","title":"合同生命周期与格式条款","priority":"P0","where":"合同编通则；第469、471—498、509条","question":"格式条款是不是都无效？","lecture":"合同学习按“订立—效力—履行—保全—变更转让—终止—责任”展开。订立通常涉及要约与承诺。要约须具体确定并表明承诺后受约束，广告一般是邀请，但符合要约条件时例外。数据电文能够有形表现内容并随时调取查用的，可以属于书面形式；电子合同并非当然效力较低。\n\n成立解决双方是否达成协议，生效解决是否依法产生效力。依法成立的合同通常成立时生效，另有法定或约定条件时具体判断。履行不仅包括主要给付，还可能依诚信原则承担通知、协助、保密义务。\n\n格式条款不当然无效。先审查重大利害条款是否依法提示、按要求说明；未尽义务致对方未注意或理解的，可能主张该条款不成为合同内容。再审查是否不合理免责、加重对方责任、限制或排除主要权利等而无效。最后，通常理解仍有两种以上解释的，作不利于提供方的解释。\n\n**教学假设：** 物流赔偿上限或软件“永不负责”条款，要逐层审查，不能说点击同意便全有效，也不能因属于格式条款便全无效。","lectureHtml":"\u003cp>合同学习按“订立—效力—履行—保全—变更转让—终止—责任”展开。订立通常涉及要约与承诺。要约须具体确定并表明承诺后受约束，广告一般是邀请，但符合要约条件时例外。数据电文能够有形表现内容并随时调取查用的，可以属于书面形式；电子合同并非当然效力较低。\u003c/p>\n\u003cp>成立解决双方是否达成协议，生效解决是否依法产生效力。依法成立的合同通常成立时生效，另有法定或约定条件时具体判断。履行不仅包括主要给付，还可能依诚信原则承担通知、协助、保密义务。\u003c/p>\n\u003cp>格式条款不当然无效。先审查重大利害条款是否依法提示、按要求说明；未尽义务致对方未注意或理解的，可能主张该条款不成为合同内容。再审查是否不合理免责、加重对方责任、限制或排除主要权利等而无效。最后，通常理解仍有两种以上解释的，作不利于提供方的解释。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 物流赔偿上限或软件“永不负责”条款，要逐层审查，不能说点击同意便全有效，也不能因属于格式条款便全无效。\u003c/p>\n","answer":"不是。格式条款是交易中常见的安排，关键在于是否履行提示说明义务、内容是否违反效力规则以及有歧义时如何解释。未被纳入合同与条款本身无效是不同路径。例如平台免责条款，用户点击同意不能代替全部合法性审查。","follow":[["网络广告一定是要约邀请吗？","通常是，但内容符合要约条件时可以构成要约。"],["合同没写保密，就能公开对方信息吗？","不能这样推断。还要考虑诚信产生的义务以及个人信息、商业秘密等独立保护规则。"]],"refs":["civil2"],"subject":"civil"},{"id":"民08","title":"履行风险、合同保全与债务转移","priority":"P1","where":"合同编通则；第525—551条","question":"代位权和债权人撤销权分别解决什么？","lecture":"有效合同也可能在履行中出现风险。双方互负债务时，同时履行、先履行、不安抗辩分别有条件。不安抗辩要求先履行一方有确切证据证明对方出现法定履约风险等，不能因网上传闻便随意停止履行，还要依法通知及处理担保等问题。\n\n合同保全关注债务人的责任财产。债务人怠于行使有关权利，影响债权实现时，债权人可能以自己的名义行使代位权；债务人无偿处分财产等影响债权实现时，则可能行使撤销权。代位权是推动本应进入债务人责任财产的利益实现，撤销权是纠正不当减少责任财产的行为。\n\n这与因欺诈而撤销自己订立的合同不是一回事。另一个常考比较是债权转让与债务转移：债权转让通常通知债务人，不通知对其不发生效力；债务转移通常要债权人同意，因为换一个还款人的风险很大。\n\n**教学假设：** 甲欠你钱，却将重要财产无偿转给亲友，不能仅说甲有财产处分自由；需要审查是否满足债权人撤销权条件。","lectureHtml":"\u003cp>有效合同也可能在履行中出现风险。双方互负债务时，同时履行、先履行、不安抗辩分别有条件。不安抗辩要求先履行一方有确切证据证明对方出现法定履约风险等，不能因网上传闻便随意停止履行，还要依法通知及处理担保等问题。\u003c/p>\n\u003cp>合同保全关注债务人的责任财产。债务人怠于行使有关权利，影响债权实现时，债权人可能以自己的名义行使代位权；债务人无偿处分财产等影响债权实现时，则可能行使撤销权。代位权是推动本应进入债务人责任财产的利益实现，撤销权是纠正不当减少责任财产的行为。\u003c/p>\n\u003cp>这与因欺诈而撤销自己订立的合同不是一回事。另一个常考比较是债权转让与债务转移：债权转让通常通知债务人，不通知对其不发生效力；债务转移通常要债权人同意，因为换一个还款人的风险很大。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 甲欠你钱，却将重要财产无偿转给亲友，不能仅说甲有财产处分自由；需要审查是否满足债权人撤销权条件。\u003c/p>\n","answer":"二者都服务于债权实现。代位权针对债务人怠于行使有关权利，债权人依法以自己名义代为行使；撤销权针对债务人不当处分财产等影响债权实现的行为，依法请求撤销。适用条件不同，也不能与受欺诈后的撤销权混淆。","follow":[["为什么债务转移通常要同意？","债务人的履约能力影响债权实现，需要保护债权人的选择和利益。"],["听说对方要破产就能立即停止履约吗？","不能仅凭传闻。抗辩有证据、通知及后续处理等具体要求。"]],"refs":["civil2"],"subject":"civil"},{"id":"民09","title":"违约、解除、定金与不可抗力","priority":"P0","where":"合同编通则；第533、563、577、585—590条","question":"违约后有哪些责任？不可抗力一定免责吗？","lecture":"违约责任围绕有效合同义务的违反，常见方式有继续履行、采取补救措施、赔偿损失。是否实际适用继续履行，还要看履行是否可能、适宜及法律规定。违约金并非越高越好，过分高于损失等情况可以依法请求调整。\n\n定金具有担保效果，以实际交付为成立要求，数额不得超过主合同标的额20%，超过部分不产生定金效力。给付方违约致合同目的不能实现等，可能无权请求返还；收受方发生相应违约，可能双倍返还。约定“订金”不当然适用定金罚则。违约金与定金责任通常择一；定金不足弥补损失时还要看超过部分的赔偿规则。\n\n解除通常是有效合同履行中的退出机制，例如根本违约；撤销通常针对订立时的法定瑕疵。不可抗力依影响部分或全部免责，须考虑因果关系、通知与证明；迟延履行后发生不可抗力，不能据此免责。情势变更强调订约时无法预见、不属于商业风险的重大变化导致继续履行明显不公平，应先协商，必要时请求法院或仲裁机构变更或解除，不是自行宣布不履行。\n\n**一句理解：** 法律维护交易稳定，也给履行失败、异常风险和严重不公平保留规范化出口。","lectureHtml":"\u003cp>违约责任围绕有效合同义务的违反，常见方式有继续履行、采取补救措施、赔偿损失。是否实际适用继续履行，还要看履行是否可能、适宜及法律规定。违约金并非越高越好，过分高于损失等情况可以依法请求调整。\u003c/p>\n\u003cp>定金具有担保效果，以实际交付为成立要求，数额不得超过主合同标的额20%，超过部分不产生定金效力。给付方违约致合同目的不能实现等，可能无权请求返还；收受方发生相应违约，可能双倍返还。约定“订金”不当然适用定金罚则。违约金与定金责任通常择一；定金不足弥补损失时还要看超过部分的赔偿规则。\u003c/p>\n\u003cp>解除通常是有效合同履行中的退出机制，例如根本违约；撤销通常针对订立时的法定瑕疵。不可抗力依影响部分或全部免责，须考虑因果关系、通知与证明；迟延履行后发生不可抗力，不能据此免责。情势变更强调订约时无法预见、不属于商业风险的重大变化导致继续履行明显不公平，应先协商，必要时请求法院或仲裁机构变更或解除，不是自行宣布不履行。\u003c/p>\n\u003cp>\u003cstrong>一句理解：\u003c/strong> 法律维护交易稳定，也给履行失败、异常风险和严重不公平保留规范化出口。\u003c/p>\n","answer":"违约责任包括继续履行、补救和损害赔偿等，具体方式要结合合同与法律。不可抗力并不自动免责，需要审查它对履行的影响、因果关系及通知证明等要求，迟延履行后发生不可抗力还有特别限制。","follow":[["定金和违约金能一起全额主张吗？","通常选择适用相应违约金或定金条款，不能机械叠加；损失超过定金部分另依规则判断。"],["涨价就能主张情势变更吗？","普通商业风险通常不够，要满足无法预见、重大变化、明显不公平等法定条件。"]],"refs":["civil2"],"subject":"civil"},{"id":"民10","title":"人格权、隐私与AI声音","priority":"P0","where":"人格权编；第990—997、1019、1023、1032—1034条","question":"隐私和个人信息是不是一回事？","lecture":"人格权保护人作为人的生命、身体、健康、尊严及姓名、肖像、名誉等利益。人格权原则上不得放弃、转让、继承；但姓名、肖像等人格利益可以依法许可使用。许可使用不等于将人格权永久卖给别人。\n\n隐私重在私人生活安宁和不愿公开的私密空间、活动、信息；个人信息重在能够单独或结合其他信息识别自然人。两者交叉但不同，公开信息也可能属于个人信息，公开并不等于任意利用。人格权编确定权益内容，侵权责任编提供相应责任分析，个人信息保护法进一步规定处理规则。\n\n**真实案例：** 最高法发布的殷某某声音AI化典型案例提示，可识别的自然人声音受人格权益保护。录音素材的相关授权不当然涵盖对自然人声音进行AI化利用的全部授权。各参与者是否承担赔偿等责任，还要看具体行为与过错，不能笼统说所有平台一律赔偿。","lectureHtml":"\u003cp>人格权保护人作为人的生命、身体、健康、尊严及姓名、肖像、名誉等利益。人格权原则上不得放弃、转让、继承；但姓名、肖像等人格利益可以依法许可使用。许可使用不等于将人格权永久卖给别人。\u003c/p>\n\u003cp>隐私重在私人生活安宁和不愿公开的私密空间、活动、信息；个人信息重在能够单独或结合其他信息识别自然人。两者交叉但不同，公开信息也可能属于个人信息，公开并不等于任意利用。人格权编确定权益内容，侵权责任编提供相应责任分析，个人信息保护法进一步规定处理规则。\u003c/p>\n\u003cp>\u003cstrong>真实案例：\u003c/strong> 最高法发布的殷某某声音AI化典型案例提示，可识别的自然人声音受人格权益保护。录音素材的相关授权不当然涵盖对自然人声音进行AI化利用的全部授权。各参与者是否承担赔偿等责任，还要看具体行为与过错，不能笼统说所有平台一律赔偿。\u003c/p>\n","answer":"不是。隐私重在生活安宁和私密领域，个人信息重在识别特定自然人，二者存在交叉。AI利用声音就是例子：技术上可处理、取得录音素材授权，与是否获准利用人格利益是不同问题，应分开审查。","follow":[["声音没有肖像，仍受保护吗？","民法典第1023条规定自然人声音保护参照适用肖像权保护的有关规定，还要判断可识别性和具体使用。"],["公开信息是否可以任意训练？","不能。须结合合理范围、处理目的、个人权益影响及其他相关规则判断。"]],"refs":["civil3","voice","pipl"],"subject":"civil"},{"id":"民11","title":"婚姻效力、夫妻财产与离婚","priority":"P0","where":"婚姻家庭编；第1047、1051—1053、1062—1064、1077、1088条","question":"婚后取得的财产和债务都是夫妻共同的吗？","lecture":"婚姻家庭法同时调整身份和财产，不能完全用商业交易思路理解。结婚自由受法定条件约束：男不得早于22周岁、女不得早于20周岁。重婚、禁止结婚的亲属关系、未达婚龄涉及无效；胁迫、婚前重大疾病未依法如实告知等涉及撤销，不是“患病一律不能结婚”。\n\n婚内工资、经营投资收益、知识产权收益等通常属于共同财产；婚前财产、人身损害赔偿补偿、遗嘱或赠与合同中确定只归一方的财产等有个人财产规则。共同财产判断和共同债务判断是两个问题，不能因有共同财产就推出一切债务共同承担。\n\n夫妻共债看共签、追认、家庭日常生活需要等。超出日常生活需要的一方个人名义债务，原则上不当然共担，债权人证明用于共同生活、共同生产经营或基于共同意思表示等时另论。\n\n协议离婚登记有30日冷静期，其后30日双方应亲自申请领取离婚证，未申请视为撤回；诉讼离婚不直接套用该程序。家务劳动补偿关注抚育、照料等较多义务，不再以夫妻分别财产制为前提。离婚财产处理、损害赔偿、家务补偿是不同制度。","lectureHtml":"\u003cp>婚姻家庭法同时调整身份和财产，不能完全用商业交易思路理解。结婚自由受法定条件约束：男不得早于22周岁、女不得早于20周岁。重婚、禁止结婚的亲属关系、未达婚龄涉及无效；胁迫、婚前重大疾病未依法如实告知等涉及撤销，不是“患病一律不能结婚”。\u003c/p>\n\u003cp>婚内工资、经营投资收益、知识产权收益等通常属于共同财产；婚前财产、人身损害赔偿补偿、遗嘱或赠与合同中确定只归一方的财产等有个人财产规则。共同财产判断和共同债务判断是两个问题，不能因有共同财产就推出一切债务共同承担。\u003c/p>\n\u003cp>夫妻共债看共签、追认、家庭日常生活需要等。超出日常生活需要的一方个人名义债务，原则上不当然共担，债权人证明用于共同生活、共同生产经营或基于共同意思表示等时另论。\u003c/p>\n\u003cp>协议离婚登记有30日冷静期，其后30日双方应亲自申请领取离婚证，未申请视为撤回；诉讼离婚不直接套用该程序。家务劳动补偿关注抚育、照料等较多义务，不再以夫妻分别财产制为前提。离婚财产处理、损害赔偿、家务补偿是不同制度。\u003c/p>\n","answer":"不能只看是否发生在婚内。财产需要区分法定共同与个人范围；债务则要看共同意思、日常家庭需要及实际用途等。比如一方以个人名义承担明显超出日常生活需要的债务，不能仅凭婚姻关系要求另一方共同偿还。","follow":[["离婚冷静期适用于所有离婚吗？","不是。民法典规定的是登记离婚程序，诉讼离婚按相应诉讼和实体规则处理。"],["全职照料家庭没有工资，是否就没有贡献？","不是。应当区分共同财产权益及家务劳动补偿等制度，不能只用收入衡量贡献。"]],"refs":["civil4"],"subject":"civil"},{"id":"民12","title":"继承顺序与遗嘱自由的边界","priority":"P0","where":"继承编；第1121—1128、1141—1142、1161条","question":"继承遗产需要替父母偿还全部债务吗？","lecture":"继承从被继承人死亡时开始。第一步不是分配，而是确定死者遗留的合法个人财产：夫妻共有、家庭共有中属于他人的部分须先区分。然后确定相关部分是否存在遗赠扶养协议、有效遗嘱及遗赠安排，再对其余部分适用法定继承等规则。\n\n法定第一顺序是配偶、子女、父母；第二顺序是兄弟姐妹、祖父母、外祖父母。有第一顺序继承人继承时，第二顺序不继承。代位继承与转继承不是一个问题：前者关注法定情形下继承人先于被继承人死亡后的替代，后者关注继承开始后、遗产分割前继承人死亡的承接。\n\n遗嘱自由需要符合形式要求、真实意思和处分权限。打印遗嘱等有见证、签名日期等要求，不能说打印签名就必然有效。数份遗嘱抵触，不能继续背“公证遗嘱绝对优先”，要按最后有效遗嘱等现行规则判断。对缺乏劳动能力又没有生活来源的继承人，应保留必要份额。\n\n继承人清偿税款债务原则上以所得遗产实际价值为限；自愿超过该价值偿还的除外。因此“父债子偿”不能作为当然法律结论。","lectureHtml":"\u003cp>继承从被继承人死亡时开始。第一步不是分配，而是确定死者遗留的合法个人财产：夫妻共有、家庭共有中属于他人的部分须先区分。然后确定相关部分是否存在遗赠扶养协议、有效遗嘱及遗赠安排，再对其余部分适用法定继承等规则。\u003c/p>\n\u003cp>法定第一顺序是配偶、子女、父母；第二顺序是兄弟姐妹、祖父母、外祖父母。有第一顺序继承人继承时，第二顺序不继承。代位继承与转继承不是一个问题：前者关注法定情形下继承人先于被继承人死亡后的替代，后者关注继承开始后、遗产分割前继承人死亡的承接。\u003c/p>\n\u003cp>遗嘱自由需要符合形式要求、真实意思和处分权限。打印遗嘱等有见证、签名日期等要求，不能说打印签名就必然有效。数份遗嘱抵触，不能继续背“公证遗嘱绝对优先”，要按最后有效遗嘱等现行规则判断。对缺乏劳动能力又没有生活来源的继承人，应保留必要份额。\u003c/p>\n\u003cp>继承人清偿税款债务原则上以所得遗产实际价值为限；自愿超过该价值偿还的除外。因此“父债子偿”不能作为当然法律结论。\u003c/p>\n","answer":"原则上不是无限承担。继承人清偿被继承人依法应缴税款和债务，以所得遗产实际价值为限，自愿超过的除外。分析继承还应先确定哪些财产属于遗产，再判断遗嘱、协议和法定继承的适用。","follow":[["公证遗嘱一定优先吗？","现行民法典不再保留公证遗嘱当然优先规则，要判断有效性与相抵触遗嘱的先后等。"],["家庭全部财产都是遗产吗？","不是，遗产是死者遗留的合法个人财产，要先区分共有财产中他人的份额。"]],"refs":["civil5"],"subject":"civil"},{"id":"民13","title":"侵权构成、归责与责任竞合","priority":"P0","where":"侵权责任编一般规定；第1165、1166条；总则第186条","question":"AI造成损害，开发者就一定承担全部责任吗？","lecture":"侵权责任要把“保护什么权益”与“谁因什么行为承担什么责任”连接起来。一般侵权损害赔偿常分析侵害行为、损害、因果关系、过错，但停止侵害、消除危险等请求不必机械要求实际损失已经发生。\n\n过错责任通常要求行为人有故意或过失；过错推定是在法律规定的情形下，由行为人证明自己没有过错；无过错责任在法律有规定时不以过错为必要。无过错不是无条件，仍需满足相应责任构成并审查法定抗辩。\n\n人工智能不是现行民事法上的当然独立责任主体。分析应落到开发、部署、运营、使用等具体主体，但不能因此直接让开发者为一切后果负责。需要查明系统用途、关系、注意义务、行为与损害的联系及适用的特殊规则。\n\n同一行为可能既违反合同又侵害人身财产权益，产生责任竞合；选择适当请求依据，不得对同一损失重复获赔。平台条款写“AI自动输出，与平台无关”，不能直接排除法定责任。","lectureHtml":"\u003cp>侵权责任要把“保护什么权益”与“谁因什么行为承担什么责任”连接起来。一般侵权损害赔偿常分析侵害行为、损害、因果关系、过错，但停止侵害、消除危险等请求不必机械要求实际损失已经发生。\u003c/p>\n\u003cp>过错责任通常要求行为人有故意或过失；过错推定是在法律规定的情形下，由行为人证明自己没有过错；无过错责任在法律有规定时不以过错为必要。无过错不是无条件，仍需满足相应责任构成并审查法定抗辩。\u003c/p>\n\u003cp>人工智能不是现行民事法上的当然独立责任主体。分析应落到开发、部署、运营、使用等具体主体，但不能因此直接让开发者为一切后果负责。需要查明系统用途、关系、注意义务、行为与损害的联系及适用的特殊规则。\u003c/p>\n\u003cp>同一行为可能既违反合同又侵害人身财产权益，产生责任竞合；选择适当请求依据，不得对同一损失重复获赔。平台条款写“AI自动输出，与平台无关”，不能直接排除法定责任。\u003c/p>\n","answer":"不能仅凭使用AI就确定全部责任，也不能以AI自动输出为由免责。一般要分析具体主体的行为、损害、因果关系和过错，并检查是否存在特殊责任规则。若同时违反合同、侵害权益，还要处理责任竞合，避免同一损失重复赔偿。","follow":[["无过错责任等于不需要因果关系吗？","不等于，仍要审查适用该制度的成立条件和法定抗辩。"],["还没实际损失就完全不能维权吗？","不是，停止侵害、消除危险等预防性救济不必等到赔偿意义上的损失发生。"]],"refs":["civil6"],"subject":"civil"},{"id":"民14","title":"特殊侵权：自甘风险、安全保障与高空抛物","priority":"P1","where":"侵权责任编；第1173—1176、1186、1198、1202、1229、1254条","question":"参加体育运动受伤，对方一定不用赔吗？","lecture":"特殊侵权不宜只背名称。先看谁更能控制风险、哪种法定责任适用，再判断具体条件。自愿参加具有一定风险的文体活动，因其他参加者行为受损，法律限制部分赔偿请求；但对方故意或重大过失等情形例外，组织者的责任依安全保障等规则另行审查。\n\n经营场所、公共场所经营者管理者或者群众性活动组织者承担相应安全保障义务。第三人侵权与场所未尽义务可能引出不同责任层次，不能只找一个主体包揽一切。\n\n产品缺陷致损、环境污染生态破坏等有法定特殊规则。双方都无过错时，第1186条要求依法律规定分担损失，不能将“公平责任”当作任意各打五十大板的依据。\n\n高空抛物先追究具体侵权人；经调查仍难确定时，依法分析可能加害的建筑物使用人补偿、排除证明、追偿和物业保障义务等。不要说整栋楼无条件承担连带赔偿。**教学假设：** 楼上落物伤人，应先调查物体来源、控制人和安全措施，再选择规则。","lectureHtml":"\u003cp>特殊侵权不宜只背名称。先看谁更能控制风险、哪种法定责任适用，再判断具体条件。自愿参加具有一定风险的文体活动，因其他参加者行为受损，法律限制部分赔偿请求；但对方故意或重大过失等情形例外，组织者的责任依安全保障等规则另行审查。\u003c/p>\n\u003cp>经营场所、公共场所经营者管理者或者群众性活动组织者承担相应安全保障义务。第三人侵权与场所未尽义务可能引出不同责任层次，不能只找一个主体包揽一切。\u003c/p>\n\u003cp>产品缺陷致损、环境污染生态破坏等有法定特殊规则。双方都无过错时，第1186条要求依法律规定分担损失，不能将“公平责任”当作任意各打五十大板的依据。\u003c/p>\n\u003cp>高空抛物先追究具体侵权人；经调查仍难确定时，依法分析可能加害的建筑物使用人补偿、排除证明、追偿和物业保障义务等。不要说整栋楼无条件承担连带赔偿。\u003cstrong>教学假设：\u003c/strong> 楼上落物伤人，应先调查物体来源、控制人和安全措施，再选择规则。\u003c/p>\n","answer":"不一定。自甘风险有适用范围，其他参加者存在故意或重大过失时不能一概免责，组织者还可能承担独立的安全保障义务。这个制度是在合理承担运动风险与防止不当侵害之间划界，不是签了免责书就放弃所有权利。","follow":[["双方都没过错就一人一半？","不是，损失分担应有法律依据，不能凭抽象公平任意分配。"],["找不到高空抛物者就全楼连带赔偿？","不准确，要按调查、可能加害范围、排除证明、补偿和追偿等法定规则具体判断。"]],"refs":["civil6"],"subject":"civil"},{"id":"民15","title":"诉讼时效与除斥期间","priority":"P0","where":"总则编第九章；第188—199条","question":"过了三年，债权就自动消灭了吗？","lecture":"诉讼时效协调权利保护、证据可靠与关系稳定。一般期间为3年，自知道或应当知道权利受损以及义务人之日起算；自权利受损之日起超过20年的，原则上不再保护，特殊情况法院可依申请决定延长。不要把3年和20年混成同一个起算点。\n\n时效届满，义务人可以提出不履行义务的抗辩，债权并非当然消灭，法院不得主动适用。义务人自愿履行后，不能仅以时效届满要求返还。\n\n中断发生于提出履行请求、义务人同意履行、起诉仲裁等法定事由，依法重新计算。中止针对期间最后6个月内的法定行权障碍；障碍消除后满6个月，时效届满，不能粗略说“把剩下的几天续上”。\n\n停止侵害、排除妨碍、消除危险、支付抚养费赡养费扶养费等请求不适用诉讼时效。除斥期间通常关系撤销权等权利的存续，届满可能使权利消灭，一般不适用中止中断延长。两种期限服务不同权利形态。","lectureHtml":"\u003cp>诉讼时效协调权利保护、证据可靠与关系稳定。一般期间为3年，自知道或应当知道权利受损以及义务人之日起算；自权利受损之日起超过20年的，原则上不再保护，特殊情况法院可依申请决定延长。不要把3年和20年混成同一个起算点。\u003c/p>\n\u003cp>时效届满，义务人可以提出不履行义务的抗辩，债权并非当然消灭，法院不得主动适用。义务人自愿履行后，不能仅以时效届满要求返还。\u003c/p>\n\u003cp>中断发生于提出履行请求、义务人同意履行、起诉仲裁等法定事由，依法重新计算。中止针对期间最后6个月内的法定行权障碍；障碍消除后满6个月，时效届满，不能粗略说“把剩下的几天续上”。\u003c/p>\n\u003cp>停止侵害、排除妨碍、消除危险、支付抚养费赡养费扶养费等请求不适用诉讼时效。除斥期间通常关系撤销权等权利的存续，届满可能使权利消灭，一般不适用中止中断延长。两种期限服务不同权利形态。\u003c/p>\n","answer":"不会仅因一般诉讼时效届满就自动消灭债权。义务人可以提出时效抗辩，法院不得主动适用。还要判断请求是否适用时效、起算时间和有无中止中断，所以不能只机械地从事情发生起算三年。","follow":[["中断与中止最简区别？","中断是法定事由引起重新计算；中止是最后六个月出现法定障碍，障碍消除后满六个月届满。"],["法院会主动帮欠款人适用时效吗？","不会，民法典第193条禁止法院主动适用诉讼时效规定。"]],"refs":["civil0"],"subject":"civil"},{"id":"民16","title":"担保、无因管理与不当得利","priority":"P1","where":"物权编担保物权；合同编保证合同、准合同","question":"抵押、质押、保证有什么区别？","lecture":"担保解决“债务不履行时，怎样增强债权实现”。抵押通常不转移财产占有；动产质权通常以交付设立，权利质押另有规则；保证是保证人承担相应责任，属于人的担保。抵押权不等于债权人取得所有权，债务人不还钱时也不能仅凭预先约定就当然把抵押物据为己有。\n\n担保物权原则上随主债权存在，体现从属性。保证方式没有约定或约定不明确的，按一般保证承担；不能沿用旧法“默认连带保证”的记忆。一般保证与连带责任保证在追责顺序和抗辩上不同。\n\n准合同部分解决没有合同却发生的特定债权债务。无因管理是没有法定或约定义务，为避免他人利益受损而管理他人事务等情形；不当得利是没有法律根据取得利益并使他人受损。不是所有帮助都有报酬，也不是凡赚到利益都是不当得利。","lectureHtml":"\u003cp>担保解决“债务不履行时，怎样增强债权实现”。抵押通常不转移财产占有；动产质权通常以交付设立，权利质押另有规则；保证是保证人承担相应责任，属于人的担保。抵押权不等于债权人取得所有权，债务人不还钱时也不能仅凭预先约定就当然把抵押物据为己有。\u003c/p>\n\u003cp>担保物权原则上随主债权存在，体现从属性。保证方式没有约定或约定不明确的，按一般保证承担；不能沿用旧法“默认连带保证”的记忆。一般保证与连带责任保证在追责顺序和抗辩上不同。\u003c/p>\n\u003cp>准合同部分解决没有合同却发生的特定债权债务。无因管理是没有法定或约定义务，为避免他人利益受损而管理他人事务等情形；不当得利是没有法律根据取得利益并使他人受损。不是所有帮助都有报酬，也不是凡赚到利益都是不当得利。\u003c/p>\n","answer":"抵押和质押属于财产担保，通常分别以不转移占有与交付等方式实现担保功能；保证是由保证人依法或依约承担责任。担保强化债权实现，但不意味着债权人当然成为担保财产所有人。","follow":[["保证方式没写就是连带保证吗？","现行民法典不是这样，没约定或约定不明确按一般保证承担。"],["没有合同就绝不会有债吗？","不是，无因管理、不当得利、侵权等也能依法产生债权债务。"]],"refs":["civil1","civil2"],"subject":"civil"},{"id":"民17","title":"知识产权、技术许可与个人信息","priority":"P0","where":"民事特别法；总则第123条、合同编技术合同；个保法第13、24、28—30条","question":"软件项目可以涉及哪些法律领域？","lecture":"知识产权侧重对特定智力成果、商业标识等利益的保护。著作权保护具有独创性的表达，不直接垄断抽象思想或算法原理；计算机程序的保护还需结合专门规则。专利要满足法定客体及新颖性、创造性、实用性等条件，不能说“算法一律能申请”或“涉及软件一律不能”。商标保护识别来源的标志，与前两者不同。\n\n技术许可的核心是保护与利用的衔接：许可范围、地域期限、费用、成果改进归属、保密和责任都可能需要合同安排。涉外许可再增加准据法、争议解决、地域性保护及有关监管问题。跨境并非只要把中文合同翻译成英文。\n\n个保法不是只规定同意。第13条列出多种合法处理基础；以同意为基础时，还需满足相应要求。健康信息通常涉及敏感个人信息，需特定目的、充分必要和严格保护，并依法履行单独同意等要求及法定例外处理。第24条规制自动化决策：涉及透明、公平公正，不合理差别待遇，以及重大影响情形下的说明和拒绝仅由自动化决策作出决定等权利。","lectureHtml":"\u003cp>知识产权侧重对特定智力成果、商业标识等利益的保护。著作权保护具有独创性的表达，不直接垄断抽象思想或算法原理；计算机程序的保护还需结合专门规则。专利要满足法定客体及新颖性、创造性、实用性等条件，不能说“算法一律能申请”或“涉及软件一律不能”。商标保护识别来源的标志，与前两者不同。\u003c/p>\n\u003cp>技术许可的核心是保护与利用的衔接：许可范围、地域期限、费用、成果改进归属、保密和责任都可能需要合同安排。涉外许可再增加准据法、争议解决、地域性保护及有关监管问题。跨境并非只要把中文合同翻译成英文。\u003c/p>\n\u003cp>个保法不是只规定同意。第13条列出多种合法处理基础；以同意为基础时，还需满足相应要求。健康信息通常涉及敏感个人信息，需特定目的、充分必要和严格保护，并依法履行单独同意等要求及法定例外处理。第24条规制自动化决策：涉及透明、公平公正，不合理差别待遇，以及重大影响情形下的说明和拒绝仅由自动化决策作出决定等权利。\u003c/p>\n","answer":"软件项目可以涉及代码著作权、技术许可和个人信息保护等。技术实现以后，还要回答成果怎样保护和许可、数据能否用于特定目的。知识产权通常以私权保护为核心，但行政管理和刑事保护等也会参与，需要先定位具体关系，再解释交叉。","follow":[["知识产权法属于公法还是私法？","通常以私权保护为核心，归入民法的重要领域，但行政管理、执法及刑事保护使相关制度具有交织性。"],["已经同意就能无限使用健康数据吗？","不能。仍受目的、必要范围、敏感信息保护及其他法定要求约束。"]],"refs":["civil0","civil2","pipl","copyright","patent"],"subject":"civil"},{"id":"民18","title":"把七编串成一段自然回答","priority":"P0","where":"民法全科复盘","question":"请用一分钟介绍你对民法体系的理解。","lecture":"先说民法的对象，再说明总则与分编的关系，最后用一个场景串起几个领域。不要一上来列20个术语；也不要把民法概括为“规定人与人怎么相处”，那样无法和其他法律区分。\n\n讲软件平台时，你可以按主体、合同、权益、责任、救济展开：平台与用户是谁，协议是否有效，代码和数据涉及谁的权利，系统运行造成损害后如何判断责任，最后审查请求期限。婚姻继承不必强塞进这个场景，它们分别处理家庭身份及死亡后财产承接。\n\n**法谚怎么用：** “契约必须遵守”说明交易稳定，但要补合法有效与法定退出条件；“有权利必有救济”表达权益保护理念，不能据此跳过请求权和程序条件。法谚是理解提示，不替代具体规则。\n\n**本科学习连接：** 你可以说软件训练帮助你拆解对象和关系，但法律不只是形式逻辑，还要理解价值、证据和现实处境。这样既体现背景，也避免贬低其他专业或把裁判比成机械执行代码。","lectureHtml":"\u003cp>先说民法的对象，再说明总则与分编的关系，最后用一个场景串起几个领域。不要一上来列20个术语；也不要把民法概括为“规定人与人怎么相处”，那样无法和其他法律区分。\u003c/p>\n\u003cp>讲软件平台时，你可以按主体、合同、权益、责任、救济展开：平台与用户是谁，协议是否有效，代码和数据涉及谁的权利，系统运行造成损害后如何判断责任，最后审查请求期限。婚姻继承不必强塞进这个场景，它们分别处理家庭身份及死亡后财产承接。\u003c/p>\n\u003cp>\u003cstrong>法谚怎么用：\u003c/strong> “契约必须遵守”说明交易稳定，但要补合法有效与法定退出条件；“有权利必有救济”表达权益保护理念，不能据此跳过请求权和程序条件。法谚是理解提示，不替代具体规则。\u003c/p>\n\u003cp>\u003cstrong>本科学习连接：\u003c/strong> 你可以说软件训练帮助你拆解对象和关系，但法律不只是形式逻辑，还要理解价值、证据和现实处境。这样既体现背景，也避免贬低其他专业或把裁判比成机械执行代码。\u003c/p>\n","answer":"民法调整平等主体之间的人身和财产关系。我会按主体、行为、权利和救济理解它。总则规定共同规则，物权和合同安排财产归属与交易，人格权保护人的基本人格利益，婚姻家庭和继承处理家庭及死亡后的关系，侵权责任则回答侵害权益后如何负责。它们不是孤立的，例如软件服务会同时涉及合同、知识产权和个人信息保护。","follow":[["如果老师打断让你只讲合同呢？","立即缩到订立、效力、履行、终止与责任，再按追问展开，不继续背整张地图。"],["一定要准确背出全部条号吗？","优先准确说出制度和规则，确实记得才说条号；不确定时说明需核对，不能猜号。"]],"refs":["civil0","civil2"],"subject":"civil"}],"introHtml":"\u003cp>民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。先理解“平等主体”：强调法律地位平等，不是财富、能力、谈判实力相同。行政机关购买办公用品可以参与民事交易，行政处罚则是公权力活动。判断关系的性质，要看主体以什么身份、行使什么权力。\u003c/p>\n"},{"id":"criminal","name":"刑法","subtitle":"犯罪、责任与国家刑罚权的边界","color":"#995941","intro":"**总则路线：基本原则与适用范围 → 犯罪成立 → 排除犯罪的事由 → 犯罪停止形态 → 共同犯罪与罪数 → 刑罚裁量及执行。** 分则提供具体罪名和法定刑，总则提供共同判断工具，两者必须结合。\n\n常见刑法课程按绪论、犯罪论、刑事责任及刑罚、分则展开。这里先用传统四要件定位知识，再补充阶层化分析思路，不把不同理论体系拼成一个所谓统一公式。被问“属于哪里”时说“刑法总则的犯罪论中，关于故意犯罪停止形态的问题”等，比随意报教材章节号稳妥。\n\n| 审查节点 | 先问什么 | 别混淆什么 |\n|---|---|---|\n| 法定与适用 | 有无规定，能否适用我国刑法？ | 道德谴责不等于犯罪 |\n| 构成 | 行为、结果、因果、主体、主观状态怎样？ | 造成损失不等于主观有罪 |\n| 正当化 | 防卫、避险等是否排除违法？ | 有伤亡不自动排除防卫 |\n| 停止形态 | 预备、着手、既遂，在哪一处停下？ | 未遂与中止不只看有没有结果 |\n| 多人多罪 | 是否共同故意，各起何作用？ | 在场不等于共同犯罪 |\n| 刑罚 | 是否及如何处罚，执行是否调整？ | 缓刑不是无罪，减刑不是改判无罪 |","route":"刑01—刑08构成主干；刑09—刑12解决量刑和罪数；刑13—刑16练常见罪名、AI场景及完整分析。","lessons":[{"id":"刑01","title":"刑法定位、三原则与谦抑性","priority":"P0","where":"总则第一章；第3—5、13条","question":"刑法既要打击犯罪，为什么还强调保障人权？","lecture":"刑罚能够剥夺自由、财产乃至生命，因而入罪和处罚必须受到严格约束。罪刑法定要求行为是否犯罪、如何处罚有法律依据，不能因舆论认为可恶便类推入罪；适用刑法人人平等反对身份特权；罪责刑相适应要求刑罚与罪行和刑事责任相匹配。\n\n“法无明文规定不为罪，法无明文规定不处罚”是罪刑法定的记忆表达。刑法第13条还规定情节显著轻微、危害不大的，不认为是犯罪；这里的“显著轻微”不能简化成所有情节轻微都无罪。\n\n谦抑性强调刑罚作为严厉手段，应在必要范围内使用，民事、行政等手段能够合理处理的问题不能任意犯罪化。它不等于见到新技术犯罪就不管，也不是法定入罪条件之外随意免罪的借口。\n\n**教学假设：** 一个人提出较高物流赔偿请求，可能是证据或合同理解争议。模型标注高风险并不能直接证明诈骗，仍需法定构成与证据。","lectureHtml":"\u003cp>刑罚能够剥夺自由、财产乃至生命，因而入罪和处罚必须受到严格约束。罪刑法定要求行为是否犯罪、如何处罚有法律依据，不能因舆论认为可恶便类推入罪；适用刑法人人平等反对身份特权；罪责刑相适应要求刑罚与罪行和刑事责任相匹配。\u003c/p>\n\u003cp>“法无明文规定不为罪，法无明文规定不处罚”是罪刑法定的记忆表达。刑法第13条还规定情节显著轻微、危害不大的，不认为是犯罪；这里的“显著轻微”不能简化成所有情节轻微都无罪。\u003c/p>\n\u003cp>谦抑性强调刑罚作为严厉手段，应在必要范围内使用，民事、行政等手段能够合理处理的问题不能任意犯罪化。它不等于见到新技术犯罪就不管，也不是法定入罪条件之外随意免罪的借口。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 一个人提出较高物流赔偿请求，可能是证据或合同理解争议。模型标注高风险并不能直接证明诈骗，仍需法定构成与证据。\u003c/p>\n","answer":"刑法的功能包括保护法益和保障人权。因为刑罚很严厉，所以必须遵守罪刑法定、平等适用和罪责刑相适应，既不能放纵符合条件的犯罪，也不能凭道德评价或模型标签入罪。谦抑性提醒我们先准确区分一般纠纷与犯罪。","follow":[["罪刑法定是不是不允许任何解释？","不是，依法解释是适用法律所必需，但不得突破文本可能含义进行不利于行为人的类推入罪。"],["不道德一定犯罪吗？","不一定，犯罪必须满足具体法律构成，社会危害评价不能替代法定要求。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑02","title":"空间适用与从旧兼从轻","priority":"P1","where":"总则第一章；第6—12条","question":"行为发生后法律变了，适用哪一部？","lecture":"先问刑法是否有管辖根据，再问新旧法如何适用。属地原则关注行为或结果发生在我国领域内的情况，还包括法律规定的船舶、航空器等；属人原则关注我国公民在境外犯罪，存在法定刑及特定身份等规则；保护原则针对外国人在境外侵害我国国家或公民的法定情形；普遍管辖则与我国缔结或参加的国际条约规定有关，不能说世界上任何犯罪我国都能无条件管。\n\n从旧兼从轻意味着，对新法施行前的行为原则上按行为时法律判断，但新法不认为犯罪或处罚较轻时适用新法。已经作出的生效判决依有关规则保持效力，不能把它理解为每次修法都自动重判全部旧案。\n\n跨境AI诈骗中，服务器在境外不当然排除我国刑法适用，要调查行为地、结果地、行为人国籍等连接点。刑法管辖与跨境取证、引渡、司法协助又是不同层次，有管辖根据不代表执行没有障碍。","lectureHtml":"\u003cp>先问刑法是否有管辖根据，再问新旧法如何适用。属地原则关注行为或结果发生在我国领域内的情况，还包括法律规定的船舶、航空器等；属人原则关注我国公民在境外犯罪，存在法定刑及特定身份等规则；保护原则针对外国人在境外侵害我国国家或公民的法定情形；普遍管辖则与我国缔结或参加的国际条约规定有关，不能说世界上任何犯罪我国都能无条件管。\u003c/p>\n\u003cp>从旧兼从轻意味着，对新法施行前的行为原则上按行为时法律判断，但新法不认为犯罪或处罚较轻时适用新法。已经作出的生效判决依有关规则保持效力，不能把它理解为每次修法都自动重判全部旧案。\u003c/p>\n\u003cp>跨境AI诈骗中，服务器在境外不当然排除我国刑法适用，要调查行为地、结果地、行为人国籍等连接点。刑法管辖与跨境取证、引渡、司法协助又是不同层次，有管辖根据不代表执行没有障碍。\u003c/p>\n","answer":"刑法在时间上原则上从旧兼从轻，即先适用行为时法律，但新法不认为犯罪或处罚较轻时适用新法。跨境行为还要先审查属地、属人等管辖依据，不能仅凭服务器在境外便认为我国刑法不适用。","follow":[["任何新法都不追溯吗？","不准确，从旧兼从轻保留有利于行为人的适用规则。"],["有管辖权就一定能立即抓到境外行为人吗？","不是，管辖依据与取证、司法协助及执行条件应分开。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑03","title":"犯罪构成、客体与客观方面","priority":"P0","where":"总则犯罪论；第13条及具体罪名","question":"犯罪构成四要件是什么？","lecture":"传统四要件是犯罪客体、客观方面、主体和主观方面。客体关注受刑法保护而被侵害的社会关系或法益，犯罪对象是行为直接作用的人或物，不能把被偷手机本身等同盗窃罪的犯罪客体。\n\n客观方面分析危害行为、法定结果、因果关系及某些罪名要求的时间地点方法等。不是每个犯罪都以实际损害发生为既遂条件，危险犯、行为犯等结构要结合分则。因果关系即使成立，也不自动推出主观责任、违法性等其他条件成立。\n\n阶层体系可按构成要件符合性、违法性、有责性分析；与四要件体系的术语和安放位置不同。面试先说明采用什么框架，不要把“主体—违法性—客体—责任”随意串成混合目录。两种体系都应落实到具体行为与法律规则。\n\n**教学假设：** 软件输出错误引发损失，只说明需要调查，不能直接推出开发者构成某罪；还需要法定行为、因果、主体和主观要件等。","lectureHtml":"\u003cp>传统四要件是犯罪客体、客观方面、主体和主观方面。客体关注受刑法保护而被侵害的社会关系或法益，犯罪对象是行为直接作用的人或物，不能把被偷手机本身等同盗窃罪的犯罪客体。\u003c/p>\n\u003cp>客观方面分析危害行为、法定结果、因果关系及某些罪名要求的时间地点方法等。不是每个犯罪都以实际损害发生为既遂条件，危险犯、行为犯等结构要结合分则。因果关系即使成立，也不自动推出主观责任、违法性等其他条件成立。\u003c/p>\n\u003cp>阶层体系可按构成要件符合性、违法性、有责性分析；与四要件体系的术语和安放位置不同。面试先说明采用什么框架，不要把“主体—违法性—客体—责任”随意串成混合目录。两种体系都应落实到具体行为与法律规则。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 软件输出错误引发损失，只说明需要调查，不能直接推出开发者构成某罪；还需要法定行为、因果、主体和主观要件等。\u003c/p>\n","answer":"传统犯罪构成包括客体、客观方面、主体和主观方面。分析时既要看侵犯了什么法益，也要看具体行为、主体资格和故意过失等。犯罪客体与犯罪对象不同，造成损失也不能代替全部构成要件的判断。","follow":[["偷手机的客体就是手机吗？","手机是犯罪对象，客体重点在于受侵害的财产法益等法律保护关系。"],["没有实际损失一定不构成犯罪吗？","不是，须看具体罪的成立及既遂结构，部分犯罪关注危险或法定行为本身。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑04","title":"作为、不作为与因果关系","priority":"P1","where":"犯罪论客观方面","question":"看到别人遇险不救，一定构成犯罪吗？","lecture":"作为是实施被禁止的行为；不作为是在有作为义务并有能力履行时，没有履行而符合犯罪要求。并非所有道德上的救助期待都是刑法义务。常见义务来源包括法律规定、职务业务要求、特定承担以及先前行为造成危险等，具体仍要结合罪名和义务保护范围。\n\n判断不作为，至少问三步：有没有刑法上的作为义务，能不能履行，不履行是否达到该罪要求。父母对幼儿的保护义务，与普通路人的处境不同；先前行为制造危险的人，也可能产生排除危险义务。\n\n因果关系要分析行为与结果的联系以及介入因素，不能仅凭先发生、后发生就认定因果。因果关系成立只是责任分析的一部分，仍须审查主观过错等。\n\n**教学假设：** 平台发现系统可能造成伤害，是否构成刑法上的不作为，需明确法定义务与责任条件，不能只凭“平台有能力管”就直接判罪。","lectureHtml":"\u003cp>作为是实施被禁止的行为；不作为是在有作为义务并有能力履行时，没有履行而符合犯罪要求。并非所有道德上的救助期待都是刑法义务。常见义务来源包括法律规定、职务业务要求、特定承担以及先前行为造成危险等，具体仍要结合罪名和义务保护范围。\u003c/p>\n\u003cp>判断不作为，至少问三步：有没有刑法上的作为义务，能不能履行，不履行是否达到该罪要求。父母对幼儿的保护义务，与普通路人的处境不同；先前行为制造危险的人，也可能产生排除危险义务。\u003c/p>\n\u003cp>因果关系要分析行为与结果的联系以及介入因素，不能仅凭先发生、后发生就认定因果。因果关系成立只是责任分析的一部分，仍须审查主观过错等。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 平台发现系统可能造成伤害，是否构成刑法上的不作为，需明确法定义务与责任条件，不能只凭“平台有能力管”就直接判罪。\u003c/p>\n","answer":"不一定。不作为犯罪首先要求存在刑法上的作为义务，并具有履行能力，不履行还须符合具体犯罪要求。道德上的应当帮助与刑法上的必须作为不能等同。即使存在因果联系，还要继续审查其他构成条件。","follow":[["制造危险后离开也可能是不作为吗？","可能，先前行为引起的保护或排险义务需要具体判断，不能只看后来什么也没做。"],["先后发生就是因果吗？","不是，还要分析实质联系、介入因素以及结果归责。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑05","title":"刑事责任年龄与责任能力","priority":"P0","where":"总则第二章；第17—19条","question":"不满十四周岁就绝对不负刑事责任吗？","lecture":"年龄必须按犯罪时判断，不是审判时。已满16周岁犯罪，应当负刑事责任。已满14不满16周岁，对故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质的法定情形承担责任；不能把所有故意伤害或所有毒品行为一概纳入。\n\n已满12不满14周岁，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应负刑事责任。这里罪行、结果或手段、情节、核准程序需要完整把握，不是“满12就全面担责”。不满12周岁不负刑事责任，但不等于没有其他依法处置和保护教育措施。\n\n已满12不满18周岁依法追责的，应当从轻或者减轻处罚。精神病人是否免责，要看行为时辨认或控制能力并依法鉴定，诊断名称本身不足；醉酒的人犯罪应负刑事责任。行为能力与刑事责任能力属于不同部门法判断，不要照搬民法8岁、18岁的分类。","lectureHtml":"\u003cp>年龄必须按犯罪时判断，不是审判时。已满16周岁犯罪，应当负刑事责任。已满14不满16周岁，对故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质的法定情形承担责任；不能把所有故意伤害或所有毒品行为一概纳入。\u003c/p>\n\u003cp>已满12不满14周岁，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应负刑事责任。这里罪行、结果或手段、情节、核准程序需要完整把握，不是“满12就全面担责”。不满12周岁不负刑事责任，但不等于没有其他依法处置和保护教育措施。\u003c/p>\n\u003cp>已满12不满18周岁依法追责的，应当从轻或者减轻处罚。精神病人是否免责，要看行为时辨认或控制能力并依法鉴定，诊断名称本身不足；醉酒的人犯罪应负刑事责任。行为能力与刑事责任能力属于不同部门法判断，不要照搬民法8岁、18岁的分类。\u003c/p>\n","answer":"不是。我国刑法对12至14周岁的特定严重故意杀人、故意伤害情形设置严格追责条件，包括严重结果或手段、情节恶劣及最高检核准追诉。14至16周岁承担限定范围责任，16周岁以上原则上承担刑事责任。未成年人还有法定从宽规则。","follow":[["12岁以上是不是所有犯罪都负责？","不是，12至14周岁的适用范围和程序都十分严格，不能概括为全面降低刑责年龄。"],["喝醉了能免责吗？","刑法规定醉酒的人犯罪应当负刑事责任，不能把自我醉酒简单当作免责依据。"]],"refs":["criminal","amend11"],"subject":"criminal"},{"id":"刑06","title":"故意、过失、意外事件与认识错误","priority":"P0","where":"总则第二章；第14—16条","question":"间接故意和过于自信的过失怎么区分？","lecture":"故意不仅是知道风险，还包括对结果的意志态度。直接故意是明知危害结果并希望发生；间接故意是明知并放任。过于自信的过失是已经预见，但轻信能够避免；疏忽大意的过失是应当预见而因疏忽没有预见。意外事件则欠缺故意和过失，不能仅凭结果严重追责。\n\n间接故意与过于自信过失都可能预见结果，区别在于放任还是轻信能够避免，要结合采取措施、现实依据、行为过程等证据推断，不靠事后自称。过失犯罪，法律有规定的才负刑事责任。\n\n目的和动机也不同：目的是希望通过犯罪直接达到的结果，动机是促使行为的心理原因。特定目的可能是罪名要件，动机通常影响评价但不当然决定罪名。\n\n认识错误包括对事实的错误与对法律的错误。误认事实可能影响主观构成；单说“不知道法律禁止”通常不能当然免责。不同错误类型存在理论分歧，初试口试优先说清认错什么、影响哪个要件，不假装争议已有唯一结论。","lectureHtml":"\u003cp>故意不仅是知道风险，还包括对结果的意志态度。直接故意是明知危害结果并希望发生；间接故意是明知并放任。过于自信的过失是已经预见，但轻信能够避免；疏忽大意的过失是应当预见而因疏忽没有预见。意外事件则欠缺故意和过失，不能仅凭结果严重追责。\u003c/p>\n\u003cp>间接故意与过于自信过失都可能预见结果，区别在于放任还是轻信能够避免，要结合采取措施、现实依据、行为过程等证据推断，不靠事后自称。过失犯罪，法律有规定的才负刑事责任。\u003c/p>\n\u003cp>目的和动机也不同：目的是希望通过犯罪直接达到的结果，动机是促使行为的心理原因。特定目的可能是罪名要件，动机通常影响评价但不当然决定罪名。\u003c/p>\n\u003cp>认识错误包括对事实的错误与对法律的错误。误认事实可能影响主观构成；单说“不知道法律禁止”通常不能当然免责。不同错误类型存在理论分歧，初试口试优先说清认错什么、影响哪个要件，不假装争议已有唯一结论。\u003c/p>\n","answer":"二者都可能预见危害结果，但间接故意对结果持放任态度，过于自信的过失则轻信能够避免。判断要结合行为前后的措施和客观依据，不能只听行为人的说法。对于过失，还要有法律明确规定才能追究相应犯罪。","follow":[["没有预见结果就一定无罪吗？","不是，应当预见但疏忽没有预见，可能构成疏忽大意的过失。"],["模型准确率很高就能否定开发者过失吗？","不能直接推出，须结合具体用途、可预见风险、注意义务和行为判断。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑07","title":"正当防卫、特别防卫与紧急避险","priority":"P0","where":"总则第二章；第20、21条","question":"把侵害人打伤了，就一定是防卫过当吗？","lecture":"对正在进行的行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪，法律有特别防卫规则，符合条件造成侵害人伤亡的不属防卫过当。但不是所有纠纷都属于这类暴力侵害。\n\n紧急避险是为避免正在发生的危险，不得已损害另一较小合法利益；危险来源可以不限于人的违法行为。防卫针对侵害人，避险可能牺牲无辜第三人利益，因此不得已、限度及特定职责等限制不同。\n\n**真实案例：** 指导案例93号于欢案承认正在进行的非法限制人身自由可以成为防卫起因，但结合侵害程度与防卫损害认定防卫过当。记住它不是最终认定完全无罪的案件。","lectureHtml":"\u003cp>对正在进行的行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪，法律有特别防卫规则，符合条件造成侵害人伤亡的不属防卫过当。但不是所有纠纷都属于这类暴力侵害。\u003c/p>\n\u003cp>紧急避险是为避免正在发生的危险，不得已损害另一较小合法利益；危险来源可以不限于人的违法行为。防卫针对侵害人，避险可能牺牲无辜第三人利益，因此不得已、限度及特定职责等限制不同。\u003c/p>\n\u003cp>\u003cstrong>真实案例：\u003c/strong> 指导案例93号于欢案承认正在进行的非法限制人身自由可以成为防卫起因，但结合侵害程度与防卫损害认定防卫过当。记住它不是最终认定完全无罪的案件。\u003c/p>\n","answer":"不一定。防卫过当要同时判断是否明显超过必要限度并造成重大损害，不能唯结果论。还要审查侵害是否正在进行、是否针对侵害人以及有无特别防卫情形。于欢案可以说明具有防卫起因与最终属于防卫过当并不矛盾。","follow":[["正当防卫与紧急避险最重要区别？","防卫针对不法侵害人；避险为避免危险可能损害第三人利益，因而有不得已和利益衡量等更严格限制。"],["法不能向不法让步是不是允许无限反击？","不是，这是价值表达，仍要落到防卫时间、对象和限度等法定条件。"]],"refs":["criminal","yuhuan"],"subject":"criminal"},{"id":"刑08","title":"预备、未遂、中止、既遂","priority":"P0","where":"总则犯罪停止形态；第22—24条","question":"犯罪未遂和犯罪中止有什么区别？","lecture":"先画时间线：产生犯罪意图 → 准备工具、制造条件 → 着手实行 → 满足具体罪既遂要求。单纯犯意通常不能处罚；着手是从预备到实行的重要分界，应结合具体罪和法益危险判断。既遂不等于“行为人所有目标都达到”，看分则规定的构成标准。\n\n未遂是已经着手，因意志以外原因未得逞；中止是在犯罪过程中自动放弃，或者自动有效防止犯罪结果发生。简化口诀“想干没干成、能干不想干”只帮助入门，仍要判断主观认识、自动性与有效性。中止可以发生在预备阶段，也可以发生在实行阶段，不是只能发生在着手以后。\n\n处罚区别必须准确：预备犯可以比照既遂从轻、减轻或免除；未遂犯可以比照既遂从轻或减轻；中止没有造成损害应当免除，造成损害应当减轻。不要把可以、应当以及有无免除混起来。\n\n**教学假设：** 盗窃时听到警报以为将被捕而逃跑，要审查意志以外障碍；投毒后自动采取措施并有效避免结果，才进一步讨论相应中止，单纯后悔不够。","lectureHtml":"\u003cp>先画时间线：产生犯罪意图 → 准备工具、制造条件 → 着手实行 → 满足具体罪既遂要求。单纯犯意通常不能处罚；着手是从预备到实行的重要分界，应结合具体罪和法益危险判断。既遂不等于“行为人所有目标都达到”，看分则规定的构成标准。\u003c/p>\n\u003cp>未遂是已经着手，因意志以外原因未得逞；中止是在犯罪过程中自动放弃，或者自动有效防止犯罪结果发生。简化口诀“想干没干成、能干不想干”只帮助入门，仍要判断主观认识、自动性与有效性。中止可以发生在预备阶段，也可以发生在实行阶段，不是只能发生在着手以后。\u003c/p>\n\u003cp>处罚区别必须准确：预备犯可以比照既遂从轻、减轻或免除；未遂犯可以比照既遂从轻或减轻；中止没有造成损害应当免除，造成损害应当减轻。不要把可以、应当以及有无免除混起来。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 盗窃时听到警报以为将被捕而逃跑，要审查意志以外障碍；投毒后自动采取措施并有效避免结果，才进一步讨论相应中止，单纯后悔不够。\u003c/p>\n","answer":"未遂与中止都可能没有达到既遂，但停止原因不同。未遂是在着手后因意志以外原因未得逞；中止要求自动放弃或自动有效防止结果。中止也可能发生在预备阶段，处罚上没有损害应当免除，有损害应当减轻。","follow":[["还没着手可能中止吗？","可能，在犯罪预备过程中自动放弃也应结合规则认定中止；单纯犯意又要另外区分。"],["已经造成既遂结果，再后悔就是中止吗？","不是，事后悔罪、退赔等可能影响量刑，但不能把已经既遂倒退成中止。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑09","title":"共同犯罪、单位犯罪与技术帮助","priority":"P0","where":"总则第二章；第25—31条","question":"给别人提供技术工具，就构成共同犯罪吗？","lecture":"共同犯罪通常要求二人以上共同故意犯罪，有共同犯罪故意和相应共同犯罪行为。共同过失犯罪不以共同犯罪论处，应负责任的依其所犯的罪分别处罚。人在现场、认识行为人、出售普通商品，均不足以直接证明共同故意。\n\n主犯、从犯按具体作用判断，不只看谁动手。从犯在共同犯罪中起次要或辅助作用，应当从轻、减轻或者免除处罚；组织指挥者即使没有直接实施每个行为，也可能是主犯。教唆和帮助还要审查故意与具体规则。\n\n单位犯罪须法律规定为单位犯罪的情形，并符合单位犯罪的成立条件，通常对单位判处罚金、对直接负责的主管人员和其他直接责任人员判处刑罚，法律另有规定的依规定。个人借公司名义犯罪不必然是单位犯罪。\n\n**AI连接：** 提供技术工具是否成立共犯或帮助信息网络犯罪活动罪，取决于明知、帮助行为、情节等法定要求及证据，不能因代码可被滥用就推定开发者有罪。","lectureHtml":"\u003cp>共同犯罪通常要求二人以上共同故意犯罪，有共同犯罪故意和相应共同犯罪行为。共同过失犯罪不以共同犯罪论处，应负责任的依其所犯的罪分别处罚。人在现场、认识行为人、出售普通商品，均不足以直接证明共同故意。\u003c/p>\n\u003cp>主犯、从犯按具体作用判断，不只看谁动手。从犯在共同犯罪中起次要或辅助作用，应当从轻、减轻或者免除处罚；组织指挥者即使没有直接实施每个行为，也可能是主犯。教唆和帮助还要审查故意与具体规则。\u003c/p>\n\u003cp>单位犯罪须法律规定为单位犯罪的情形，并符合单位犯罪的成立条件，通常对单位判处罚金、对直接负责的主管人员和其他直接责任人员判处刑罚，法律另有规定的依规定。个人借公司名义犯罪不必然是单位犯罪。\u003c/p>\n\u003cp>\u003cstrong>AI连接：\u003c/strong> 提供技术工具是否成立共犯或帮助信息网络犯罪活动罪，取决于明知、帮助行为、情节等法定要求及证据，不能因代码可被滥用就推定开发者有罪。\u003c/p>\n","answer":"不一定。共同犯罪通常需要共同故意和共同犯罪行为，技术工具可以被滥用不等于提供者必然有共同故意。还要区分普通开发、明知犯罪而帮助，以及是否符合特定帮助类罪名的构成，不能只凭参与技术链条追责。","follow":[["没直接动手一定是从犯吗？","不是，主从犯看在共同犯罪中的作用，组织指挥者也可能是主犯。"],["两个人一起过失就叫共同犯罪？","刑法规定共同过失不以共同犯罪论处，依法分别判断责任。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑10","title":"罪数与竞合：一件事不一定一罪","priority":"P1","where":"总则罪数理论与分则关系","question":"一个行为符合两个罪名，是不是必须数罪并罚？","lecture":"罪数问题在完成具体构成分析之后出现。法条竞合强调法条之间存在一般与特别等关系；想象竞合强调一个行为触犯数个罪名，通常依相应规则从一重处罚；数个独立行为构成数罪，则可能依法并罚。不能只看罪名数量，也不能把“一个目的”当作永远只成立一罪的依据。\n\n继续犯、连续犯、牵连关系等概念在教材中有不同制度意义，实务结论还受具体法条和司法解释影响。两天内先懂为什么需要罪数规则：防止重复评价，也防止遗漏不同法益侵害。\n\n**教学假设：** 非法获取个人信息后再实施诈骗，不能未经构成审查便一律说吸收或并罚；应查具体行为独立性、法益、法条和相关解释。对复杂题可以先明确哪些构成有可能成立，再说明竞合需进一步判断。\n\n与民法比较：民事责任竞合关注请求基础和损害填补，刑法罪数关系关注定罪评价与处罚，不能把民法“择一请求”直接移用到刑法。","lectureHtml":"\u003cp>罪数问题在完成具体构成分析之后出现。法条竞合强调法条之间存在一般与特别等关系；想象竞合强调一个行为触犯数个罪名，通常依相应规则从一重处罚；数个独立行为构成数罪，则可能依法并罚。不能只看罪名数量，也不能把“一个目的”当作永远只成立一罪的依据。\u003c/p>\n\u003cp>继续犯、连续犯、牵连关系等概念在教材中有不同制度意义，实务结论还受具体法条和司法解释影响。两天内先懂为什么需要罪数规则：防止重复评价，也防止遗漏不同法益侵害。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 非法获取个人信息后再实施诈骗，不能未经构成审查便一律说吸收或并罚；应查具体行为独立性、法益、法条和相关解释。对复杂题可以先明确哪些构成有可能成立，再说明竞合需进一步判断。\u003c/p>\n\u003cp>与民法比较：民事责任竞合关注请求基础和损害填补，刑法罪数关系关注定罪评价与处罚，不能把民法“择一请求”直接移用到刑法。\u003c/p>\n","answer":"不一定。需要区分法条竞合、想象竞合和数个独立犯罪等情形，再依法决定从一重还是并罚。它的意义在于完整评价行为，同时避免重复评价，不能看到两个罪名就直接叠加刑罚。","follow":[["一个犯罪目的就永远只定一罪？","不是，目的相同不决定行为和法益评价必然单一。"],["不会判断复杂竞合时怎样回答？","先给具体构成和争点，说明需结合特别规定判断，不凭记忆把所有情形说成一律并罚。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑11","title":"刑罚体系与从轻、减轻、免除","priority":"P0","where":"总则第三、四章；第32—35、49、61—63条","question":"罚金和罚款、拘役和拘留有什么不同？","lecture":"主刑是管制、拘役、有期徒刑、无期徒刑、死刑；附加刑是罚金、剥夺政治权利、没收财产，附加刑也可以独立适用。驱逐出境对犯罪的外国人有相应适用规则。罚金属于刑罚，罚款常见于行政处罚或司法强制等；拘役是刑罚，刑事拘留是强制措施，行政拘留是行政处罚。\n\n量刑要根据犯罪事实、性质、情节和社会危害程度，依法律判处。从轻通常在法定刑幅度内选择较轻，减轻通常低于法定刑处罚，免除则有犯罪但依法不判处刑罚；免除处罚不等于无罪。\n\n犯罪时不满18周岁和审判时怀孕的妇女不适用死刑；审判时已满75周岁原则上不适用死刑，但以特别残忍手段致人死亡的例外。此处判断时间不同，不能一律看判决当天是否成年。\n\n刑罚不是国家唯一治理手段，刑事责任、非刑罚处理与其他责任应区分。面试不必背全部刑期上限，但这几组性质差异要牢固。","lectureHtml":"\u003cp>主刑是管制、拘役、有期徒刑、无期徒刑、死刑；附加刑是罚金、剥夺政治权利、没收财产，附加刑也可以独立适用。驱逐出境对犯罪的外国人有相应适用规则。罚金属于刑罚，罚款常见于行政处罚或司法强制等；拘役是刑罚，刑事拘留是强制措施，行政拘留是行政处罚。\u003c/p>\n\u003cp>量刑要根据犯罪事实、性质、情节和社会危害程度，依法律判处。从轻通常在法定刑幅度内选择较轻，减轻通常低于法定刑处罚，免除则有犯罪但依法不判处刑罚；免除处罚不等于无罪。\u003c/p>\n\u003cp>犯罪时不满18周岁和审判时怀孕的妇女不适用死刑；审判时已满75周岁原则上不适用死刑，但以特别残忍手段致人死亡的例外。此处判断时间不同，不能一律看判决当天是否成年。\u003c/p>\n\u003cp>刑罚不是国家唯一治理手段，刑事责任、非刑罚处理与其他责任应区分。面试不必背全部刑期上限，但这几组性质差异要牢固。\u003c/p>\n","answer":"罚金、拘役属于刑罚，分别不同于通常作为行政处罚等措施的罚款、拘留。量刑还要区分从轻、减轻和免除：从轻通常在法定幅度内，减轻通常在法定刑以下，免除处罚也不等于行为没有构成犯罪。","follow":[["附加刑只能跟着主刑吗？","可以独立适用，具体按法律规定。"],["18岁前犯罪、成年后审判能判死刑吗？","不适用死刑，未成年人这一限制看犯罪时年龄。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑12","title":"自首、立功、累犯、缓刑与假释","priority":"P0","where":"总则第四章；第65—68、72—74、78、81条","question":"缓刑是不是无罪释放？","lecture":"自首通常是自动投案并如实供述自己的罪行，另有准自首规则；坦白与自首不能等同。立功通常涉及揭发他人犯罪经查证属实等法定情形，不能把如实交代自己行为全部叫立功。不同情节中的可以、应当从宽应按法条区别。\n\n一般累犯涉及前后罪的故意性质、刑罚条件、刑罚执行完毕或赦免后五年内再犯等要求，过失犯罪和不满18周岁的人犯罪等有排除规则；特别累犯另有规定。不能说再次犯罪就是累犯。累犯应当从重处罚，且不适用缓刑、假释。\n\n缓刑适用于被判拘役、三年以下有期徒刑等且符合犯罪情节较轻、悔罪表现、没有再犯罪危险、对居住社区无重大不良影响等条件的人。符合条件的不满18周岁者、孕妇、已满75周岁者应当宣告缓刑，累犯和犯罪集团首要分子排除。考验期间接受依法监管，违反条件可能撤销，绝不是无罪。\n\n假释是在已执行一定刑期、符合条件后附条件提前释放；减刑是依法减轻原判刑罚。一个是附条件释放，一个是刑期调整，均不等于原来定罪错误。","lectureHtml":"\u003cp>自首通常是自动投案并如实供述自己的罪行，另有准自首规则；坦白与自首不能等同。立功通常涉及揭发他人犯罪经查证属实等法定情形，不能把如实交代自己行为全部叫立功。不同情节中的可以、应当从宽应按法条区别。\u003c/p>\n\u003cp>一般累犯涉及前后罪的故意性质、刑罚条件、刑罚执行完毕或赦免后五年内再犯等要求，过失犯罪和不满18周岁的人犯罪等有排除规则；特别累犯另有规定。不能说再次犯罪就是累犯。累犯应当从重处罚，且不适用缓刑、假释。\u003c/p>\n\u003cp>缓刑适用于被判拘役、三年以下有期徒刑等且符合犯罪情节较轻、悔罪表现、没有再犯罪危险、对居住社区无重大不良影响等条件的人。符合条件的不满18周岁者、孕妇、已满75周岁者应当宣告缓刑，累犯和犯罪集团首要分子排除。考验期间接受依法监管，违反条件可能撤销，绝不是无罪。\u003c/p>\n\u003cp>假释是在已执行一定刑期、符合条件后附条件提前释放；减刑是依法减轻原判刑罚。一个是附条件释放，一个是刑期调整，均不等于原来定罪错误。\u003c/p>\n","answer":"不是。缓刑以有罪判刑为前提，对符合条件的人设置考验期并依法监管，未出现法定撤销情形时原判刑罚不再执行。它不同于假释和减刑，也不是所有判三年以下的人都当然适用，累犯等被排除。","follow":[["主动交代就一律自首吗？","不一定，要看是否自动投案、如实供述及其他法定情形，坦白与自首不同。"],["再次犯罪就是累犯吗？","不是，需要满足前后罪性质、刑罚、时间等条件，并注意未成年人和过失等规则。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑13","title":"分则地图与常见人身、财产犯罪","priority":"P0","where":"分则第四、五章；第232、234、263、264、266、270条","question":"盗窃、诈骗、抢劫如何区分？","lecture":"分则十章依保护对象等安排：国家安全、公共安全、社会主义市场经济秩序、公民人身民主权利、财产、社会管理秩序、国防利益、贪污贿赂、渎职、军人违反职责。先定位被侵害法益，再看行为方式和主观要求。\n\n盗窃侧重违背占有人意志转移财物占有；诈骗的典型链条是欺骗—认识错误—处分财产—财产损害；抢劫通过暴力、胁迫等法定方式压制反抗夺取财物。不要只靠秘密与公开区分，某些公开取财仍可能是盗窃。侵占通常涉及将合法持有的他人财物等非法占为己有并满足法定条件，起初占有状态不同。\n\n故意杀人与故意伤害致死不能只看结果，同为死亡仍要区分故意内容。交通肇事、危险驾驶和以危险方法危害公共安全也不相同，需看危险对象、方式、结果及主观状态。\n\n**教学假设：** AI冒充熟人让对方转账，若满足其他条件，可以按诈骗构成分析；技术名称并不会自动创造一个新的“AI诈骗罪”。","lectureHtml":"\u003cp>分则十章依保护对象等安排：国家安全、公共安全、社会主义市场经济秩序、公民人身民主权利、财产、社会管理秩序、国防利益、贪污贿赂、渎职、军人违反职责。先定位被侵害法益，再看行为方式和主观要求。\u003c/p>\n\u003cp>盗窃侧重违背占有人意志转移财物占有；诈骗的典型链条是欺骗—认识错误—处分财产—财产损害；抢劫通过暴力、胁迫等法定方式压制反抗夺取财物。不要只靠秘密与公开区分，某些公开取财仍可能是盗窃。侵占通常涉及将合法持有的他人财物等非法占为己有并满足法定条件，起初占有状态不同。\u003c/p>\n\u003cp>故意杀人与故意伤害致死不能只看结果，同为死亡仍要区分故意内容。交通肇事、危险驾驶和以危险方法危害公共安全也不相同，需看危险对象、方式、结果及主观状态。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> AI冒充熟人让对方转账，若满足其他条件，可以按诈骗构成分析；技术名称并不会自动创造一个新的“AI诈骗罪”。\u003c/p>\n","answer":"可以从取得财物的方式区分。盗窃侧重违背占有人意志取得财物；诈骗通常通过欺骗使对方陷入错误并处分财产；抢劫涉及暴力、胁迫等压制反抗的手段。还须审查主观目的和其他法定条件，不能仅按公开或秘密判断。","follow":[["人死了就一定故意杀人吗？","不是，还须区分杀人故意、伤害故意及过失等主观内容。"],["AI冒充熟人骗钱要另立新罪才能处理吗？","不当然需要，现有诈骗等罪名能够覆盖时先依既有规则判断。"]],"refs":["criminal"],"subject":"criminal"},{"id":"刑14","title":"民事欺诈、刑事诈骗与理赔模型","priority":"P0","where":"总则主观方面、分则侵犯财产罪；第266条","question":"理赔金额异常就能认定诈骗吗？","lecture":"民事欺诈与刑事诈骗有交叉，但刑事入罪要求更严格。刑事诈骗通常要求非法占有目的、欺骗行为、错误认识、财产处分、损害及数额或情节等法定条件。赔偿请求较高可能源于证据不足、合同解释或估价争议，也可能确有欺骗，需要逐项查明。\n\n**教学假设：** 物流企业用统计模型预测金额、划分风险。标签来自建模规则，不是司法机关依证据作出的违法认定。准确率、F1等是模型指标，不是刑事证明标准。少数类误判还可能让合法请求承受不当怀疑。\n\n模型可以辅助人工核查，但需要区分合同争议、民事侵权与犯罪，并设置适当的解释、申诉和纠错机制。这是教学分析建议，不是对任何实际项目完成合规评估的声明。\n\n企业减少赔付的目标不等于法律上的公平。刑法处罚符合构成的犯罪，民法也保护正当赔偿请求。","lectureHtml":"\u003cp>民事欺诈与刑事诈骗有交叉，但刑事入罪要求更严格。刑事诈骗通常要求非法占有目的、欺骗行为、错误认识、财产处分、损害及数额或情节等法定条件。赔偿请求较高可能源于证据不足、合同解释或估价争议，也可能确有欺骗，需要逐项查明。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 物流企业用统计模型预测金额、划分风险。标签来自建模规则，不是司法机关依证据作出的违法认定。准确率、F1等是模型指标，不是刑事证明标准。少数类误判还可能让合法请求承受不当怀疑。\u003c/p>\n\u003cp>模型可以辅助人工核查，但需要区分合同争议、民事侵权与犯罪，并设置适当的解释、申诉和纠错机制。这是教学分析建议，不是对任何实际项目完成合规评估的声明。\u003c/p>\n\u003cp>企业减少赔付的目标不等于法律上的公平。刑法处罚符合构成的犯罪，民法也保护正当赔偿请求。\u003c/p>\n","answer":"不能。模型风险标签只是统计提示，不等于非法占有目的和欺骗事实的证明。风险识别更适合作为人工核查辅助，应区分合同争议、民事欺诈与达到法定条件的诈骗，并注意解释和纠错。","follow":[["为什么不追求把可疑客户全拦下？","误判会影响合法请求，治理目标应考虑权利保障、证据和纠错，不能只优化拦截量。"],["如何避免回答过度绝对？","区分基本规则与适用条件，检查是否有法定例外；只引用确实核对过的法条和案例，不猜条号。"]],"refs":["criminal","pipl"],"subject":"criminal"},{"id":"刑15","title":"个人信息、网络帮助与知识产权犯罪","priority":"P1","where":"分则相关罪；第253条之一、287条之二、217、219条","question":"爬取数据或生成代码，什么时候会上升到刑事问题？","lecture":"先区分民事侵权、行政违法和犯罪。侵犯公民个人信息罪涉及违反国家有关规定出售、提供或非法获取公民个人信息等法定行为，并要求达到情节严重等条件；不是发生任何数据使用争议就自动入罪。\n\n帮助信息网络犯罪活动罪须明知他人利用信息网络实施犯罪，为其提供法定帮助且情节严重等。单纯开发通用软件不能凭用途可能性直接认定，但明知犯罪而提供帮助也不能以中立工具为借口。具体明知推定与情节标准须结合适用的现行司法解释，口试不猜数量门槛。\n\n知识产权犯罪也有各自目的、行为、情节等要求。未经许可使用作品并不一概构成侵犯著作权罪；技术资料也不一律属于商业秘密，还须非公知性、商业价值及相应保密措施等。专利领域刑事保护范围不能等同一切民事专利侵权。\n\nAI不是责任主体的替身。生成内容是否侵权、数据是否合法、行为人是否承担刑责，须分别依相应构成判断。","lectureHtml":"\u003cp>先区分民事侵权、行政违法和犯罪。侵犯公民个人信息罪涉及违反国家有关规定出售、提供或非法获取公民个人信息等法定行为，并要求达到情节严重等条件；不是发生任何数据使用争议就自动入罪。\u003c/p>\n\u003cp>帮助信息网络犯罪活动罪须明知他人利用信息网络实施犯罪，为其提供法定帮助且情节严重等。单纯开发通用软件不能凭用途可能性直接认定，但明知犯罪而提供帮助也不能以中立工具为借口。具体明知推定与情节标准须结合适用的现行司法解释，口试不猜数量门槛。\u003c/p>\n\u003cp>知识产权犯罪也有各自目的、行为、情节等要求。未经许可使用作品并不一概构成侵犯著作权罪；技术资料也不一律属于商业秘密，还须非公知性、商业价值及相应保密措施等。专利领域刑事保护范围不能等同一切民事专利侵权。\u003c/p>\n\u003cp>AI不是责任主体的替身。生成内容是否侵权、数据是否合法、行为人是否承担刑责，须分别依相应构成判断。\u003c/p>\n","answer":"需要先区分责任层次。数据或代码使用有争议，可能先涉及民事或行政规则；上升到刑事责任必须符合具体罪名，包括法定行为、主观要求和情节门槛。不能因使用爬虫或AI就直接认定犯罪，也不能以技术中立否定明知帮助的责任。","follow":[["任何专利侵权都有刑事责任吗？","不能这样概括，民事侵权范围与刑法规定的相关行为范围不同。"],["你能背出所有入罪数量吗？","不应猜测。先准确说明构成，具体门槛应结合所涉信息类型和现行解释核对。"]],"refs":["criminal","pipl"],"subject":"criminal"},{"id":"刑16","title":"用完整顺序分析一个刑法问题","priority":"P0","where":"刑法全科复盘","question":"给你一个新技术犯罪案例，你怎么分析？","lecture":"完整分析从法定性和适用范围开始，而非立即报罪名。先提出可能涉及的法益和罪名，再核对客观行为、主体资格、主观状态，排除防卫避险等事由，进一步看预备未遂中止、共同犯罪和罪数，最后讨论刑罚。这些节点并非每案都展开，但要知道遗漏了什么。\n\n“先犯罪论后刑罚论”可以帮助防止用“应该严惩”替代定罪分析。程序上还要由证据认定事实，不把模型推断、媒体描述当成已证明事实。刑事诉讼法的证明与程序问题可作为跨科联系，别冒充刑法总则条文。\n\n**示范路径：** AI合成声音冒充家人转账：先判断诈骗构成，核对被害人是否因欺骗处分财产；再看各参与者的故意与帮助、是否得逞及其他犯罪竞合。声音被利用者的人格权问题另按民法分析。\n\n**法谚边界：** “法无明文规定不为罪”要求法定性，不排除合理解释；“法不能向不法让步”表达防卫保护价值，不意味着无条件报复。","lectureHtml":"\u003cp>完整分析从法定性和适用范围开始，而非立即报罪名。先提出可能涉及的法益和罪名，再核对客观行为、主体资格、主观状态，排除防卫避险等事由，进一步看预备未遂中止、共同犯罪和罪数，最后讨论刑罚。这些节点并非每案都展开，但要知道遗漏了什么。\u003c/p>\n\u003cp>“先犯罪论后刑罚论”可以帮助防止用“应该严惩”替代定罪分析。程序上还要由证据认定事实，不把模型推断、媒体描述当成已证明事实。刑事诉讼法的证明与程序问题可作为跨科联系，别冒充刑法总则条文。\u003c/p>\n\u003cp>\u003cstrong>示范路径：\u003c/strong> AI合成声音冒充家人转账：先判断诈骗构成，核对被害人是否因欺骗处分财产；再看各参与者的故意与帮助、是否得逞及其他犯罪竞合。声音被利用者的人格权问题另按民法分析。\u003c/p>\n\u003cp>\u003cstrong>法谚边界：\u003c/strong> “法无明文规定不为罪”要求法定性，不排除合理解释；“法不能向不法让步”表达防卫保护价值，不意味着无条件报复。\u003c/p>\n","answer":"我会先确认可能涉及的法益和罪名，结合总则逐项检查行为、主体、主观状态及其他构成条件，再看有无正当化事由、停止形态、共同犯罪和罪数，最后讨论刑罚。技术改变作案方式，但不能代替法定构成和证据判断。","follow":[["不知道最终罪名时怎么不冷场？","先讲明确的分析节点和待查事实，再提出可能方向；不要为了流畅而给未经支持的肯定罪名。"],["民法与刑法能同时调整吗？","可以，不同法律回答不同责任问题，但须依法协调，不能混淆标准。"]],"refs":["criminal","voice"],"subject":"criminal"}],"introHtml":"\u003cp>\u003cstrong>总则路线：基本原则与适用范围 → 犯罪成立 → 排除犯罪的事由 → 犯罪停止形态 → 共同犯罪与罪数 → 刑罚裁量及执行。\u003c/strong> 分则提供具体罪名和法定刑，总则提供共同判断工具，两者必须结合。\u003c/p>\n\u003cp>常见刑法课程按绪论、犯罪论、刑事责任及刑罚、分则展开。这里先用传统四要件定位知识，再补充阶层化分析思路，不把不同理论体系拼成一个所谓统一公式。被问“属于哪里”时说“刑法总则的犯罪论中，关于故意犯罪停止形态的问题”等，比随意报教材章节号稳妥。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>审查节点\u003c/th>\n\u003cth>先问什么\u003c/th>\n\u003cth>别混淆什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>法定与适用\u003c/td>\n\u003ctd>有无规定，能否适用我国刑法？\u003c/td>\n\u003ctd>道德谴责不等于犯罪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>构成\u003c/td>\n\u003ctd>行为、结果、因果、主体、主观状态怎样？\u003c/td>\n\u003ctd>造成损失不等于主观有罪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正当化\u003c/td>\n\u003ctd>防卫、避险等是否排除违法？\u003c/td>\n\u003ctd>有伤亡不自动排除防卫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>停止形态\u003c/td>\n\u003ctd>预备、着手、既遂，在哪一处停下？\u003c/td>\n\u003ctd>未遂与中止不只看有没有结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多人多罪\u003c/td>\n\u003ctd>是否共同故意，各起何作用？\u003c/td>\n\u003ctd>在场不等于共同犯罪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>刑罚\u003c/td>\n\u003ctd>是否及如何处罚，执行是否调整？\u003c/td>\n\u003ctd>缓刑不是无罪，减刑不是改判无罪\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"id":"constitution","name":"宪法","subtitle":"国家制度、基本权利与国家机构","color":"#475e8b","intro":"宪法是国家根本法，规定国家根本制度和根本任务、公民基本权利义务及国家机构等根本问题，具有最高法律效力。理解时抓两端：**国家权力怎样依法组织运行，人的基本权利怎样得到尊重和保障。** 不能把宪法说成民法刑法内容的简单相加。\n\n现行宪法以1982年宪法为基础，经过1988、1993、1999、2004、2018年五次修正。文本由序言与四章构成：总纲、公民的基本权利和义务、国家机构、国旗国歌国徽首都。学习上的四块是“基本理论—国家制度—基本权利—国家机构”，与文本章名并非完全相同。\n\n| 框架层 | 核心问题 | 易混点 |\n|---|---|---|\n| 根本法 | 为什么效力最高？怎样修改和监督实施？ | 宪法不是所有法律的汇编 |\n| 国家制度 | 谁掌握国家权力？怎样组织政权？ | 国体、政体、国家结构形式不同 |\n| 基本权利 | 公民可主张什么，国家承担什么义务？ | 权利限制要依法，不是公共利益万能 |\n| 国家机构 | 谁立法、行政、监察、审判、检察？ | 最高国家权力机关不是国务院 |","route":"先读宪01—宪05建立权利和制度概念；宪06—宪10重点背机关性质与关系；宪11—宪13处理监督实施和科技场景。","lessons":[{"id":"宪01","title":"宪法的地位、原则与修改","priority":"P0","where":"序言、总纲；第1—5、64条","question":"为什么说宪法是根本法？","lecture":"根本法体现在内容、效力和程序。内容规定国家根本问题，效力上其他法律法规不得与其抵触，制定修改程序通常比普通法律严格。宪法提供普通法的根本依据，普通法把权利和组织要求具体化。\n\n我国宪法规范体现人民主权、人权保障、民主集中制、法治等原则。权力制约可以作为理解国家权力依法运行的理论线索，但不能把我国国家机构描述成西方式三权分立。宪法第3条规定国家机构实行民主集中制；第5条规定依法治国、建设社会主义法治国家等。\n\n第64条修宪程序：全国人大常委会或五分之一以上全国人大代表提议，全国人大以全体代表三分之二以上多数通过。普通法律和其他议案由全国人大以全体代表过半数通过。基数是全体代表，不是到会代表；提议权与通过权也要区分。\n\n**记忆方法：** 根本内容—最高效力—严格程序。不要用“所有法律都写在宪法里面”解释母法关系。","lectureHtml":"\u003cp>根本法体现在内容、效力和程序。内容规定国家根本问题，效力上其他法律法规不得与其抵触，制定修改程序通常比普通法律严格。宪法提供普通法的根本依据，普通法把权利和组织要求具体化。\u003c/p>\n\u003cp>我国宪法规范体现人民主权、人权保障、民主集中制、法治等原则。权力制约可以作为理解国家权力依法运行的理论线索，但不能把我国国家机构描述成西方式三权分立。宪法第3条规定国家机构实行民主集中制；第5条规定依法治国、建设社会主义法治国家等。\u003c/p>\n\u003cp>第64条修宪程序：全国人大常委会或五分之一以上全国人大代表提议，全国人大以全体代表三分之二以上多数通过。普通法律和其他议案由全国人大以全体代表过半数通过。基数是全体代表，不是到会代表；提议权与通过权也要区分。\u003c/p>\n\u003cp>\u003cstrong>记忆方法：\u003c/strong> 根本内容—最高效力—严格程序。不要用“所有法律都写在宪法里面”解释母法关系。\u003c/p>\n","answer":"宪法规定国家根本制度、基本权利和国家机构等根本问题，具有最高法律效力，修改程序也更严格。它为普通法律提供根本依据，但不是把所有具体法律规则汇集在一起。我国修宪还要满足特定提议主体和全体代表三分之二以上通过的要求。","follow":[["全国人大常委会能直接修改宪法吗？","不能代替全国人大完成修宪通过；它有提议权，并承担解释宪法和监督实施等职权。"],["三分之二是出席代表吗？","是全体全国人大代表的三分之二以上。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪02","title":"国体、政体与国家结构形式","priority":"P0","where":"总纲；第1—4、30、31条","question":"人民民主专政与人民代表大会制度有什么不同？","lecture":"国体回答国家权力的阶级属性和归属，我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家；社会主义制度是根本制度，中国共产党领导是中国特色社会主义最本质的特征。政体回答国家政权的组织形式，我国是人民代表大会制度，是根本政治制度。\n\n国家结构形式处理中央和地方关系，我国是统一的多民族国家，实行单一制，不是联邦制。民族自治地方、特别行政区均在统一国家结构中定位，但各自制度根据、自治权限和运行规则不同，不能因为都叫自治就混同。\n\n人民代表大会制度也不是每个问题都由全国人大具体办理，而是通过代表机关以及由其产生、对其负责、受其监督的其他国家机关依法分工。民主集中制要求民主基础上的集中与集中指导下的民主相结合。\n\n**一句串联：** 国体看谁的国家，政体看政权怎样组织，国家结构形式看中央与地方怎样组成一个国家。","lectureHtml":"\u003cp>国体回答国家权力的阶级属性和归属，我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家；社会主义制度是根本制度，中国共产党领导是中国特色社会主义最本质的特征。政体回答国家政权的组织形式，我国是人民代表大会制度，是根本政治制度。\u003c/p>\n\u003cp>国家结构形式处理中央和地方关系，我国是统一的多民族国家，实行单一制，不是联邦制。民族自治地方、特别行政区均在统一国家结构中定位，但各自制度根据、自治权限和运行规则不同，不能因为都叫自治就混同。\u003c/p>\n\u003cp>人民代表大会制度也不是每个问题都由全国人大具体办理，而是通过代表机关以及由其产生、对其负责、受其监督的其他国家机关依法分工。民主集中制要求民主基础上的集中与集中指导下的民主相结合。\u003c/p>\n\u003cp>\u003cstrong>一句串联：\u003c/strong> 国体看谁的国家，政体看政权怎样组织，国家结构形式看中央与地方怎样组成一个国家。\u003c/p>\n","answer":"二者分别涉及国体和政体。人民民主专政说明我国国家性质，人民代表大会制度说明国家政权的组织形式。另外，我国实行单一制，涉及中央与地方关系。这三个概念相互联系，但不能互相替代。","follow":[["社会主义制度和人民代表大会制度都叫根本制度吗？","表述要准确，前者是根本制度，后者是根本政治制度。"],["民族区域自治使我国成为联邦制吗？","不会，民族自治地方仍处于统一的单一制国家结构中。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪03","title":"基本制度：经济、民族、基层自治与政协","priority":"P0","where":"总纲；第6、7、11、111、112条","question":"居民委员会、政协和民族自治机关是同一类组织吗？","lecture":"经济制度重点区分公有制主体地位与国有经济主导作用，不能交换这两个词。非公有制经济是社会主义市场经济的重要组成部分，国家依法保护其合法权益并鼓励、支持、引导其发展。\n\n基本政治制度中，注意中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。政协是中国人民爱国统一战线组织，也是社会主义协商民主的重要渠道和专门协商机构，不是国家机关，不能替代人大立法和监督。\n\n民族自治机关是自治区、自治州、自治县的人民代表大会和人民政府；自治地方的法院、检察院不是宪法意义的自治机关。民族乡也不是民族自治地方。自治权须依法行使，不是脱离统一国家的主权。","lectureHtml":"\u003cp>经济制度重点区分公有制主体地位与国有经济主导作用，不能交换这两个词。非公有制经济是社会主义市场经济的重要组成部分，国家依法保护其合法权益并鼓励、支持、引导其发展。\u003c/p>\n\u003cp>基本政治制度中，注意中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。政协是中国人民爱国统一战线组织，也是社会主义协商民主的重要渠道和专门协商机构，不是国家机关，不能替代人大立法和监督。\u003c/p>\n\u003cp>民族自治机关是自治区、自治州、自治县的人民代表大会和人民政府；自治地方的法院、检察院不是宪法意义的自治机关。民族乡也不是民族自治地方。自治权须依法行使，不是脱离统一国家的主权。\u003c/p>\n","answer":"不同。居委会、村委会是基层群众性自治组织，政协是统一战线组织和协商机构，都不能直接说成一级政府。民族自治机关则是自治区、自治州、自治县的人大和政府，有宪法及法律规定的自治权。","follow":[["自治州法院属于自治机关吗？","不是宪法所指的自治机关，自治机关限于相应人大和政府。"],["公有制主体与国有经济主导一样吗？","不一样，分别描述所有制结构与国有经济在国民经济中的作用，表述不能调换。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪04","title":"基本权利、基本义务与权利保障","priority":"P0","where":"第二章；第33—56条","question":"公民基本权利有哪些？国家只有不干预义务吗？","lecture":"基本权利可按生活领域理解：平等与人权保障；选举等政治权利和言论出版集会等自由；宗教信仰自由；人身自由、人格尊严、住宅与通信保护；劳动、休息、物质帮助、受教育以及文化活动等权利。不要把所有权利压成“自由权”。\n\n国家既要避免不当侵犯，也应依法建立保护制度，使人免受他人侵害、获得必要保障和救济。理论上常称防御功能、保护义务和给付保障等，口试讲清实际含义即可。\n\n劳动和受教育在宪法中兼具权利和义务属性。其他义务包括维护国家统一和民族团结、遵守宪法法律、维护国家安全荣誉利益、依法服兵役和纳税等。但不能说一个人履行义务不充分，就自动丧失所有基本权利。\n\n**AI连接：** 国家机关使用算法处理公共事务，不能只看效率，还要关注是否造成不合理差别、是否有法律依据与纠错渠道。私人平台纠纷通常仍需落到个保法、民法等具体规范。","lectureHtml":"\u003cp>基本权利可按生活领域理解：平等与人权保障；选举等政治权利和言论出版集会等自由；宗教信仰自由；人身自由、人格尊严、住宅与通信保护；劳动、休息、物质帮助、受教育以及文化活动等权利。不要把所有权利压成“自由权”。\u003c/p>\n\u003cp>国家既要避免不当侵犯，也应依法建立保护制度，使人免受他人侵害、获得必要保障和救济。理论上常称防御功能、保护义务和给付保障等，口试讲清实际含义即可。\u003c/p>\n\u003cp>劳动和受教育在宪法中兼具权利和义务属性。其他义务包括维护国家统一和民族团结、遵守宪法法律、维护国家安全荣誉利益、依法服兵役和纳税等。但不能说一个人履行义务不充分，就自动丧失所有基本权利。\u003c/p>\n\u003cp>\u003cstrong>AI连接：\u003c/strong> 国家机关使用算法处理公共事务，不能只看效率，还要关注是否造成不合理差别、是否有法律依据与纠错渠道。私人平台纠纷通常仍需落到个保法、民法等具体规范。\u003c/p>\n","answer":"基本权利覆盖政治参与、人身和人格保护、宗教信仰、社会经济和文化教育等领域。国家不仅应避免不当侵犯，也需要通过法律、组织和程序提供保护。权利与义务相联系，但不能把履行某项义务作为享有一切基本权利的前提。","follow":[["劳动和受教育只是权利吗？","在宪法上兼有权利与义务属性。"],["有基本权利争议就直接按宪法起诉私人平台吗？","具体纠纷应识别适当法律依据和程序，不能照搬其他国家的宪法诉讼模式。"]],"refs":["constitution","pipl"],"subject":"constitution"},{"id":"宪05","title":"权利限制、平等与宗教信仰自由","priority":"P0","where":"第33、36、51条；基本权利理论","question":"为了公共利益，可以任意限制权利吗？","lecture":"第51条规定公民行使自由和权利，不得损害国家、社会、集体利益以及其他公民合法自由和权利。但不能把它当作任何机关任意限制权利的空白授权，限制仍应有依据、符合权限与程序，并有正当目的和合理边界。\n\n比例原则可作为分析工具：措施是否有助于目的，是否存在同样有效而损害更小的替代，负担与收益是否明显失衡。它不是宪法明文列出的万能三步条款，应说明是理论分析方式并结合具体法律。\n\n平等不等于任何差别待遇都禁止。应审查比较对象、差别理由和法律目的，针对弱势群体的必要保护可能有合理根据；基于无关地域、性别等作不合理差别则需警惕。","lectureHtml":"\u003cp>第51条规定公民行使自由和权利，不得损害国家、社会、集体利益以及其他公民合法自由和权利。但不能把它当作任何机关任意限制权利的空白授权，限制仍应有依据、符合权限与程序，并有正当目的和合理边界。\u003c/p>\n\u003cp>比例原则可作为分析工具：措施是否有助于目的，是否存在同样有效而损害更小的替代，负担与收益是否明显失衡。它不是宪法明文列出的万能三步条款，应说明是理论分析方式并结合具体法律。\u003c/p>\n\u003cp>平等不等于任何差别待遇都禁止。应审查比较对象、差别理由和法律目的，针对弱势群体的必要保护可能有合理根据；基于无关地域、性别等作不合理差别则需警惕。\u003c/p>\n","answer":"不能任意限制。公共利益需要具体化，权利限制还应符合法律依据、权限和程序，并审查必要性与合理性。比如算法可以帮助公共管理，但不能因此无限收集信息或取消纠错渠道。宗教信仰自由也同时保护信仰与不信仰的选择。","follow":[["平等是否禁止给残障人士特别便利？","不禁止，合理便利可能是实现实质平等的措施，要看目的和依据。"],["宗教信仰自由只保护信教的人吗？","也保护不信教的选择，不能强制信教或不信教，也不能歧视信教或不信教公民。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪06","title":"国家机构总图与层级","priority":"P0","where":"第三章；第57、85、93、123、128、134条","question":"我国主要国家机关分别做什么？","lecture":"国家机构要同时看横向职能和纵向层级，不能画成所有机关都受政府领导的单线图。\n\n| 机关 | 性质或主要功能 | 纵向关系提示 |\n|---|---|---|\n| 全国人大及其常委会 | 最高国家权力机关及其常设机关，依法立法监督等 | 地方人大是地方国家权力机关 |\n| 国家主席 | 国家元首职权，依法公布法律、进行国事活动等 | 不把它列成政府的一层 |\n| 国务院 | 最高国家权力机关的执行机关、最高国家行政机关 | 统一领导地方各级行政机关工作 |\n| 中央军委 | 领导全国武装力量 | 实行主席负责制 |\n| 监察委员会 | 国家监察机关 | 国家监委领导地方，上级领导下级 |\n| 人民法院 | 国家审判机关 | 上级监督下级审判工作，不是行政领导审判 |\n| 人民检察院 | 国家法律监督机关 | 上级领导下级工作 |\n\n地方政府、监委、法院、检察院依法分别行使行政、监察、审判、检察等职能，与人大有产生、负责和监督关系。党的领导、人大监督和各机关依法履职需要结合理解，不能改写成西方式三权分立，也不能混为一个行政系统。","lectureHtml":"\u003cp>国家机构要同时看横向职能和纵向层级，不能画成所有机关都受政府领导的单线图。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机关\u003c/th>\n\u003cth>性质或主要功能\u003c/th>\n\u003cth>纵向关系提示\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>全国人大及其常委会\u003c/td>\n\u003ctd>最高国家权力机关及其常设机关，依法立法监督等\u003c/td>\n\u003ctd>地方人大是地方国家权力机关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家主席\u003c/td>\n\u003ctd>国家元首职权，依法公布法律、进行国事活动等\u003c/td>\n\u003ctd>不把它列成政府的一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国务院\u003c/td>\n\u003ctd>最高国家权力机关的执行机关、最高国家行政机关\u003c/td>\n\u003ctd>统一领导地方各级行政机关工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中央军委\u003c/td>\n\u003ctd>领导全国武装力量\u003c/td>\n\u003ctd>实行主席负责制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>监察委员会\u003c/td>\n\u003ctd>国家监察机关\u003c/td>\n\u003ctd>国家监委领导地方，上级领导下级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人民法院\u003c/td>\n\u003ctd>国家审判机关\u003c/td>\n\u003ctd>上级监督下级审判工作，不是行政领导审判\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人民检察院\u003c/td>\n\u003ctd>国家法律监督机关\u003c/td>\n\u003ctd>上级领导下级工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>地方政府、监委、法院、检察院依法分别行使行政、监察、审判、检察等职能，与人大有产生、负责和监督关系。党的领导、人大监督和各机关依法履职需要结合理解，不能改写成西方式三权分立，也不能混为一个行政系统。\u003c/p>\n","answer":"我会先按职能区分：人大是国家权力机关，政府是行政机关，监委是监察机关，法院是审判机关，检察院是法律监督机关。再看上下级关系，法院之间主要是审判监督关系，检察院和监委的上下级领导关系则不同，不能都说由政府领导。","follow":[["最高国家权力机关是国务院吗？","不是，是全国人大；国务院是最高国家行政机关。"],["法院和检察院的上下级关系一样吗？","不一样，法院是监督审判工作，检察院是上级领导下级工作。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪07","title":"全国人大、常委会与国家主席","priority":"P0","where":"第三章第一、二节；第62、64、67、80、81条","question":"谁修改宪法，谁解释宪法，谁公布法律？","lecture":"全国人大修改宪法、监督宪法实施，制定修改刑事、民事、国家机构和其他基本法律，并依法决定重大事项、选举或决定有关国家机构人员。常委会解释宪法、监督宪法实施，制定修改除应由全国人大制定以外的其他法律，并有法律解释等职权。\n\n全国人大闭会期间，常委会可以对全国人大制定的法律作部分补充修改，但不得同其基本原则抵触。不能说常委会完全无权接触基本法律，也不能反过来说常委会可以随意替代全国人大。\n\n国家主席根据全国人大及其常委会决定依法公布法律、任免有关人员等，并进行宪法规定的国事活动。公布法律与制定法律不同，不是国家主席个人制定所有法律。\n\n机构知识最好采用“性质—产生—职权—负责监督关系”四格记忆。法律解释与宪法解释、两高司法解释也不能混称。","lectureHtml":"\u003cp>全国人大修改宪法、监督宪法实施，制定修改刑事、民事、国家机构和其他基本法律，并依法决定重大事项、选举或决定有关国家机构人员。常委会解释宪法、监督宪法实施，制定修改除应由全国人大制定以外的其他法律，并有法律解释等职权。\u003c/p>\n\u003cp>全国人大闭会期间，常委会可以对全国人大制定的法律作部分补充修改，但不得同其基本原则抵触。不能说常委会完全无权接触基本法律，也不能反过来说常委会可以随意替代全国人大。\u003c/p>\n\u003cp>国家主席根据全国人大及其常委会决定依法公布法律、任免有关人员等，并进行宪法规定的国事活动。公布法律与制定法律不同，不是国家主席个人制定所有法律。\u003c/p>\n\u003cp>机构知识最好采用“性质—产生—职权—负责监督关系”四格记忆。法律解释与宪法解释、两高司法解释也不能混称。\u003c/p>\n","answer":"全国人大行使修改宪法的职权，全国人大常委会解释宪法并监督实施。法律由有权立法机关依程序通过，再由国家主席依法公布。制定、解释、公布是不同职能；常委会对基本法律的部分补充修改也有不得抵触基本原则等限制。","follow":[["法院作司法解释就是解释宪法吗？","不是，两者主体、对象和权限不同。"],["国家主席公布法律，是否就是立法机关？","不能据此认定，公布是宪法规定的国家主席职权，与立法机关审议通过不同。"]],"refs":["constitution","legislation"],"subject":"constitution"},{"id":"宪08","title":"国务院、地方政府与人大选举","priority":"P0","where":"第三章第三、五节；第85、89、95—99、105条","question":"县级人大代表怎样产生？地方都设人大常委会吗？","lecture":"国务院是中央人民政府，实行总理负责制，依据宪法和法律规定行政措施、制定行政法规，统一领导各部委和地方各级行政机关工作。地方政府既对本级人大负责并报告工作，也依宪法法律对上一级行政机关负责并报告，形成行政系统的统一领导。\n\n地方人大代表选举要抓县乡两级直接选举，设区的市、省等上级层级代表通过下一级人大选举，具体依选举法。选举资格基本是中国公民、年满18周岁、未依法被剥夺政治权利。被羁押不能一概等同被剥夺选举权。\n\n县级以上地方人大设常委会，乡镇人大不设常委会。地方人大不是全国人大的派出机构，而是地方国家权力机关。国家行政区划与人大层级要对应理解，民族乡是乡级行政区域，但不是民族自治地方。\n\n**教学假设：** 乡政府不能因为自己在基层，就创设刑事犯罪；地方立法也必须受宪法法律、权限和程序约束。","lectureHtml":"\u003cp>国务院是中央人民政府，实行总理负责制，依据宪法和法律规定行政措施、制定行政法规，统一领导各部委和地方各级行政机关工作。地方政府既对本级人大负责并报告工作，也依宪法法律对上一级行政机关负责并报告，形成行政系统的统一领导。\u003c/p>\n\u003cp>地方人大代表选举要抓县乡两级直接选举，设区的市、省等上级层级代表通过下一级人大选举，具体依选举法。选举资格基本是中国公民、年满18周岁、未依法被剥夺政治权利。被羁押不能一概等同被剥夺选举权。\u003c/p>\n\u003cp>县级以上地方人大设常委会，乡镇人大不设常委会。地方人大不是全国人大的派出机构，而是地方国家权力机关。国家行政区划与人大层级要对应理解，民族乡是乡级行政区域，但不是民族自治地方。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 乡政府不能因为自己在基层，就创设刑事犯罪；地方立法也必须受宪法法律、权限和程序约束。\u003c/p>\n","answer":"县乡两级人大代表由选民直接选举，上一级相应代表依法律通过间接选举产生。县级以上地方人大设常委会，乡镇人大不设。国务院与地方政府属于行政机关，人大属于权力机关，两种系统的性质不能混淆。","follow":[["被羁押就必然没有选举权吗？","不能一概而论，要依选举资格和相关法律规定判断。"],["乡镇人大有没有常委会？","没有，县级以上地方人大才设常委会。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪09","title":"法院、检察院与监察委员会","priority":"P0","where":"第三章第七、八节；第123—140条","question":"法院、检察院、监委分别是什么机关？","lecture":"法院依法行使审判权，检察院是法律监督机关，监委是国家监察机关。监察主要针对行使公权力的公职人员等依法开展监督、调查、处置；涉嫌职务犯罪案件移送检察机关依法审查起诉，再由法院审判，不能说监委直接判刑。\n\n法院分最高、高级、中级、基层以及专门法院等，四级法院不等于普通案件要走四次审判。通常两审终审，特殊程序另有规定；这是诉讼法层面的进一步展开，不要冒充宪法每条都规定了审级。\n\n宪法规定法院依法独立行使审判权，不受行政机关、社会团体和个人干涉；检察机关依法独立行使检察权也有相应规定。独立依法履职与法定监督不是对立关系，更不是个人任意裁判。\n\n刑事诉讼中，法院、检察院和公安机关分工负责、互相配合、互相制约，以保证准确有效执行法律。公安机关不是人民法院，也不是宪法所称法律监督机关。","lectureHtml":"\u003cp>法院依法行使审判权，检察院是法律监督机关，监委是国家监察机关。监察主要针对行使公权力的公职人员等依法开展监督、调查、处置；涉嫌职务犯罪案件移送检察机关依法审查起诉，再由法院审判，不能说监委直接判刑。\u003c/p>\n\u003cp>法院分最高、高级、中级、基层以及专门法院等，四级法院不等于普通案件要走四次审判。通常两审终审，特殊程序另有规定；这是诉讼法层面的进一步展开，不要冒充宪法每条都规定了审级。\u003c/p>\n\u003cp>宪法规定法院依法独立行使审判权，不受行政机关、社会团体和个人干涉；检察机关依法独立行使检察权也有相应规定。独立依法履职与法定监督不是对立关系，更不是个人任意裁判。\u003c/p>\n\u003cp>刑事诉讼中，法院、检察院和公安机关分工负责、互相配合、互相制约，以保证准确有效执行法律。公安机关不是人民法院，也不是宪法所称法律监督机关。\u003c/p>\n","answer":"法院是审判机关，检察院是法律监督机关，监委是监察机关。它们依法分工，监委不能直接定罪判刑。法院的审判监督关系与检察、监察系统的上下级领导关系不同；依法独立履职也不排除法定监督。","follow":[["四级法院等于四审终审吗？","不是，组织层级与案件审级不同，通常实行两审终审并有法定例外。"],["法律监督机关是哪一个？","人民检察院；不能把政协民主监督、人大监督等都等同这一机关性质。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪10","title":"民族自治地方与特别行政区","priority":"P1","where":"总纲第31条、第三章第六节；第112—122条","question":"民族区域自治与特别行政区制度有什么区别？","lecture":"二者均处于国家统一之下，但不是同一种自治。民族区域自治是在国家统一领导下，在少数民族聚居地方实行区域自治，通过法定自治机关行使自治权；特别行政区制度根据宪法第31条及相关基本法设立并运行。\n\n民族自治机关为自治区、自治州、自治县的人大和政府，自治条例和单行条例的制定、批准及变通范围有法定限制，不能任意变通宪法或基本原则。自治权不是地方主权。\n\n特别行政区享有基本法规定的高度自治权，包括有关行政管理、立法、独立司法和终审等权能，但外交、国防及其他中央权限须按宪法和基本法理解，不能说高度自治等于完全自治。\n\n涉外法治还要区分涉港澳与涉外问题，二者在具体规则中可能有关联或参照安排，但港澳不是外国。两天冲刺先记准确性质和权源，不拓展到复杂基本法解释争论。","lectureHtml":"\u003cp>二者均处于国家统一之下，但不是同一种自治。民族区域自治是在国家统一领导下，在少数民族聚居地方实行区域自治，通过法定自治机关行使自治权；特别行政区制度根据宪法第31条及相关基本法设立并运行。\u003c/p>\n\u003cp>民族自治机关为自治区、自治州、自治县的人大和政府，自治条例和单行条例的制定、批准及变通范围有法定限制，不能任意变通宪法或基本原则。自治权不是地方主权。\u003c/p>\n\u003cp>特别行政区享有基本法规定的高度自治权，包括有关行政管理、立法、独立司法和终审等权能，但外交、国防及其他中央权限须按宪法和基本法理解，不能说高度自治等于完全自治。\u003c/p>\n\u003cp>涉外法治还要区分涉港澳与涉外问题，二者在具体规则中可能有关联或参照安排，但港澳不是外国。两天冲刺先记准确性质和权源，不拓展到复杂基本法解释争论。\u003c/p>\n","answer":"二者的制度依据和自治内容不同。民族区域自治通过法定自治机关在统一国家内行使自治权；特别行政区依宪法和基本法实行高度自治。两者都不意味着独立主权，也不能把港澳当作外国。","follow":[["自治机关能任意修改全国法律吗？","不能，变通须符合法定权限、批准程序和不得突破的边界。"],["高度自治等于完全自治吗？","不是，中央与特区的权限应依宪法及基本法明确区分。"]],"refs":["constitution"],"subject":"constitution"},{"id":"宪11","title":"宪法实施、监督与备案审查","priority":"P0","where":"第5、62、67条；立法法备案审查规定","question":"发现规范性文件与上位法冲突，怎么办？","lecture":"宪法的最高效力需要实施机制支持。全国人大及其常委会依法监督宪法实施，备案审查等制度维护国家法制统一。合宪性审查关注是否符合宪法规定、原则和精神；合法性审查关注是否符合有关法律、权限程序等，两者有联系但不完全相同。\n\n备案审查不是普通民事诉讼中的上诉。符合规定的主体可以提出审查要求或建议，相关机关依法研究处理；不能说任何人可直接向普通法院请求宣布全国法律违宪无效。\n\n宪法和法律委员会、法工委等在工作中有不同职责，不宜统称为独立宪法法院。审查对象与处理机关按现行制度划分，不能把所有政策文件都说成由同一机关同一程序撤销。\n\n**教学假设：** 地方文件对某类居民设定缺乏依据的限制，可以先识别文件性质、制定权限和上位法，再确定行政复议诉讼、备案审查建议等适当途径。不能只说“违反宪法，所以自动不存在”。","lectureHtml":"\u003cp>宪法的最高效力需要实施机制支持。全国人大及其常委会依法监督宪法实施，备案审查等制度维护国家法制统一。合宪性审查关注是否符合宪法规定、原则和精神；合法性审查关注是否符合有关法律、权限程序等，两者有联系但不完全相同。\u003c/p>\n\u003cp>备案审查不是普通民事诉讼中的上诉。符合规定的主体可以提出审查要求或建议，相关机关依法研究处理；不能说任何人可直接向普通法院请求宣布全国法律违宪无效。\u003c/p>\n\u003cp>宪法和法律委员会、法工委等在工作中有不同职责，不宜统称为独立宪法法院。审查对象与处理机关按现行制度划分，不能把所有政策文件都说成由同一机关同一程序撤销。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 地方文件对某类居民设定缺乏依据的限制，可以先识别文件性质、制定权限和上位法，再确定行政复议诉讼、备案审查建议等适当途径。不能只说“违反宪法，所以自动不存在”。\u003c/p>\n","answer":"应先识别文件性质、制定主体及与哪一上位规范冲突，再选择法定审查和救济机制。备案审查是维护法制统一的重要制度，合宪性与合法性审查有联系但不相同。不能把其他国家的宪法诉讼方式直接套到我国。","follow":[["宪法没有普通诉讼那样的程序就没有约束力？","不是，宪法通过立法、机关履职和监督实施等机制发挥最高规范效力。"],["提出审查建议就是提起诉讼吗？","不是，程序性质、处理机关和效力不同。"]],"refs":["constitution","legislation"],"subject":"constitution"},{"id":"宪12","title":"AI进入公共决策与司法","priority":"P0","where":"基本权利、国家机构；最高法法发〔2022〕33号","question":"AI能否代替法官作出裁判？","lecture":"先明确国家权力由有权机关依法行使，技术工具不能因为速度快就取得审判权。AI可以辅助检索、整理证据材料、提示类案和工作流程，但事实认定、规则解释和利益评价必须依法由审判人员完成并承担责任。\n\n最高法《关于规范和加强人工智能司法应用的意见》强调辅助审判、透明可信等原则。它是相关司法应用指导文件，不能称为全国人大制定的“人工智能法”，也不是对一切AI民商事争议的完整实体规范。\n\n公共部门采用算法，需要关注数据合法性、偏差、理由说明、人工复核和救济。技术准确率是重要信息，但不能独自决定一个措施是否正当。把模型输出作为理由，还应能核验事实与法律依据。","lectureHtml":"\u003cp>先明确国家权力由有权机关依法行使，技术工具不能因为速度快就取得审判权。AI可以辅助检索、整理证据材料、提示类案和工作流程，但事实认定、规则解释和利益评价必须依法由审判人员完成并承担责任。\u003c/p>\n\u003cp>最高法《关于规范和加强人工智能司法应用的意见》强调辅助审判、透明可信等原则。它是相关司法应用指导文件，不能称为全国人大制定的“人工智能法”，也不是对一切AI民商事争议的完整实体规范。\u003c/p>\n\u003cp>公共部门采用算法，需要关注数据合法性、偏差、理由说明、人工复核和救济。技术准确率是重要信息，但不能独自决定一个措施是否正当。把模型输出作为理由，还应能核验事实与法律依据。\u003c/p>\n","answer":"我认为AI适合辅助检索、材料整理和风险提示，但不能替代法官依法作出并负责的裁判。最高法关于规范和加强人工智能司法应用的意见也强调辅助审判等原则。应重点保证数据、可核验的依据、人工复核和救济，而不只追求速度。","follow":[["AI比人准确也不能简单替代吗？","准确率不能涵盖事实争议、程序参与、解释和责任问题，应明确法定权力与责任归属。"],["这个意见是什么性质？","最高法发布的司法应用相关指导文件，不能冒充全国人大法律或直接称为司法解释。"]],"refs":["constitution","judicialAI"],"subject":"constitution"},{"id":"宪13","title":"一分钟全科复盘与记忆锚点","priority":"P0","where":"宪法全科复盘","question":"请概括宪法的体系及你最关注的问题。","lecture":"把宪法压缩为三个问题：国家是什么样的国家，公民享有什么基本权利，国家机关怎样产生和依法运行。基本理论解释为什么这些规范具有最高效力、怎样监督实施。四块框架比只背“最高法”更能接追问。\n\n优先条号锚点：第1条国家性质与根本制度，第2条一切权力属于人民，第3条民主集中制，第5条法治，第33条公民与人权保障，第36条宗教信仰自由，第64条修宪，第85条国务院性质，第128条法院，第134条检察院。条号不用一口气背出，确实记得再引用。\n\n与民法连接：宪法提供人格尊严、人权等基础价值，民法和个保法具体安排主体间的权利义务。与法理连接：权力有依据、程序有保障、救济有效。与历史连接：近代宪法性文件体现国家组织和权利观念的变化，但不能倒用今天制度评价一切细节。","lectureHtml":"\u003cp>把宪法压缩为三个问题：国家是什么样的国家，公民享有什么基本权利，国家机关怎样产生和依法运行。基本理论解释为什么这些规范具有最高效力、怎样监督实施。四块框架比只背“最高法”更能接追问。\u003c/p>\n\u003cp>优先条号锚点：第1条国家性质与根本制度，第2条一切权力属于人民，第3条民主集中制，第5条法治，第33条公民与人权保障，第36条宗教信仰自由，第64条修宪，第85条国务院性质，第128条法院，第134条检察院。条号不用一口气背出，确实记得再引用。\u003c/p>\n\u003cp>与民法连接：宪法提供人格尊严、人权等基础价值，民法和个保法具体安排主体间的权利义务。与法理连接：权力有依据、程序有保障、救济有效。与历史连接：近代宪法性文件体现国家组织和权利观念的变化，但不能倒用今天制度评价一切细节。\u003c/p>\n","answer":"宪法是规定国家根本制度、基本权利义务和国家机构的根本法。我会按基本理论、国家制度、基本权利和国家机构四块学习。在技术场景中，可以关注公共部门和司法使用AI时如何确保权力有依据、决定能解释、权利有救济，并落到具体法律和程序。","follow":[["老师只问国家机关，你还要背权利吗？","先回答所问机关的性质、职权和关系，框架是导航，不是强制背诵顺序。"],["最高法与最高法律效力是一个意思吗？","不是，最高法通常指最高人民法院，宪法具有最高法律效力，口头表述应避免简称混淆。"]],"refs":["constitution","judicialAI"],"subject":"constitution"}],"introHtml":"\u003cp>宪法是国家根本法，规定国家根本制度和根本任务、公民基本权利义务及国家机构等根本问题，具有最高法律效力。理解时抓两端：\u003cstrong>国家权力怎样依法组织运行，人的基本权利怎样得到尊重和保障。\u003c/strong> 不能把宪法说成民法刑法内容的简单相加。\u003c/p>\n\u003cp>现行宪法以1982年宪法为基础，经过1988、1993、1999、2004、2018年五次修正。文本由序言与四章构成：总纲、公民的基本权利和义务、国家机构、国旗国歌国徽首都。学习上的四块是“基本理论—国家制度—基本权利—国家机构”，与文本章名并非完全相同。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>框架层\u003c/th>\n\u003cth>核心问题\u003c/th>\n\u003cth>易混点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>根本法\u003c/td>\n\u003ctd>为什么效力最高？怎样修改和监督实施？\u003c/td>\n\u003ctd>宪法不是所有法律的汇编\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家制度\u003c/td>\n\u003ctd>谁掌握国家权力？怎样组织政权？\u003c/td>\n\u003ctd>国体、政体、国家结构形式不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>基本权利\u003c/td>\n\u003ctd>公民可主张什么，国家承担什么义务？\u003c/td>\n\u003ctd>权利限制要依法，不是公共利益万能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家机构\u003c/td>\n\u003ctd>谁立法、行政、监察、审判、检察？\u003c/td>\n\u003ctd>最高国家权力机关不是国务院\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"id":"theory","name":"法理学","subtitle":"解释法律共同原理与思考方法","color":"#85613f","intro":"法理学研究法律的一般概念、原理、价值和方法，不是又一部“法理法”。民法问合同如何生效，刑法问什么行为犯罪，法理学继续追问：为什么国家承认这种规范，规则和原则如何适用，法律怎样协调自由、秩序、公平与效率？\n\n| 层次 | 核心词 | 典型问题 |\n|---|---|---|\n| 法是什么 | 本质、特征、作用、价值 | 法与道德一样吗？ |\n| 法怎样组成 | 规则、原则、概念、渊源、体系 | 规范冲突怎么办？ |\n| 法怎样运行 | 立法、执法、司法、守法、监督 | 有法为什么还要程序？ |\n| 法怎样说理 | 解释、推理、论证、证据 | 法官是不是机械套法条？ |\n| 法治怎样实现 | 权力约束、权利保障、良法善治 | AI提高效率是否就更公正？ |\n\n技术背景是切入口，但不要把法律降格为程序代码：输入事实常有争议，规则需要解释，价值也可能冲突，法律结论必须能向人说明。","route":"理01—理05先搭静态框架；理06—理09学习运行与方法；理10—理13练价值冲突、法治与技术开放题。","lessons":[{"id":"理01","title":"法的概念、本质与特征","priority":"P0","where":"法理学：法的本体论","question":"法律只是解决纠纷的工具吗？","lecture":"工具说只描述一部分作用，不能代替法的概念与本质。法通常指由国家制定或认可、依靠国家强制力保障实施、以权利义务为重要内容、调整社会关系的行为规范体系。规范性意味着面对一类行为和主体，不等于每条规范必须写成完全相同句式。\n\n从马克思主义法学理解法的本质，法体现统治阶级意志，其内容最终受一定物质生活条件制约，同时具有社会性。我国社会主义法反映党的主张和人民意志的统一。回答本质题时要给出这一理论定位，再谈具体功能。\n\n国家强制保障不等于每次守法都靠警察强制。多数人通过认同、习惯和利益预期遵守法律，强制是制度保障而非全部运行方式。法的程序性和权利义务结构，使法律不同于一般技术建议或纯粹道德劝告。\n\n**词义提醒：** 广义“法律”可泛指法律规范，狭义指全国人大及其常委会制定的法律。谈效力位阶时应使用狭义口径，不把部门规章叫作全国人大法律。","lectureHtml":"\u003cp>工具说只描述一部分作用，不能代替法的概念与本质。法通常指由国家制定或认可、依靠国家强制力保障实施、以权利义务为重要内容、调整社会关系的行为规范体系。规范性意味着面对一类行为和主体，不等于每条规范必须写成完全相同句式。\u003c/p>\n\u003cp>从马克思主义法学理解法的本质，法体现统治阶级意志，其内容最终受一定物质生活条件制约，同时具有社会性。我国社会主义法反映党的主张和人民意志的统一。回答本质题时要给出这一理论定位，再谈具体功能。\u003c/p>\n\u003cp>国家强制保障不等于每次守法都靠警察强制。多数人通过认同、习惯和利益预期遵守法律，强制是制度保障而非全部运行方式。法的程序性和权利义务结构，使法律不同于一般技术建议或纯粹道德劝告。\u003c/p>\n\u003cp>\u003cstrong>词义提醒：\u003c/strong> 广义“法律”可泛指法律规范，狭义指全国人大及其常委会制定的法律。谈效力位阶时应使用狭义口径，不把部门规章叫作全国人大法律。\u003c/p>\n","answer":"法律不只是纠纷处理工具，它还是由国家制定或认可并保障实施的规范体系，组织社会关系、配置权利义务。理论上还需从一定物质生活条件和国家意志理解其本质。强制保障很重要，但不代表每次法律实施都依赖实际强制。","follow":[["道德也要求人守信，为什么还需要法？","形成方式、保障机制、程序和责任结构不同，法律可以给出可实施的权利义务与救济。"],["人工智能标识办法就属于狭义法律吗？","不能这样说，需按发布机关和文件性质区分，不能统称全国人大法律。"]],"refs":["constitution","curriculum"],"subject":"theory"},{"id":"理02","title":"法的作用、价值与局限","priority":"P0","where":"法理学：法的作用与价值","question":"法律能解决所有社会问题吗？","lecture":"法的规范作用可记指引、评价、预测、教育、强制。指引帮助自己选择行为，评价判断他人行为是否合法，预测帮助预期他人和国家机关的反应，教育通过规范与实践影响社会，强制为违反规范设置制度后果。社会作用则涉及维护秩序、组织公共事务、保护权益等更宏观层面。\n\n法的价值包括秩序、安全、自由、平等、公平正义、人权、效率等。价值不是永远无冲突：公开裁判有助监督，却可能影响隐私；自动处理提高效率，却可能削弱当事人参与和纠错。需要具体比较，不是永远把一个词放最高。\n\n法律具有局限：语言有开放性，未来事实难以完全预见，规则存在滞后，实施依赖证据、资源和组织条件。承认局限不是说法律无用，而是需要解释、修法、监督以及道德和技术措施协同。","lectureHtml":"\u003cp>法的规范作用可记指引、评价、预测、教育、强制。指引帮助自己选择行为，评价判断他人行为是否合法，预测帮助预期他人和国家机关的反应，教育通过规范与实践影响社会，强制为违反规范设置制度后果。社会作用则涉及维护秩序、组织公共事务、保护权益等更宏观层面。\u003c/p>\n\u003cp>法的价值包括秩序、安全、自由、平等、公平正义、人权、效率等。价值不是永远无冲突：公开裁判有助监督，却可能影响隐私；自动处理提高效率，却可能削弱当事人参与和纠错。需要具体比较，不是永远把一个词放最高。\u003c/p>\n\u003cp>法律具有局限：语言有开放性，未来事实难以完全预见，规则存在滞后，实施依赖证据、资源和组织条件。承认局限不是说法律无用，而是需要解释、修法、监督以及道德和技术措施协同。\u003c/p>\n","answer":"不能。法律能指引、评价、预测和约束行为，也能组织社会秩序、保护权利，但有语言、信息和实施条件的局限。面对AI新问题，应先解释和适用现有规则，识别真正缺口，再考虑完善，而不应笼统认为新技术意味着无法可依。","follow":[["效率和公平冲突时一定牺牲效率吗？","不必作绝对排序，要说明场景、权益重要性和是否存在兼顾方案，并守住法定底线。"],["法律滞后就先不用法律？","不是，仍应在现行框架内解释适用，不能让技术领域成为无规则空间。"]],"refs":["curriculum","pipl"],"subject":"theory"},{"id":"理03","title":"规则、原则、概念与条文","priority":"P0","where":"法理学：法的要素","question":"法律原则可以代替具体规则吗？","lecture":"法律概念帮助识别对象，例如未成年人、合同、过错；规则给出条件、行为要求和法律后果；原则提供较抽象的价值方向。规范的逻辑结构常概括为假定条件、行为模式、法律后果，但不要求一个条文把三者全部写齐。\n\n法律条文是文字载体，法律规范是从文本等材料中识别的规范内容。一条规范可能需要几个条文组合，一条条文也可能包含多个规范。这个区别类似于不能把一行代码等同整个业务规则，但法律解释还有独立价值判断。\n\n规则较具体、确定，原则较抽象并可存在权衡。通常能用明确规则解决时先适用规则；原则可以解释、补充，但不能以“我觉得公平”绕开立法决定。使用原则需要说明适用条件、价值关系和理由。\n\n**教学假设：** 合同已经明确合法地分配商业风险，一方事后亏损，不能只喊公平就当然改合同。若符合情势变更，才按该具体制度展开。","lectureHtml":"\u003cp>法律概念帮助识别对象，例如未成年人、合同、过错；规则给出条件、行为要求和法律后果；原则提供较抽象的价值方向。规范的逻辑结构常概括为假定条件、行为模式、法律后果，但不要求一个条文把三者全部写齐。\u003c/p>\n\u003cp>法律条文是文字载体，法律规范是从文本等材料中识别的规范内容。一条规范可能需要几个条文组合，一条条文也可能包含多个规范。这个区别类似于不能把一行代码等同整个业务规则，但法律解释还有独立价值判断。\u003c/p>\n\u003cp>规则较具体、确定，原则较抽象并可存在权衡。通常能用明确规则解决时先适用规则；原则可以解释、补充，但不能以“我觉得公平”绕开立法决定。使用原则需要说明适用条件、价值关系和理由。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 合同已经明确合法地分配商业风险，一方事后亏损，不能只喊公平就当然改合同。若符合情势变更，才按该具体制度展开。\u003c/p>\n","answer":"不能随意代替。规则更具体，原则为解释和价值判断提供方向。应优先查找可以适用的明确规则，原则的补充适用要有充分论证。法律条文也不等于法律规范，一项规则可能需要结合多个条文才能完整理解。","follow":[["法律规则的三要素必须写在同一句吗？","不必，逻辑结构与条文呈现形式不同。"],["公平原则与合同风险分配冲突怎么讲？","先查具体效力、情势变更等规则，不能凭抽象公平任意改写合同。"]],"refs":["curriculum","civil2"],"subject":"theory"},{"id":"理04","title":"渊源、位阶与规范冲突","priority":"P0","where":"法理学：法律渊源与效力；立法法第98—106条","question":"新法、特别法和上位法冲突时怎么判断？","lecture":"法律渊源问法以什么形式存在，效力位阶问不同规范之间怎样相互约束。宪法效力最高，法律高于行政法规、地方性法规和规章；行政法规高于地方性法规、规章；地方性法规与本级和下级地方政府规章有相应效力关系。但不是所有规范都能画进一条上下线，部门规章与地方性法规冲突有特定处理机制。\n\n同一机关制定的规范，特别规定与一般规定、新规定与旧规定之间有适用规则。新的一般规定与旧的特别规定不一致、不能确定如何适用时，应依立法法由有权机关裁决，不能只说“新法永远优先”。授权变通、自治条例等还存在依法批准和边界要求。\n\n法院指导性案例、典型案例、个案裁判与制定法地位不同。指导性案例按相应制度参照，不能把任何网上案例都说成普遍强制适用的法律条文。法律解释、司法解释、行政文件也必须分辨主体权限。\n\n**AI连接：** 能准确说出民法典、个保法、生成式AI暂行办法和最高法意见的不同性质，比报出很多名称却说不清层级更有价值。","lectureHtml":"\u003cp>法律渊源问法以什么形式存在，效力位阶问不同规范之间怎样相互约束。宪法效力最高，法律高于行政法规、地方性法规和规章；行政法规高于地方性法规、规章；地方性法规与本级和下级地方政府规章有相应效力关系。但不是所有规范都能画进一条上下线，部门规章与地方性法规冲突有特定处理机制。\u003c/p>\n\u003cp>同一机关制定的规范，特别规定与一般规定、新规定与旧规定之间有适用规则。新的一般规定与旧的特别规定不一致、不能确定如何适用时，应依立法法由有权机关裁决，不能只说“新法永远优先”。授权变通、自治条例等还存在依法批准和边界要求。\u003c/p>\n\u003cp>法院指导性案例、典型案例、个案裁判与制定法地位不同。指导性案例按相应制度参照，不能把任何网上案例都说成普遍强制适用的法律条文。法律解释、司法解释、行政文件也必须分辨主体权限。\u003c/p>\n\u003cp>\u003cstrong>AI连接：\u003c/strong> 能准确说出民法典、个保法、生成式AI暂行办法和最高法意见的不同性质，比报出很多名称却说不清层级更有价值。\u003c/p>\n","answer":"先看制定主体、规范层级和适用范围，再判断上位法、特别规定、新旧规定等关系。特别法优先和新法优先有条件，不能处理所有冲突；新的一般规定与旧的特别规定冲突时，可能需要有权机关依法裁决。","follow":[["地方性法规一定低于所有部门规章吗？","不能简单这样排序，冲突有立法法规定的处理机制。"],["最高法典型案例等于司法解释吗？","不等于，性质和适用方式不同，应准确说明案例的指导或参考作用。"]],"refs":["legislation","curriculum"],"subject":"theory"},{"id":"理05","title":"法律部门、体系、法系与公私法","priority":"P0","where":"法理学：部门划分和法律体系","question":"数据法、AI法是不是现成的独立部门法？","lecture":"法律部门通常根据调整对象及调整方法等划分，法律体系是一国现行法律规范有机联系的整体；法系则是比较不同国家法律历史传统和制度特征的分类，例如大陆法系、普通法系。法律体系不是法系，普通法系也有大量成文法。\n\n公法传统上侧重公共权力和公共利益关系，私法侧重平等主体私人关系，现代法律存在交织。民法通常属私法，刑法通常属公法；知识产权以私权保护为核心，同时有行政管理与刑事保护。不要对每门法都笼统回答公私并存，先给核心定位再解释交叉。\n\nAI法、健康法、数据法可以是问题导向的研究领域，跨越民法、行政法、刑法、国际法等，不能看到一个领域名称就断定已有统一法典或公认独立部门。科技问题往往需要按关系拆解。","lectureHtml":"\u003cp>法律部门通常根据调整对象及调整方法等划分，法律体系是一国现行法律规范有机联系的整体；法系则是比较不同国家法律历史传统和制度特征的分类，例如大陆法系、普通法系。法律体系不是法系，普通法系也有大量成文法。\u003c/p>\n\u003cp>公法传统上侧重公共权力和公共利益关系，私法侧重平等主体私人关系，现代法律存在交织。民法通常属私法，刑法通常属公法；知识产权以私权保护为核心，同时有行政管理与刑事保护。不要对每门法都笼统回答公私并存，先给核心定位再解释交叉。\u003c/p>\n\u003cp>AI法、健康法、数据法可以是问题导向的研究领域，跨越民法、行政法、刑法、国际法等，不能看到一个领域名称就断定已有统一法典或公认独立部门。科技问题往往需要按关系拆解。\u003c/p>\n","answer":"这些名称常指跨部门研究领域，不能直接断定已有独立部门法。比如AI涉及合同、人格权益、行政监管和犯罪规制等。法律部门看调整对象和方法，法律体系是一国内部规范整体，法系是跨国比较分类，这几个概念要分开。","follow":[["知识产权为什么不是只回答公法？","它通常以民事私权为核心，行政授权保护和刑事规制并不消除这一核心定位。"],["普通法国家没有成文法吗？","不是，法系是传统与制度特征分类，不能用有没有任何成文法作绝对区分。"]],"refs":["curriculum","legislation"],"subject":"theory"},{"id":"理06","title":"法律关系、责任与制裁","priority":"P1","where":"法理学：法律关系和法律责任","question":"法律责任和法律制裁一样吗？","lecture":"法律关系是在法律规范调整下形成的权利义务关系，有主体、客体、内容。引起其变化的法律事实可以是行为或事件。民法中的分析工具在法理层面可以推广，但行政和刑事关系中的权力、义务和程序有自己的结构。\n\n法律责任通常指违反法定义务、约定义务或依法应承担的不利后果；法律制裁是国家机关依法采取的相应不利措施，二者并非一一对应。违约后主动赔偿可以实现责任，不一定先经历国家强制制裁；承担法律责任也不都意味着犯罪。\n\n归责须考虑责任法定、公正、相适应等要求，不同部门的过错、因果和免责规则不同。不能把民事无过错责任搬到刑法，认定没有主观罪过也可因结果严重判刑。\n\n权利、义务与权力要分辨：公民的权利保护个人利益与自由，国家机关的权力来源于法定授权并伴随职责。公权力不能像私人财产一样随意处分。","lectureHtml":"\u003cp>法律关系是在法律规范调整下形成的权利义务关系，有主体、客体、内容。引起其变化的法律事实可以是行为或事件。民法中的分析工具在法理层面可以推广，但行政和刑事关系中的权力、义务和程序有自己的结构。\u003c/p>\n\u003cp>法律责任通常指违反法定义务、约定义务或依法应承担的不利后果；法律制裁是国家机关依法采取的相应不利措施，二者并非一一对应。违约后主动赔偿可以实现责任，不一定先经历国家强制制裁；承担法律责任也不都意味着犯罪。\u003c/p>\n\u003cp>归责须考虑责任法定、公正、相适应等要求，不同部门的过错、因果和免责规则不同。不能把民事无过错责任搬到刑法，认定没有主观罪过也可因结果严重判刑。\u003c/p>\n\u003cp>权利、义务与权力要分辨：公民的权利保护个人利益与自由，国家机关的权力来源于法定授权并伴随职责。公权力不能像私人财产一样随意处分。\u003c/p>\n","answer":"不完全一样。责任是依法应承担的后果，制裁是国家机关采取的相应措施，责任可以通过主动履行等方式实现。不同部门法的责任条件不同，例如民事无过错责任不能直接移用于刑事定罪。","follow":[["主动赔偿还算承担责任吗？","可以，法律责任不一定都通过强制制裁实现。"],["国家权力和个人权利有何关键区别？","权力以法定权限和公共职责为基础，个人权利强调依法保护的利益和自由，不能混为私人任意支配。"]],"refs":["curriculum","criminal"],"subject":"theory"},{"id":"理07","title":"立法、执法、司法、守法与监督","priority":"P0","where":"法理学：动态的法","question":"有了完善法律，就自然实现法治了吗？","lecture":"法的运行不是立法后自动结束。立法确定规范，执法依法实施公共管理，司法依法处理案件，守法包括履行义务及依法行使权利，监督检查各环节是否合法适当。这些环节共同决定法律实效。\n\n科学立法重视问题、经验与制度可行性；民主立法重视参与、意见和利益表达；依法立法要求权限程序及法制统一。执法强调依法行政、合理裁量和程序，司法强调事实证据、法律适用、公正程序与说理。不能把守法缩成绝不提出异议，依法申诉维权也属于法治生活。\n\n法律效果与社会效果要在依法处理的基础上统筹，不能为平息舆论任意违背明确规则。程序和理由使人能够理解、监督并挑战决定。\n\n**教学假设：** 推出AI标识规范之后，还要有技术实现、平台执行、用户知情、投诉和监管机制，才可能转化为实际保护；纸上有规则不足以说明治理已经完成。","lectureHtml":"\u003cp>法的运行不是立法后自动结束。立法确定规范，执法依法实施公共管理，司法依法处理案件，守法包括履行义务及依法行使权利，监督检查各环节是否合法适当。这些环节共同决定法律实效。\u003c/p>\n\u003cp>科学立法重视问题、经验与制度可行性；民主立法重视参与、意见和利益表达；依法立法要求权限程序及法制统一。执法强调依法行政、合理裁量和程序，司法强调事实证据、法律适用、公正程序与说理。不能把守法缩成绝不提出异议，依法申诉维权也属于法治生活。\u003c/p>\n\u003cp>法律效果与社会效果要在依法处理的基础上统筹，不能为平息舆论任意违背明确规则。程序和理由使人能够理解、监督并挑战决定。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 推出AI标识规范之后，还要有技术实现、平台执行、用户知情、投诉和监管机制，才可能转化为实际保护；纸上有规则不足以说明治理已经完成。\u003c/p>\n","answer":"不能。法律还要通过执法、司法、守法和监督有效实施。制度是否可执行、程序是否公正、权利有没有实际救济都很重要。以AI标识为例，规则制定后还需要技术落实、平台执行和纠错机制，才能实现其目的。","follow":[["守法就是只履行义务不维权吗？","不是，依法行使权利和寻求救济也是法治生活的重要部分。"],["为了社会效果可以不按法条吗？","不能任意绕过法律，应通过合法解释、程序和制度安排协调效果。"]],"refs":["curriculum","labels"],"subject":"theory"},{"id":"理08","title":"法律解释、推理与论证","priority":"P0","where":"法理学：法律方法","question":"法律适用是不是把事实输入规则就得到答案？","lecture":"最基本的演绎模型是规范作为大前提、案件事实作为小前提、得出结论。但难点常在前提：哪个规范适用、词语如何解释、事实是否被证据证明、不同利益怎样协调。因此法律适用不是简单模式匹配。\n\n文义解释看语言可能含义；体系解释把条文放在同一法律与相关制度中理解；历史解释参考立法背景材料；目的解释考察制度所要保护的利益与目标。方法需要协调，不是为了先有的结论随意挑工具。\n\n法律推理还涉及归纳、类比等，但领域边界不同。民法填补漏洞与刑法入罪不能采用完全相同尺度，刑法禁止不利于行为人的类推入罪。解释不得突破应有权限和法定性要求。\n\nAI生成法律回答最常见风险是伪造条文、误用已失效规则、忽略事实差异。可靠应用应先核查法源和版本，再判断事实对应，最终给出可检验理由。","lectureHtml":"\u003cp>最基本的演绎模型是规范作为大前提、案件事实作为小前提、得出结论。但难点常在前提：哪个规范适用、词语如何解释、事实是否被证据证明、不同利益怎样协调。因此法律适用不是简单模式匹配。\u003c/p>\n\u003cp>文义解释看语言可能含义；体系解释把条文放在同一法律与相关制度中理解；历史解释参考立法背景材料；目的解释考察制度所要保护的利益与目标。方法需要协调，不是为了先有的结论随意挑工具。\u003c/p>\n\u003cp>法律推理还涉及归纳、类比等，但领域边界不同。民法填补漏洞与刑法入罪不能采用完全相同尺度，刑法禁止不利于行为人的类推入罪。解释不得突破应有权限和法定性要求。\u003c/p>\n\u003cp>AI生成法律回答最常见风险是伪造条文、误用已失效规则、忽略事实差异。可靠应用应先核查法源和版本，再判断事实对应，最终给出可检验理由。\u003c/p>\n","answer":"不能简单理解为自动代入。法律推理虽可用规范、事实、结论的结构，但规则选择、解释和事实认定都需要论证。文义、体系、历史和目的解释可以相互帮助，同时受到领域边界约束，刑法不能借解释进行不利类推。","follow":[["目的合理就能超出条文含义吗？","不能无限超出，尤其入罪必须受罪刑法定约束。"],["AI编造条文为什么特别危险？","它会让结论失去真实规范前提，流畅表述不能替代可核验法源。"]],"refs":["curriculum","criminal","judicialAI"],"subject":"theory"},{"id":"理09","title":"实体正义、程序正义与证据","priority":"P0","where":"法理学：法的价值与司法方法","question":"结果正确，程序有点问题可以忽略吗？","lecture":"实体正义关注结果与权利义务分配，程序正义关注决定如何形成，例如通知、陈述申辩、回避、说明理由和救济。程序既有减少错误的工具价值，也体现尊重参与者、避免权力任意的独立价值。\n\n所谓结果正确也需要通过程序和证据证明，不能只凭决定者自信。违法取证、未经听取意见等问题，在不同法律中有不同后果，不是任何程序小瑕疵都导致结论无效，也不是结果看似合理便全部忽略。\n\n**教学假设：** 模型自动拒绝理赔，但不给当事人说明依据或补充材料机会。即使总体准确率高，个体错误仍可能无法纠正。更合理的做法可能包括告知关键理由、人工复核和申诉渠道，这是规范建议，具体义务还要查适用法律。\n\n“任何人不得做自己案件的法官”可帮助理解回避与中立，但实际回避主体、事由和程序仍以法律为准，不能仅靠法谚处理所有利益冲突。","lectureHtml":"\u003cp>实体正义关注结果与权利义务分配，程序正义关注决定如何形成，例如通知、陈述申辩、回避、说明理由和救济。程序既有减少错误的工具价值，也体现尊重参与者、避免权力任意的独立价值。\u003c/p>\n\u003cp>所谓结果正确也需要通过程序和证据证明，不能只凭决定者自信。违法取证、未经听取意见等问题，在不同法律中有不同后果，不是任何程序小瑕疵都导致结论无效，也不是结果看似合理便全部忽略。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 模型自动拒绝理赔，但不给当事人说明依据或补充材料机会。即使总体准确率高，个体错误仍可能无法纠正。更合理的做法可能包括告知关键理由、人工复核和申诉渠道，这是规范建议，具体义务还要查适用法律。\u003c/p>\n\u003cp>“任何人不得做自己案件的法官”可帮助理解回避与中立，但实际回避主体、事由和程序仍以法律为准，不能仅靠法谚处理所有利益冲突。\u003c/p>\n","answer":"不能笼统忽略。程序不仅帮助发现事实、减少错误，也保障参与和尊严。具体瑕疵后果要依法律判断，但不能因为决定者相信结果正确，就剥夺陈述、回避或救济机会。AI决定尤其需要让人能够理解并纠错。","follow":[["是不是程序越复杂越公正？","不是，应有必要保障并兼顾效率，复杂本身不是正义。"],["你能用一句法谚说明吗？","任何人不得做自己案件的法官，可说明中立与回避价值，但需接具体法定条件。"]],"refs":["curriculum","pipl"],"subject":"theory"},{"id":"理10","title":"法与道德、法治与法制","priority":"P0","where":"法理学：法与社会、法治理论","question":"法律和道德是什么关系？","lecture":"法与道德在维护秩序、评价行为和价值导向上有联系，法律也可能吸收诚实信用、公序良俗等伦理要求。但两者形成方式、保障机制、评价标准和调整范围不同。道德可以评价动机及更广泛的交往，法律责任必须有相应规范依据。\n\n不能说一切不道德行为都违法，也不能说合法就一定道德上毫无问题。以道德为名随意惩罚，可能损害法的确定性；完全忽略伦理，又可能使法律失去社会基础。需要在法定边界内协调。\n\n法制偏重法律制度及其运行形态；法治更强调依法治理、权力约束、权利保障和良法善治。拥有大量法律并不自动实现法治。常说“法无授权不可为、法定职责必须为”主要提示公权力边界，私人自治则要在法律许可范围内理解，不能把两者调换。","lectureHtml":"\u003cp>法与道德在维护秩序、评价行为和价值导向上有联系，法律也可能吸收诚实信用、公序良俗等伦理要求。但两者形成方式、保障机制、评价标准和调整范围不同。道德可以评价动机及更广泛的交往，法律责任必须有相应规范依据。\u003c/p>\n\u003cp>不能说一切不道德行为都违法，也不能说合法就一定道德上毫无问题。以道德为名随意惩罚，可能损害法的确定性；完全忽略伦理，又可能使法律失去社会基础。需要在法定边界内协调。\u003c/p>\n\u003cp>法制偏重法律制度及其运行形态；法治更强调依法治理、权力约束、权利保障和良法善治。拥有大量法律并不自动实现法治。常说“法无授权不可为、法定职责必须为”主要提示公权力边界，私人自治则要在法律许可范围内理解，不能把两者调换。\u003c/p>\n","answer":"法与道德有联系但不能等同。法律可以吸收诚信等道德要求，但责任认定仍须依具体规则，不能把所有不道德行为都直接判为违法。法治也不只是有法律文本，还包括权力依法运行、权利保障和有效救济。","follow":[["合法就一定道德上正确吗？","不一定，法律与道德的评价范围和标准并非完全重合。"],["法无授权不可为适合直接要求普通个人吗？","主要用于公权力边界，不能将行政授权思维机械套入私人自治。"]],"refs":["curriculum","constitution"],"subject":"theory"},{"id":"理11","title":"全面依法治国与最新理论表述","priority":"P0","where":"法理学：习近平法治思想、法治体系","question":"你如何理解全面依法治国与涉外法治？","lecture":"回答首先抓政治方向、人民立场、法治体系和实践环节：坚持党的领导、以人民为中心、中国特色社会主义法治道路，坚持依宪治国依宪执政，推进科学立法、严格执法、公正司法、全民守法，统筹国内法治与涉外法治，重视队伍和领导干部作用。\n\n按顺序记忆的十二项关键词：党的领导；以人民为中心；中国特色社会主义法治道路；依宪治国依宪执政；在法治轨道上全面建设社会主义现代化国家；建设中国特色社会主义法治体系；依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；科学立法、严格执法、公正司法、全民守法；国内法治与涉外法治；德才兼备高素质法治工作队伍；领导干部这个关键少数；依法治国和依规治党有机统一。此处是理解用关键词提纲，不冒充官方逐字引文。\n\n涉外科技法治要有国内法基础，也要理解国际规则、域外制度和跨境争议，服务合法权益保护与高水平开放。英语是沟通工具，不能替代法律判断。","lectureHtml":"\u003cp>回答首先抓政治方向、人民立场、法治体系和实践环节：坚持党的领导、以人民为中心、中国特色社会主义法治道路，坚持依宪治国依宪执政，推进科学立法、严格执法、公正司法、全民守法，统筹国内法治与涉外法治，重视队伍和领导干部作用。\u003c/p>\n\u003cp>按顺序记忆的十二项关键词：党的领导；以人民为中心；中国特色社会主义法治道路；依宪治国依宪执政；在法治轨道上全面建设社会主义现代化国家；建设中国特色社会主义法治体系；依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；科学立法、严格执法、公正司法、全民守法；国内法治与涉外法治；德才兼备高素质法治工作队伍；领导干部这个关键少数；依法治国和依规治党有机统一。此处是理解用关键词提纲，不冒充官方逐字引文。\u003c/p>\n\u003cp>涉外科技法治要有国内法基础，也要理解国际规则、域外制度和跨境争议，服务合法权益保护与高水平开放。英语是沟通工具，不能替代法律判断。\u003c/p>\n","answer":"我理解全面依法治国既有方向和价值要求，也要落实到立法、执法、司法、守法和监督。涉外科技法治是在这一框架中处理跨境技术、知识产权和数据问题，既需要国内法基础，也要理解国际规则。学习时还应注意2025年版纲要对核心要义的丰富发展，不能只沿用旧讲义。","follow":[["为什么不是只背十一个坚持？","2025年版纲要增加依法治国和依规治党有机统一为第十二项，并发展了第五项表述；旧版本有其历史语境。"],["涉外就是英语法律吗？","不是，英语是工具，核心仍是跨境关系中的规则理解、适用、争议处理与权益保护。"]],"refs":["xi2025","curriculum"],"subject":"theory"},{"id":"理12","title":"实证研究、规范研究与算法公平","priority":"P0","where":"法理学：法学方法与价值论","question":"如何将数据分析用于法学研究？","lecture":"实证研究考察制度实际怎样运行，可使用裁判数据、访谈、实验或统计；规范研究讨论规则应如何解释和安排，需要法源、概念、价值与制度论证。二者可以互相支持，但相关性不能直接推出因果，更不能从“多数这样做”直接推出“法律应该允许”。\n\n算法公平可以先问：优化目标是谁定的，数据代表谁，哪些群体错误更多，误判由谁承担，有没有解释与纠错。并非所有分类都不平等，也不能说相同公式天然公平。需要比较差别的目的、依据和实际影响。\n\n**教学假设：** 以地区作理赔风险变量，可能只是某种风险代理，也可能引入无关差别。先查证据和替代变量，再作合法性与合理性评价，不预设模型必然歧视或必然公正。","lectureHtml":"\u003cp>实证研究考察制度实际怎样运行，可使用裁判数据、访谈、实验或统计；规范研究讨论规则应如何解释和安排，需要法源、概念、价值与制度论证。二者可以互相支持，但相关性不能直接推出因果，更不能从“多数这样做”直接推出“法律应该允许”。\u003c/p>\n\u003cp>算法公平可以先问：优化目标是谁定的，数据代表谁，哪些群体错误更多，误判由谁承担，有没有解释与纠错。并非所有分类都不平等，也不能说相同公式天然公平。需要比较差别的目的、依据和实际影响。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 以地区作理赔风险变量，可能只是某种风险代理，也可能引入无关差别。先查证据和替代变量，再作合法性与合理性评价，不预设模型必然歧视或必然公正。\u003c/p>\n","answer":"数据分析可以帮助整理材料、发现制度运行问题，但需要与法源和规范论证结合。风险分类不仅看准确率，也要看误判分布、权利影响和纠错机制。统计相关不能直接推出法律上的应然结论，规范研究与实证研究需要互相支持。","follow":[["准确率最高就最公平吗？","不一定，总体准确率会遮蔽群体差异、错误成本和程序问题。"],["如何避免回答过度绝对？","区分基本规则与适用条件，检查是否有法定例外；只引用确实核对过的法条和案例，不猜条号。"]],"refs":["curriculum","pipl"],"subject":"theory"},{"id":"理13","title":"一分钟法理复盘与开放题结构","priority":"P0","where":"法理学全科；跨科应用","question":"你如何看待AI在法律中的未来应用？","lecture":"开放题也有可检查的内容：先明确应用场景，再给机会与风险，接一两项具体规则或制度，最后说明可行边界。不要堆“机遇挑战并存、完善法律、加强监管”而没有对象。\n\n对法律AI，可以先谈检索、文书辅助、合同审查和信息整理的效率，再谈幻觉、隐私、偏差和责任。规则锚点可选个保法自动化决策、生成式AI暂行办法、生成合成内容标识办法、最高法司法AI意见。不同文件的对象不同，不要把推荐模型说成必然属于生成式AI服务。\n\n法理学提供的主线是：技术改变能力和成本，法律安排权利、程序和责任。把AI应用分场景、按影响大小配置人工审核和救济，比泛泛支持或反对更有说服力。这是一种分析建议，不是声称法律已经规定统一“三级AI法律制度”。\n\n法理题不一定都有一条对应法条；属于理论分类或方法的问题，应说明理论依据，再用相关法条展示，不能编造“法理学第几条”。","lectureHtml":"\u003cp>开放题也有可检查的内容：先明确应用场景，再给机会与风险，接一两项具体规则或制度，最后说明可行边界。不要堆“机遇挑战并存、完善法律、加强监管”而没有对象。\u003c/p>\n\u003cp>对法律AI，可以先谈检索、文书辅助、合同审查和信息整理的效率，再谈幻觉、隐私、偏差和责任。规则锚点可选个保法自动化决策、生成式AI暂行办法、生成合成内容标识办法、最高法司法AI意见。不同文件的对象不同，不要把推荐模型说成必然属于生成式AI服务。\u003c/p>\n\u003cp>法理学提供的主线是：技术改变能力和成本，法律安排权利、程序和责任。把AI应用分场景、按影响大小配置人工审核和救济，比泛泛支持或反对更有说服力。这是一种分析建议，不是声称法律已经规定统一“三级AI法律制度”。\u003c/p>\n\u003cp>法理题不一定都有一条对应法条；属于理论分类或方法的问题，应说明理论依据，再用相关法条展示，不能编造“法理学第几条”。\u003c/p>\n","answer":"我看好AI用于法律检索、材料整理和合同审查辅助，但它也可能产生虚假依据、信息泄露和偏差。我会按场景和对权利的影响配置核验、人工复核和救济，结合个保法与最高法司法AI意见等具体要求。技术帮助提高效率，最终仍需要可核验的法律理由和清楚的责任。","follow":[["每道法理题都要背法条号吗？","不需要，概念、理论和方法先说准确，有相关规范再引用，不能硬凑条号。"],["如何避免回答过度绝对？","区分基本规则与适用条件，检查是否有法定例外；只引用确实核对过的法条和案例，不猜条号。"]],"refs":["pipl","genAI","labels","judicialAI","curriculum"],"subject":"theory"}],"introHtml":"\u003cp>法理学研究法律的一般概念、原理、价值和方法，不是又一部“法理法”。民法问合同如何生效，刑法问什么行为犯罪，法理学继续追问：为什么国家承认这种规范，规则和原则如何适用，法律怎样协调自由、秩序、公平与效率？\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>核心词\u003c/th>\n\u003cth>典型问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>法是什么\u003c/td>\n\u003ctd>本质、特征、作用、价值\u003c/td>\n\u003ctd>法与道德一样吗？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法怎样组成\u003c/td>\n\u003ctd>规则、原则、概念、渊源、体系\u003c/td>\n\u003ctd>规范冲突怎么办？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法怎样运行\u003c/td>\n\u003ctd>立法、执法、司法、守法、监督\u003c/td>\n\u003ctd>有法为什么还要程序？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法怎样说理\u003c/td>\n\u003ctd>解释、推理、论证、证据\u003c/td>\n\u003ctd>法官是不是机械套法条？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法治怎样实现\u003c/td>\n\u003ctd>权力约束、权利保障、良法善治\u003c/td>\n\u003ctd>AI提高效率是否就更公正？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>技术背景是切入口，但不要把法律降格为程序代码：输入事实常有争议，规则需要解释，价值也可能冲突，法律结论必须能向人说明。\u003c/p>\n"},{"id":"history","name":"法制史","subtitle":"纵看朝代，横看制度，解释为什么变化","color":"#79577e","intro":"法制史研究法律制度在特定社会条件中的形成和变迁。它不是把今天的法条倒回古代，也不是只记“某朝某人某法典”。回答顺序建议：**定位时期 → 解释制度 → 与前后制度比较 → 评价作用和限度。**\n\n常见断代史课程把传统法制分为初创、转型确立、发展、成熟定型、调整，再进入清末和民国及革命根据地。下面保留这条线，同时增加刑罚、法典、司法和礼法关系四条横线。\n\n| 时间锚点 | 代表制度 | 为什么要记 |\n|---|---|---|\n| 夏商西周 | 早期五刑、明德慎罚、礼刑秩序 | 伦理与政治组织如何影响法 |\n| 春秋战国 | 前536年郑国铸刑书；前513年晋国铸刑鼎；法经 | 规则公布、体系化和社会转型 |\n| 秦汉 | 律令、九章律、春秋决狱、亲亲得相首匿 | 统一治理与儒家化 |\n| 魏晋南北朝 | 八议入律、刑名法例、北齐名例与重罪十条 | 总则技术与身份秩序发展 |\n| 隋唐 | 开皇律、永徽律疏、唐律疏议 | 传统法典成熟 |\n| 宋元明清 | 宋刑统与编敕、明律六部、清律例和会审 | 稳定法典与动态治理 |\n| 清末 | 1908钦定宪法大纲；1910现行刑律；1911新刑律 | 近代部门分化和法制转型 |\n| 民国 | 1912临时约法、六法体系、民商合一 | 共和与近代法律体系及实践张力 |\n| 革命根据地、新中国建立 | 婚姻土地等立法、马锡五审判、1949共同纲领 | 人民司法与国家制度的新发展 |\n\n**不必强塞AI：** 历史题先讲制度本身，再谨慎谈规则公开、纠错、便民等可转化价值；历史类比不是现行法律依据。","route":"先读史01—史10形成完整年代线；再用史11—史15把刑罚、法典、司法、伦理和现代转型串起来。","lessons":[{"id":"史01","title":"中华法系与西周明德慎罚","priority":"P0","where":"传统法制初创；夏商西周","question":"中华法系有哪些特点？明德慎罚是什么意思？","lecture":"中华法系以中国传统法律为代表，对朝鲜、日本、越南等历史法制产生影响。常见特征是礼法结合、诸法合体以刑为主、行政司法联系紧密、身份等级和家族伦理影响显著，同时发展出系统法典、律学解释和司法审查技术。\n\n“以刑为主”不是古代没有财产、婚姻、行政规则，而是多种规范常在统一法典中以刑罚后果组织；不能按现代分科名称反推古代不存在相应社会关系。\n\n西周明德慎罚是在早期天
