命观和统治经验中强调德教、审慎用刑，目的仍与当时政治秩序相联系。可以认识慎刑价值，但不能直接称已建立现代人权保障。早期五刑通常为墨、劓、剕或刖、宫、大辟，与隋唐笞杖徒流死不同。\n\n西周宗法以血缘、嫡长子继承等组织等级关系，礼与刑共同维护秩序。不要将“刑不上大夫”理解为贵族绝不会受刑，而应认识身份影响处罚方式、程序和待遇。","lectureHtml":"\u003cp>中华法系以中国传统法律为代表，对朝鲜、日本、越南等历史法制产生影响。常见特征是礼法结合、诸法合体以刑为主、行政司法联系紧密、身份等级和家族伦理影响显著，同时发展出系统法典、律学解释和司法审查技术。\u003c/p>\n\u003cp>“以刑为主”不是古代没有财产、婚姻、行政规则，而是多种规范常在统一法典中以刑罚后果组织；不能按现代分科名称反推古代不存在相应社会关系。\u003c/p>\n\u003cp>西周明德慎罚是在早期天命观和统治经验中强调德教、审慎用刑，目的仍与当时政治秩序相联系。可以认识慎刑价值，但不能直接称已建立现代人权保障。早期五刑通常为墨、劓、剕或刖、宫、大辟，与隋唐笞杖徒流死不同。\u003c/p>\n\u003cp>西周宗法以血缘、嫡长子继承等组织等级关系，礼与刑共同维护秩序。不要将“刑不上大夫”理解为贵族绝不会受刑，而应认识身份影响处罚方式、程序和待遇。\u003c/p>\n","answer":"中华法系的重要特点包括礼法结合、诸法合体以刑为主、行政与司法联系密切，以及身份家族伦理的影响。明德慎罚是西周强调德教与审慎用刑的思想，具有慎刑意义，但仍需放在当时等级和政治秩序中理解，不能直接等同现代人权制度。","follow":[["古代以刑为主就是没有民法内容？","不是，有婚姻、财产等规则，只是组织形式和现代部门划分不同。"],["刑不上大夫是不是贵族犯罪都不处罚？","不能绝对理解，重点是等级身份影响程序与处罚待遇。"]],"refs":["curriculum"],"subject":"history"},{"id":"史02","title":"公布成文法与法经","priority":"P0","where":"春秋战国；成文法公布和法典编纂","question":"子产铸刑书与李悝法经有什么意义？","lecture":"春秋社会变化冲击贵族礼制和不公开的裁断秩序。前536年郑国子产铸刑书，是公布成文法的重要节点；前513年晋国铸刑鼎是另一节点。人物、国家、时间不要串错，子产不是晋国铸刑鼎的主持者。\n\n公开规则使社会成员更容易了解行为界限，冲击贵族对法律知识和裁判的垄断，促进成文规范发展。但不能夸大成当时已经实现法律面前人人平等，公开不自动消灭等级。\n\n战国李悝编纂《法经》，通常认为是中国历史上第一部比较系统的成文法典。六篇常记盗、贼、网（教材也见囚）、捕、杂、具。盗贼在前反映主要保护对象，网捕涉及追捕拘系等程序，具规定定罪量刑共同原则，体现体系化萌芽。不能说名例律已经是法经首篇。\n\n**现代联系限度：** 法律公开有助于可预期，算法规则的透明也有类似治理价值，但两者不是同一制度，不能用古代刑书直接推出今天平台公开全部源代码的义务。","lectureHtml":"\u003cp>春秋社会变化冲击贵族礼制和不公开的裁断秩序。前536年郑国子产铸刑书，是公布成文法的重要节点；前513年晋国铸刑鼎是另一节点。人物、国家、时间不要串错，子产不是晋国铸刑鼎的主持者。\u003c/p>\n\u003cp>公开规则使社会成员更容易了解行为界限，冲击贵族对法律知识和裁判的垄断，促进成文规范发展。但不能夸大成当时已经实现法律面前人人平等，公开不自动消灭等级。\u003c/p>\n\u003cp>战国李悝编纂《法经》，通常认为是中国历史上第一部比较系统的成文法典。六篇常记盗、贼、网（教材也见囚）、捕、杂、具。盗贼在前反映主要保护对象，网捕涉及追捕拘系等程序，具规定定罪量刑共同原则，体现体系化萌芽。不能说名例律已经是法经首篇。\u003c/p>\n\u003cp>\u003cstrong>现代联系限度：\u003c/strong> 法律公开有助于可预期，算法规则的透明也有类似治理价值，但两者不是同一制度，不能用古代刑书直接推出今天平台公开全部源代码的义务。\u003c/p>\n","answer":"公布成文法使规则更公开，冲击贵族对法律知识和裁断的垄断；法经则体现法律编纂的系统化。需要区分春秋郑国子产铸刑书与战国李悝编法经，也不能把规则公开夸大为当时已实现现代平等法治。","follow":[["法经中的具有什么作用？","规定定罪量刑的一般原则，可从共同规则的提取理解其体系意义。"],["法经原文完整保存到今天了吗？","不能这样说，研究涉及后世记载等材料，不编造自己阅读完整原典的经历。"]],"refs":["curriculum"],"subject":"history"},{"id":"史03","title":"秦汉：律令治理与法律儒家化","priority":"P0","where":"秦汉法制","question":"春秋决狱为什么出现？有何作用和局限？","lecture":"秦法与统一国家的行政治理紧密相关，律令规范覆盖官吏、赋役、经济管理和刑事等领域。不能只用严刑峻法四个字否定其行政组织与法律技术。汉代在承继中调整，萧何九章律在传统记载中承法经六篇并增加户、兴、厩，体现治理范围扩展。\n\n汉代德主刑辅及儒家思想影响增强。春秋决狱以儒家经义参与案件判断，重视动机和伦理，使法律与社会价值连接，也可能带来经义解释和规则确定性之间的张力。不能说等于完全不用律令。\n\n亲亲得相首匿承认一定亲属关系中隐匿行为的特殊处理，体现家族伦理，但范围、身份与严重犯罪例外需要区分，不是所有亲属包庇所有罪都免责。\n\n文景时期刑制改革是肉刑变革的重要节点，但不能说一次改革彻底消灭所有残酷刑罚。观察历史应同时看法令目标、替代措施和实际效果。","lectureHtml":"\u003cp>秦法与统一国家的行政治理紧密相关，律令规范覆盖官吏、赋役、经济管理和刑事等领域。不能只用严刑峻法四个字否定其行政组织与法律技术。汉代在承继中调整，萧何九章律在传统记载中承法经六篇并增加户、兴、厩，体现治理范围扩展。\u003c/p>\n\u003cp>汉代德主刑辅及儒家思想影响增强。春秋决狱以儒家经义参与案件判断，重视动机和伦理，使法律与社会价值连接，也可能带来经义解释和规则确定性之间的张力。不能说等于完全不用律令。\u003c/p>\n\u003cp>亲亲得相首匿承认一定亲属关系中隐匿行为的特殊处理，体现家族伦理，但范围、身份与严重犯罪例外需要区分，不是所有亲属包庇所有罪都免责。\u003c/p>\n\u003cp>文景时期刑制改革是肉刑变革的重要节点，但不能说一次改革彻底消灭所有残酷刑罚。观察历史应同时看法令目标、替代措施和实际效果。\u003c/p>\n","answer":"春秋决狱体现汉代儒家思想对法律适用的影响，通过经义和行为动机等解释案件，推动法律儒家化。它也可能带来伦理解释与明确规则之间的张力，不能直接类比为现代法官可以随意以道德代替法律。","follow":[["亲亲相隐等于任何包庇都免责？","不是，历史制度也有亲属范围、身份和重大犯罪等限制。"],["秦法只值得记严刑峻法吗？","还应认识律令、行政管理和国家组织能力，避免单面评价。"]],"refs":["curriculum"],"subject":"history"},{"id":"史04","title":"魏晋南北朝：总则技术、八议与重罪十条","priority":"P0","where":"传统法制发展时期","question":"八议、名例律和重罪十条分别是什么？","lecture":"这一时期不是唐律前的空白，而是法律体系与儒家化的重要准备。曹魏新律将刑名置于律首，突出共同定罪量刑规则；晋律在刑名外设置法例，律学注释发达，张斐、杜预注律使晋律又称张杜律；北齐律合并发展为名例律并形成十二篇体例。\n\n八议正式入律的重要节点是曹魏律，针对亲、故、贤、能、功、贵、勤、宾等特定身份，体现特别议罪程序和等级特权。不是人人可以参加的八种民主审议。\n\n北齐律规定重罪十条，是隋唐十恶形成的重要前身。要分清北齐重罪十条与隋开皇律十恶，不把时间与名称倒置。北齐十二篇体例也不能等同其已经全面确立隋唐五刑。\n\n从编纂角度看，共同规则置首让具体规定协调起来，与现代总则技术有可比较之处；但价值基础和主体平等观念不能直接等同。","lectureHtml":"\u003cp>这一时期不是唐律前的空白，而是法律体系与儒家化的重要准备。曹魏新律将刑名置于律首，突出共同定罪量刑规则；晋律在刑名外设置法例，律学注释发达，张斐、杜预注律使晋律又称张杜律；北齐律合并发展为名例律并形成十二篇体例。\u003c/p>\n\u003cp>八议正式入律的重要节点是曹魏律，针对亲、故、贤、能、功、贵、勤、宾等特定身份，体现特别议罪程序和等级特权。不是人人可以参加的八种民主审议。\u003c/p>\n\u003cp>北齐律规定重罪十条，是隋唐十恶形成的重要前身。要分清北齐重罪十条与隋开皇律十恶，不把时间与名称倒置。北齐十二篇体例也不能等同其已经全面确立隋唐五刑。\u003c/p>\n\u003cp>从编纂角度看，共同规则置首让具体规定协调起来，与现代总则技术有可比较之处；但价值基础和主体平等观念不能直接等同。\u003c/p>\n","answer":"八议体现特定身份的议罪待遇，曹魏入律是重要节点；名例律体现总则性质规则的发展，北齐律是关键节点；重罪十条也是北齐律的重要制度，是后来十恶的前身。三者分别关乎身份待遇、编纂结构和严重犯罪分类。","follow":[["北齐就叫十恶吗？","应区分北齐重罪十条与隋开皇律确立的十恶。"],["古代总则与现代总则一样吗？","可以比较提取共同规则的技术，但不能忽略等级伦理与现代价值差异。"]],"refs":["curriculum"],"subject":"history"},{"id":"史05","title":"隋唐律典、十恶与律令格式","priority":"P0","where":"传统法制成熟；开皇律、唐律疏议","question":"唐律疏议为什么重要？","lecture":"隋开皇律整合前代法制，确立笞、杖、徒、流、死五刑和十恶等制度。唐代在继承修订中形成成熟法典，永徽年间对律作系统疏议；唐律疏议将律文与官方解释结合，是现存较完整、具有代表性的中国传统法典，对后世及周边法制有深远影响。\n\n唐律十二篇：名例、卫禁、职制、户婚、厩库、擅兴、贼盗、斗讼、诈伪、杂律、捕亡、断狱。先记名例统摄、户婚财产身份、斗讼纠纷、捕亡断狱程序这几组，再补篇名，不必第一轮逐字穷背。\n\n律令格式互相配合：律主要规定犯罪刑罚，令安排制度规范，格常将制敕整理补充，式涉及具体办事程式。不能把它们简单等同今天四个固定法律位阶。\n\n十恶包括谋反、谋大逆、谋叛、恶逆、不道、大不敬、不孝、不睦、不义、内乱，集中保护统治和伦理秩序。不是十恶全部一律死刑，重要的是严格处理、限制某些优待等制度效果。\n\n礼法结合可以用德礼为本、刑罚为用来理解，但这是一套历史政治伦理秩序，不等于现代所有道德都能刑罚化。","lectureHtml":"\u003cp>隋开皇律整合前代法制，确立笞、杖、徒、流、死五刑和十恶等制度。唐代在继承修订中形成成熟法典，永徽年间对律作系统疏议；唐律疏议将律文与官方解释结合，是现存较完整、具有代表性的中国传统法典，对后世及周边法制有深远影响。\u003c/p>\n\u003cp>唐律十二篇：名例、卫禁、职制、户婚、厩库、擅兴、贼盗、斗讼、诈伪、杂律、捕亡、断狱。先记名例统摄、户婚财产身份、斗讼纠纷、捕亡断狱程序这几组，再补篇名，不必第一轮逐字穷背。\u003c/p>\n\u003cp>律令格式互相配合：律主要规定犯罪刑罚，令安排制度规范，格常将制敕整理补充，式涉及具体办事程式。不能把它们简单等同今天四个固定法律位阶。\u003c/p>\n\u003cp>十恶包括谋反、谋大逆、谋叛、恶逆、不道、大不敬、不孝、不睦、不义、内乱，集中保护统治和伦理秩序。不是十恶全部一律死刑，重要的是严格处理、限制某些优待等制度效果。\u003c/p>\n\u003cp>礼法结合可以用德礼为本、刑罚为用来理解，但这是一套历史政治伦理秩序，不等于现代所有道德都能刑罚化。\u003c/p>\n","answer":"唐律疏议把律文与系统解释结合，体现中国传统法典的成熟，并影响后世和周边国家。理解它应同时看名例统摄的结构、律令格式配合与礼法结合，也认识其等级伦理背景，不能只背一部法典名称。","follow":[["十恶全部判死刑吗？","不是，十恶是严重犯罪类别与特殊法律待遇安排，具体处罚仍有不同。"],["疏议只是私人读书笔记吗？","不是，唐律相关疏议具有官方解释和统一适用的重要意义。"]],"refs":["curriculum"],"subject":"history"},{"id":"史06","title":"宋代：编敕、折杖与司法纠错","priority":"P1","where":"传统法制调整；宋代","question":"宋代法制在唐律之外有什么变化？","lecture":"宋刑统承继唐律并汇集相关规范，是宋初重要法典。编敕将皇帝诏敕整理成规范，回应不断出现的实际治理需要，体现稳定法典与动态补充的关系。不能说有了宋刑统就不再使用敕。\n\n折杖法将部分刑罚折换为杖责及相应处置，目的包括减少部分执行负担、调整刑罚方式，但适用有范围，不能说所有刑罚均可折杖或折后都无条件释放。刺配等又体现其他严厉刑罚实践，制度变化并非单线“越来越轻”。\n\n司法上，鞫谳分司强调审理事实与检法断罪的职能分工；翻异别推针对翻供等情形由其他官员或机构重新推勘，具有复查纠错意义。不能把它们直接说成现代三权分立或统一上诉制度。","lectureHtml":"\u003cp>宋刑统承继唐律并汇集相关规范，是宋初重要法典。编敕将皇帝诏敕整理成规范，回应不断出现的实际治理需要，体现稳定法典与动态补充的关系。不能说有了宋刑统就不再使用敕。\u003c/p>\n\u003cp>折杖法将部分刑罚折换为杖责及相应处置，目的包括减少部分执行负担、调整刑罚方式，但适用有范围，不能说所有刑罚均可折杖或折后都无条件释放。刺配等又体现其他严厉刑罚实践，制度变化并非单线“越来越轻”。\u003c/p>\n\u003cp>司法上，鞫谳分司强调审理事实与检法断罪的职能分工；翻异别推针对翻供等情形由其他官员或机构重新推勘，具有复查纠错意义。不能把它们直接说成现代三权分立或统一上诉制度。\u003c/p>\n","answer":"宋代一方面承继唐律形成宋刑统，另一方面通过编敕回应现实需要。司法中还有鞫谳分司、翻异别推等分工和复查制度，可从查明事实与减少错误理解其意义，但不能等同现代审判体制。","follow":[["鞫谳分司就是立法和司法分开吗？","不是，重点在案件事实推鞫与检法定罪等环节分工。"],["制度有纠错安排就完全没有冤案？","不能推出，实际效果还受权力结构、证据方法和执行条件影响。"]],"refs":["curriculum"],"subject":"history"},{"id":"史07","title":"元明清：六部结构、律例与会审","priority":"P0","where":"传统法制调整；元明清","question":"大明律体例与唐律有什么区别？","lecture":"元代法律存在多种法源并行和身份差异等特点，反映国家结构与治理背景。不要将历史身份差等规范当作今天可接受的制度原则，应作历史描述与评价区分。\n\n大明律以名例统摄，并按吏、户、礼、兵、刑、工六部分编，反映法律规范与行政组织对应。唐律十二篇与明律六部结构，是最值得记的一组变化，不要说大明律只包含六篇而忽略名例。\n\n清代大清律例延续并调整传统体系，律提供相对稳定框架，例更灵活补充适用。它不是现代判例法中所有裁判都成为先例的制度；律例数量与实践关系也不等于文字越多法治越完善。\n\n明清中央三法司是刑部、大理寺、都察院。清秋审主要审理各省上报的斩监候、绞监候案件，朝审对象和范围另有区别；通过复核决定情实、缓决、可矜、留养承祀等分类处理，体现慎刑和皇权控制的双重背景。两天先记功能，细分类作为扩展。","lectureHtml":"\u003cp>元代法律存在多种法源并行和身份差异等特点，反映国家结构与治理背景。不要将历史身份差等规范当作今天可接受的制度原则，应作历史描述与评价区分。\u003c/p>\n\u003cp>大明律以名例统摄，并按吏、户、礼、兵、刑、工六部分编，反映法律规范与行政组织对应。唐律十二篇与明律六部结构，是最值得记的一组变化，不要说大明律只包含六篇而忽略名例。\u003c/p>\n\u003cp>清代大清律例延续并调整传统体系，律提供相对稳定框架，例更灵活补充适用。它不是现代判例法中所有裁判都成为先例的制度；律例数量与实践关系也不等于文字越多法治越完善。\u003c/p>\n\u003cp>明清中央三法司是刑部、大理寺、都察院。清秋审主要审理各省上报的斩监候、绞监候案件，朝审对象和范围另有区别；通过复核决定情实、缓决、可矜、留养承祀等分类处理，体现慎刑和皇权控制的双重背景。两天先记功能，细分类作为扩展。\u003c/p>\n","answer":"大明律在名例统摄下按吏户礼兵刑工六部分编，与唐律十二篇体例不同，体现法律编排和行政组织的联系。清代又通过律例配合及会审复核应对现实治理，既有慎刑和纠错意义，也受皇权与等级秩序制约。","follow":[["明清三法司是哪三个？","刑部、大理寺、都察院；唐代对应监察机关是御史台，不能把名称混用。"],["秋审就是所有案件重审吗？","不是，主要针对法定范围的死刑监候案件，不能扩大到一切民刑事案件。"]],"refs":["curriculum"],"subject":"history"},{"id":"史08","title":"清末修律、现行刑律与新刑律","priority":"P0","where":"近代转型；1902修律启动后的改革","question":"清末为什么修律？两部刑律有什么区别？","lecture":"清末修律受到内外压力、社会经济变化和收回治外法权等目标推动，也受法律移植和政治变革影响。沈家本、伍廷芳等参与相关改革，部门分化、审判组织和法律教育等逐步变化。不能把原因只说成统治者突然喜欢西方法律。\n\n大清现行刑律是旧律向近代转型的过渡性修订，1910年颁行，在旧框架上调整刑罚和内容；大清新刑律1911年公布，采用总则分则结构，吸收近代刑法原则和刑罚体系，是近代意义刑法典的重要节点，但清亡前并未得到完整实施。\n\n大清民律草案体现近代民法编纂尝试，草案与正式施行法律必须分清。改革文本、实施能力、社会接受和政治环境共同决定效果，不是颁布一部新法就完成现代化。\n\n**与涉外方向连接：** 收回治外法权说明法律改革与国际关系密切相关；今天涉外法治的国家地位与制度环境已经不同，不能生硬类比。","lectureHtml":"\u003cp>清末修律受到内外压力、社会经济变化和收回治外法权等目标推动，也受法律移植和政治变革影响。沈家本、伍廷芳等参与相关改革，部门分化、审判组织和法律教育等逐步变化。不能把原因只说成统治者突然喜欢西方法律。\u003c/p>\n\u003cp>大清现行刑律是旧律向近代转型的过渡性修订，1910年颁行，在旧框架上调整刑罚和内容；大清新刑律1911年公布，采用总则分则结构，吸收近代刑法原则和刑罚体系，是近代意义刑法典的重要节点，但清亡前并未得到完整实施。\u003c/p>\n\u003cp>大清民律草案体现近代民法编纂尝试，草案与正式施行法律必须分清。改革文本、实施能力、社会接受和政治环境共同决定效果，不是颁布一部新法就完成现代化。\u003c/p>\n\u003cp>\u003cstrong>与涉外方向连接：\u003c/strong> 收回治外法权说明法律改革与国际关系密切相关；今天涉外法治的国家地位与制度环境已经不同，不能生硬类比。\u003c/p>\n","answer":"清末修律是内外压力、社会变化和收回治外法权等多种因素推动的转型。现行刑律主要是在旧律基础上作过渡性调整，新刑律则采用近代刑法的结构和原则。还要区分公布与实际实施，不能说新刑律在清朝长期完整运行。","follow":[["民律草案就是已施行民法典吗？","不是，草案、公布、施行及实际运行需要分别说明。"],["修律成功与否只看法条先进吗？","还要看政治环境、组织能力、社会条件和执行效果。"]],"refs":["curriculum"],"subject":"history"},{"id":"史09","title":"礼法之争与制度移植","priority":"P0","where":"清末修律；法律思想与社会基础","question":"如何评价清末礼法之争？","lecture":"礼法之争发生于清末修律过程中，围绕家族伦理、个人地位和近代刑法制度展开。常见争点有无夫奸、亲属尊卑关系等。礼教派重视传统纲常对社会秩序的维系，法理派推动近代法理、部门分化和规则更新，但双方观点不能简化为完全落后与完全先进。\n\n核心问题是法律移植如何面对本土伦理与社会结构。只看外国文本会忽略实施条件，只维持旧秩序又可能阻碍个人权益和制度变化。评价应同时说明改革动力、具体分歧与结果，不只背两派名称。\n\n你可以把它与法理中的法律与道德关系连接：法律可能吸收伦理，但不应将一切伦理要求刑罚化。与今天技术规范移植的类比限于方法层面，不能据此断言某个域外AI法规适合或不适合中国。\n\n**自然结尾：** 我感受到规则不是脱离社会的技术方案，学习法律除了理解文本，还需要理解它面对的人和关系。","lectureHtml":"\u003cp>礼法之争发生于清末修律过程中，围绕家族伦理、个人地位和近代刑法制度展开。常见争点有无夫奸、亲属尊卑关系等。礼教派重视传统纲常对社会秩序的维系，法理派推动近代法理、部门分化和规则更新，但双方观点不能简化为完全落后与完全先进。\u003c/p>\n\u003cp>核心问题是法律移植如何面对本土伦理与社会结构。只看外国文本会忽略实施条件，只维持旧秩序又可能阻碍个人权益和制度变化。评价应同时说明改革动力、具体分歧与结果，不只背两派名称。\u003c/p>\n\u003cp>你可以把它与法理中的法律与道德关系连接：法律可能吸收伦理，但不应将一切伦理要求刑罚化。与今天技术规范移植的类比限于方法层面，不能据此断言某个域外AI法规适合或不适合中国。\u003c/p>\n\u003cp>\u003cstrong>自然结尾：\u003c/strong> 我感受到规则不是脱离社会的技术方案，学习法律除了理解文本，还需要理解它面对的人和关系。\u003c/p>\n","answer":"礼法之争反映清末近代法律改革与传统家族伦理之间的张力。评价时应看具体争点和社会基础，既认识改革对部门分化、个人地位的意义，也理解制度移植不能脱离现实，不能简单给两派贴先进或落后标签。","follow":[["它与今天有什么联系？","可启发我们关注制度移植的条件和法律道德边界，但历史争论不能直接决定现行法答案。"],["法律要照顾伦理，是不是都应入罪？","不是，还受罪刑法定、必要性及权利保障约束。"]],"refs":["curriculum","criminal"],"subject":"history"},{"id":"史10","title":"近代宪法性文件与民国六法","priority":"P0","where":"清末立宪、民国初期与南京国民政府","question":"临时约法的意义是什么？","lecture":"1908年钦定宪法大纲是清末预备立宪的重要文件，突出君权并列臣民权利义务；1911年十九信条反映危机中的权力调整。文件标题含宪法不等于已实现现代民主宪政，应看权力安排和实践。\n\n1912年中华民国临时约法体现主权在民、共和、权利和权力组织等观念，并设置限制总统权力的制度安排，具有近代宪法性文件的重要地位。其进步内容与政治实践的局限须分层评价，不能说公布后民主制度便稳定实现。\n\n北洋时期不同宪法草案和文件反映政治角力，南京国民政府逐步形成以六法为中心的成文体系。六法通常概括宪法、民法、刑法、民事诉讼法、刑事诉讼法及行政法相关规范，行政法不是必然一部统一法典。\n\n民商合一是在民法中统一安排主要民商规则，不意味着从此没有公司等商事特别法。它与唐明诸法合体不是同一个概念：前者是在近代部门分化基础上的民商安排，后者是传统法典结构。","lectureHtml":"\u003cp>1908年钦定宪法大纲是清末预备立宪的重要文件，突出君权并列臣民权利义务；1911年十九信条反映危机中的权力调整。文件标题含宪法不等于已实现现代民主宪政，应看权力安排和实践。\u003c/p>\n\u003cp>1912年中华民国临时约法体现主权在民、共和、权利和权力组织等观念，并设置限制总统权力的制度安排，具有近代宪法性文件的重要地位。其进步内容与政治实践的局限须分层评价，不能说公布后民主制度便稳定实现。\u003c/p>\n\u003cp>北洋时期不同宪法草案和文件反映政治角力，南京国民政府逐步形成以六法为中心的成文体系。六法通常概括宪法、民法、刑法、民事诉讼法、刑事诉讼法及行政法相关规范，行政法不是必然一部统一法典。\u003c/p>\n\u003cp>民商合一是在民法中统一安排主要民商规则，不意味着从此没有公司等商事特别法。它与唐明诸法合体不是同一个概念：前者是在近代部门分化基础上的民商安排，后者是传统法典结构。\u003c/p>\n","answer":"临时约法是1912年的重要宪法性文件，体现共和、主权在民和权利保障等观念，也对国家权力作出组织约束。评价应区分制度内容和实际政治效果。之后民国六法体系体现近代部门分化，不能与传统诸法合体混同。","follow":[["六法就是六部单独法典吗？","不能机械理解，其中行政法通常指相关规范体系。"],["民商合一就是没有商事特别法吗？","不是，仍然可以存在公司等领域的商事特别立法。"]],"refs":["curriculum"],"subject":"history"},{"id":"史11","title":"革命根据地与马锡五审判","priority":"P0","where":"革命根据地法制；抗日时期陕甘宁边区","question":"马锡五审判方式有什么特点？","lecture":"革命根据地法制围绕政权建设、土地、劳动、婚姻和司法等实际问题展开，不同阶段有不同政策与法律安排。1931年中华苏维埃共和国宪法大纲、抗日民主政权时期有关施政纲领和制度，是理解历史阶段的重要锚点，不要把全部时期统称同一制度。\n\n抗日民主政权中的三三制体现统一战线下政权人员构成安排，不是三个机关三权分立。土地政策也经历不同阶段，不能说各时期始终采用完全相同方式。\n\n马锡五审判方式强调深入群众调查研究、方便群众诉讼、就地解决纠纷、调判结合与依法处理。它既是办案方式，也反映人民司法的价值取向。尊重群众意见不等于由围观者投票决定谁有罪。\n\n现代借鉴应将群众路线、便民和实质解纷与程序、证据、当事人自愿结合。网络司法可以减少奔波，但需照顾不会使用技术的人，不能因网上办理方便多数就排除少数人的诉讼机会。","lectureHtml":"\u003cp>革命根据地法制围绕政权建设、土地、劳动、婚姻和司法等实际问题展开，不同阶段有不同政策与法律安排。1931年中华苏维埃共和国宪法大纲、抗日民主政权时期有关施政纲领和制度，是理解历史阶段的重要锚点，不要把全部时期统称同一制度。\u003c/p>\n\u003cp>抗日民主政权中的三三制体现统一战线下政权人员构成安排，不是三个机关三权分立。土地政策也经历不同阶段，不能说各时期始终采用完全相同方式。\u003c/p>\n\u003cp>马锡五审判方式强调深入群众调查研究、方便群众诉讼、就地解决纠纷、调判结合与依法处理。它既是办案方式，也反映人民司法的价值取向。尊重群众意见不等于由围观者投票决定谁有罪。\u003c/p>\n\u003cp>现代借鉴应将群众路线、便民和实质解纷与程序、证据、当事人自愿结合。网络司法可以减少奔波，但需照顾不会使用技术的人，不能因网上办理方便多数就排除少数人的诉讼机会。\u003c/p>\n","answer":"马锡五审判方式产生于革命根据地司法实践，强调调查研究、联系群众、方便诉讼和调判结合。今天可借鉴其司法为民和实质解纷价值，同时坚持证据、程序和自愿原则，不能把群众意见直接等同裁判结论。","follow":[["调解是不是越多越好？","不应机械追求比例，必须合法、自愿，不能强迫当事人放弃权利。"],["如何避免回答过度绝对？","区分基本规则与适用条件，检查是否有法定例外；只引用确实核对过的法条和案例，不猜条号。"]],"refs":["curriculum","maxiwu"],"subject":"history"},{"id":"史12","title":"横向线：刑罚和定罪原则怎样演变","priority":"P1","where":"跨朝代制度史：刑罚与刑法原则","question":"古代五刑与今天刑罚有什么不同？","lecture":"第一条线是身体性刑罚向其他刑罚结构的变化：早期五刑墨、劓、剕或刖、宫、大辟；文景改革是重要转折；隋唐五刑笞、杖、徒、流、死；宋折杖、刺配，明清充军等制度又有调整。不要将不同阶段五刑混在同一个列表，也不要把演变说成直线进步。\n\n第二条线是定罪量刑规则精细化：年龄、身份、亲属、故意过失等因素逐步制度化。八议、官当、十恶等反映等级和伦理安排，与现代法律面前人人平等并不相同。存在审慎处理措施，也不代表现代罪刑法定已经完整确立。\n\n第三条线是近代改革：大清新刑律等吸收近代刑法结构与原则，现代我国刑法以法定原则、责任原则及法定刑体系运行。历史名称相似不等于法律性质一致，例如古代“徒”与现代有期徒刑不能无条件对应。\n\n对历史的评价，应有具体制度、社会原因和局限三个层次，不只说古代残酷、现代文明。","lectureHtml":"\u003cp>第一条线是身体性刑罚向其他刑罚结构的变化：早期五刑墨、劓、剕或刖、宫、大辟；文景改革是重要转折；隋唐五刑笞、杖、徒、流、死；宋折杖、刺配，明清充军等制度又有调整。不要将不同阶段五刑混在同一个列表，也不要把演变说成直线进步。\u003c/p>\n\u003cp>第二条线是定罪量刑规则精细化：年龄、身份、亲属、故意过失等因素逐步制度化。八议、官当、十恶等反映等级和伦理安排，与现代法律面前人人平等并不相同。存在审慎处理措施，也不代表现代罪刑法定已经完整确立。\u003c/p>\n\u003cp>第三条线是近代改革：大清新刑律等吸收近代刑法结构与原则，现代我国刑法以法定原则、责任原则及法定刑体系运行。历史名称相似不等于法律性质一致，例如古代“徒”与现代有期徒刑不能无条件对应。\u003c/p>\n\u003cp>对历史的评价，应有具体制度、社会原因和局限三个层次，不只说古代残酷、现代文明。\u003c/p>\n","answer":"早期五刑与隋唐五刑已经不同，前者主要是墨劓剕宫大辟，后者是笞杖徒流死。后世又有调整。比较现代刑罚，要同时看身体处置、自由限制、法定原则和主体平等观念，不能只凭名称类似就认为性质相同。","follow":[["十恶与现代重大犯罪完全一样吗？","不一样，十恶包含当时统治和伦理秩序的特殊分类，不能直接对应现代罪名。"],["有慎刑规则就已实行罪刑法定？","不能推出，两者价值和制度条件不同。"]],"refs":["curriculum","criminal"],"subject":"history"},{"id":"史13","title":"横向线：法典体例与司法机构","priority":"P1","where":"跨朝代制度史：编纂、司法与解释","question":"请串起从法经到清末法典的变化。","lecture":"法典体例可记：法经六篇—汉九章律—魏晋刑名法例发展—北齐名例和十二篇—隋唐十二篇成熟—明律名例加六部—清律例—清末近代总则分则和部门分化。它说明共同规则逐渐提取、行政组织影响编排、近代又发生分科转型。\n\n司法机构可记角色：秦汉廷尉作为中央司法重要机关；隋唐大理寺审判、刑部复核等、御史台监察；明清中央三法司为刑部、大理寺、都察院。具体权限随时期变化，不能背成三家名称不同但一直完全同职。\n\n审判程序还要连到复核和纠错：唐死刑复奏、宋翻异别推及鞫谳分司、明清会审等。承认这些制度的审慎与分工意义，也应认识它们处于皇权和行政司法联系密切的结构中。\n\n**学习窍门：** 年代线定位“在哪”，制度线回答“变了什么”，原因线回答“为什么”。三条一起使用，比孤立背年表更能应对追问。","lectureHtml":"\u003cp>法典体例可记：法经六篇—汉九章律—魏晋刑名法例发展—北齐名例和十二篇—隋唐十二篇成熟—明律名例加六部—清律例—清末近代总则分则和部门分化。它说明共同规则逐渐提取、行政组织影响编排、近代又发生分科转型。\u003c/p>\n\u003cp>司法机构可记角色：秦汉廷尉作为中央司法重要机关；隋唐大理寺审判、刑部复核等、御史台监察；明清中央三法司为刑部、大理寺、都察院。具体权限随时期变化，不能背成三家名称不同但一直完全同职。\u003c/p>\n\u003cp>审判程序还要连到复核和纠错：唐死刑复奏、宋翻异别推及鞫谳分司、明清会审等。承认这些制度的审慎与分工意义，也应认识它们处于皇权和行政司法联系密切的结构中。\u003c/p>\n\u003cp>\u003cstrong>学习窍门：\u003c/strong> 年代线定位“在哪”，制度线回答“变了什么”，原因线回答“为什么”。三条一起使用，比孤立背年表更能应对追问。\u003c/p>\n","answer":"法典从法经到汉律，再到魏晋北齐提取共同规则，隋唐形成成熟十二篇体例，明律改为名例统摄六部，清代律例配合，清末进一步向近代分科体系转型。变化既体现编纂技术，也反映行政组织与社会结构的影响。","follow":[["御史台和都察院可以随便替换说吗？","不能，要先定位朝代，隋唐与明清中央监察机关名称有区别。"],["历史制度比较最少说哪三点？","时期、制度内容、变化原因及意义；有余力再补局限。"]],"refs":["curriculum"],"subject":"history"},{"id":"史14","title":"横向线：礼法、婚姻家族与主体地位","priority":"P1","where":"跨朝代制度史：礼法关系与民事内容","question":"古代婚姻家庭制度怎样体现礼法关系？","lecture":"传统婚姻家族规范常与宗法、亲属身份、财产承继和伦理秩序相联系，不能只当私人合同。六礼反映婚姻成立的礼仪程序，七出、三不去等反映夫权与一定限制并存，不能将三不去直接说成现代男女平等制度。\n\n三不去通常指有所取无所归、与更三年丧、前贫贱后富贵等限制出妻情形，不同时期及特殊情况还需具体判断。两天第一轮不必钻所有例外，但要知道历史规则也存在结构和条件，而非绝对任意。\n\n亲亲得相首匿、同居相为隐、准五服以制罪等，显示亲属伦理进入责任分配。今天法律也考虑亲属保护，但权利结构、平等观念和程序均不同，不能把传统身份特权作为现代合理差别的当然依据。\n\n评价时可说礼法结合提供规范的社会基础，也可能固化等级与性别不平等；现代传承要作价值转换，保留关怀与责任，摒弃不平等支配。","lectureHtml":"\u003cp>传统婚姻家族规范常与宗法、亲属身份、财产承继和伦理秩序相联系，不能只当私人合同。六礼反映婚姻成立的礼仪程序，七出、三不去等反映夫权与一定限制并存，不能将三不去直接说成现代男女平等制度。\u003c/p>\n\u003cp>三不去通常指有所取无所归、与更三年丧、前贫贱后富贵等限制出妻情形，不同时期及特殊情况还需具体判断。两天第一轮不必钻所有例外，但要知道历史规则也存在结构和条件，而非绝对任意。\u003c/p>\n\u003cp>亲亲得相首匿、同居相为隐、准五服以制罪等，显示亲属伦理进入责任分配。今天法律也考虑亲属保护，但权利结构、平等观念和程序均不同，不能把传统身份特权作为现代合理差别的当然依据。\u003c/p>\n\u003cp>评价时可说礼法结合提供规范的社会基础，也可能固化等级与性别不平等；现代传承要作价值转换，保留关怀与责任，摒弃不平等支配。\u003c/p>\n","answer":"传统婚姻家庭规范嵌入宗法与礼制，亲属身份会影响婚姻、财产和责任。七出与三不去可以说明权力安排与一定限制并存，但不是现代平等婚姻制度。今天借鉴家庭责任等价值，必须以主体平等和现行法为基础。","follow":[["古代法律保护家庭就与现行民法相同吗？","不能，保护对象、身份地位和权利结构差异很大。"],["法制史只需要赞美传统吗？","应以事实和制度为基础，客观说明成就、背景与局限，避免全盘肯定或全盘否定。"]],"refs":["curriculum","civil4"],"subject":"history"},{"id":"史15","title":"共同纲领、新中国宪法与全科复盘","priority":"P0","where":"近现代法制；1949年以来宪法发展","question":"法制史学习如何帮助理解今天的法治？","lecture":"1949年中国人民政治协商会议共同纲领在新中国成立初期起临时宪法作用。新中国先后制定1954、1975、1978、1982年宪法，现行宪法以1982年宪法及此后修正为基础。共同纲领、1954年宪法与1982年宪法不是同一份文件的三个简称。\n\n全科复盘可以用“规则从何而来、如何公开、怎样体系化、由谁适用、怎样纠错”五问。法制史让我们理解制度回应具体社会条件，既看文本，也看运行。清末修律的实施难题、宋代纠错、根据地便民司法，分别提醒我们注意制度移植、事实复核和司法可及性。\n\n联系AI只能作有边界的比较：规则公开启发透明，慎刑启发审慎使用错误风险高的工具，便民司法启发降低技术门槛。但这些启示不能代替民法、刑法或个保法的现行规则。\n\n**一个自然回答方式：** 我对制度如何真正作用于人更感兴趣。技术可以改变程序成本，但法律的可理解、可参与、可纠错依然重要；历史帮助我避免只看设计、不看社会条件。","lectureHtml":"\u003cp>1949年中国人民政治协商会议共同纲领在新中国成立初期起临时宪法作用。新中国先后制定1954、1975、1978、1982年宪法，现行宪法以1982年宪法及此后修正为基础。共同纲领、1954年宪法与1982年宪法不是同一份文件的三个简称。\u003c/p>\n\u003cp>全科复盘可以用“规则从何而来、如何公开、怎样体系化、由谁适用、怎样纠错”五问。法制史让我们理解制度回应具体社会条件，既看文本，也看运行。清末修律的实施难题、宋代纠错、根据地便民司法，分别提醒我们注意制度移植、事实复核和司法可及性。\u003c/p>\n\u003cp>联系AI只能作有边界的比较：规则公开启发透明，慎刑启发审慎使用错误风险高的工具，便民司法启发降低技术门槛。但这些启示不能代替民法、刑法或个保法的现行规则。\u003c/p>\n\u003cp>\u003cstrong>一个自然回答方式：\u003c/strong> 我对制度如何真正作用于人更感兴趣。技术可以改变程序成本，但法律的可理解、可参与、可纠错依然重要；历史帮助我避免只看设计、不看社会条件。\u003c/p>\n","answer":"法制史帮助我理解制度并非凭空产生，而是回应特定社会问题。学习时既要纵向定位朝代，也要横向比较规则公开、法典编纂和司法纠错等制度。对今天AI治理可借鉴透明、审慎和便民价值，但仍需转化为现行法律与程序，不能直接套用古代制度。","follow":[["共同纲领就是1954年宪法吗？","不是，前者在新中国成立初期起临时宪法作用，1954年宪法是之后制定的正式宪法。"],["给不熟悉的制度怎样回答？","先确定大致时期和已知核心，再说明需核对的细节，不编造年代、人名或法条。"]],"refs":["curriculum","constitution","commonprogram"],"subject":"history"}],"introHtml":"\u003cp>法制史研究法律制度在特定社会条件中的形成和变迁。它不是把今天的法条倒回古代，也不是只记“某朝某人某法典”。回答顺序建议：\u003cstrong>定位时期 → 解释制度 → 与前后制度比较 → 评价作用和限度。\u003c/strong>\u003c/p>\n\u003cp>常见断代史课程把传统法制分为初创、转型确立、发展、成熟定型、调整，再进入清末和民国及革命根据地。下面保留这条线，同时增加刑罚、法典、司法和礼法关系四条横线。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时间锚点\u003c/th>\n\u003cth>代表制度\u003c/th>\n\u003cth>为什么要记\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>夏商西周\u003c/td>\n\u003ctd>早期五刑、明德慎罚、礼刑秩序\u003c/td>\n\u003ctd>伦理与政治组织如何影响法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>春秋战国\u003c/td>\n\u003ctd>前536年郑国铸刑书；前513年晋国铸刑鼎；法经\u003c/td>\n\u003ctd>规则公布、体系化和社会转型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>秦汉\u003c/td>\n\u003ctd>律令、九章律、春秋决狱、亲亲得相首匿\u003c/td>\n\u003ctd>统一治理与儒家化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>魏晋南北朝\u003c/td>\n\u003ctd>八议入律、刑名法例、北齐名例与重罪十条\u003c/td>\n\u003ctd>总则技术与身份秩序发展\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>隋唐\u003c/td>\n\u003ctd>开皇律、永徽律疏、唐律疏议\u003c/td>\n\u003ctd>传统法典成熟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宋元明清\u003c/td>\n\u003ctd>宋刑统与编敕、明律六部、清律例和会审\u003c/td>\n\u003ctd>稳定法典与动态治理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清末\u003c/td>\n\u003ctd>1908钦定宪法大纲；1910现行刑律；1911新刑律\u003c/td>\n\u003ctd>近代部门分化和法制转型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>民国\u003c/td>\n\u003ctd>1912临时约法、六法体系、民商合一\u003c/td>\n\u003ctd>共和与近代法律体系及实践张力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>革命根据地、新中国建立\u003c/td>\n\u003ctd>婚姻土地等立法、马锡五审判、1949共同纲领\u003c/td>\n\u003ctd>人民司法与国家制度的新发展\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>不必强塞AI：\u003c/strong> 历史题先讲制度本身，再谨慎谈规则公开、纠错、便民等可转化价值；历史类比不是现行法律依据。\u003c/p>\n"}],"cross":{"id":"cross","name":"热点跨科","subtitle":"把框架用在具体问题上","color":"#326e79","intro":"下面均为模拟开放题；除明确标注的真实案例外，情景是教学假设。主答案先讲最直接的制度，追问再换学科。","route":"优先综01—综04；其余用于扩展。","lessons":[{"id":"综01","title":"AI声音：同一场景的五科切口","priority":"P0","where":"人格权／诈骗构成／权利保障／程序／历史比较","question":"AI克隆声音有哪些法律问题？","lecture":"民法先审查可识别声音的人格权益和许可范围，诈骗情形再按刑法构成分析；公共机关处理信息时可联系基本权利；法理强调创新、尊严、透明与救济；法史只能联系规则公开和纠错等价值，不能直接套古制。\n\n真实来源是最高法发布的声音AI化人格权益典型案例，不要把这个案件说成已经认定了刑事诈骗。若另举冒充家人骗款的情景，应明确是教学假设。\n\n法条锚点可选民法典第1023条，涉及个人信息时再看个保法，生成合成内容的标识按相应文件和适用范围判断。标识了AI生成也不当然取得他人声音的使用授权。","lectureHtml":"\u003cp>民法先审查可识别声音的人格权益和许可范围，诈骗情形再按刑法构成分析；公共机关处理信息时可联系基本权利；法理强调创新、尊严、透明与救济；法史只能联系规则公开和纠错等价值，不能直接套古制。\u003c/p>\n\u003cp>真实来源是最高法发布的声音AI化人格权益典型案例，不要把这个案件说成已经认定了刑事诈骗。若另举冒充家人骗款的情景，应明确是教学假设。\u003c/p>\n\u003cp>法条锚点可选民法典第1023条，涉及个人信息时再看个保法，生成合成内容的标识按相应文件和适用范围判断。标识了AI生成也不当然取得他人声音的使用授权。\u003c/p>\n","answer":"我会先区分技术用途。未经许可利用可识别声音，可能涉及人格权益；若用于冒充他人骗取财产，还需审查诈骗的完整构成。民法典对声音保护有明确依据，AI标识能帮助识别合成内容，但不能代替授权或免除其他责任。","follow":[["真实声音AI案一定也是诈骗案吗？","不是，不能把人格权典型案例擅自加上刑事事实和结论。"],["标了AI生成就不侵权？","不是，标识义务和人格、知识产权等合法性审查各自存在。"]],"refs":["voice","civil3","criminal","labels"],"subject":"cross"},{"id":"综02","title":"自动理赔：分数能代替法律结论吗","priority":"P0","where":"合同／个保法自动化决策／法理程序","question":"怎么看AI自动拒绝赔偿？","lecture":"**教学假设：** 平台以模型评分自动拒绝物流理赔。应审查合同约定、格式条款、事实证据和个人信息自动化决策等规则。模型预测金额与法律上应赔金额不是同一概念。\n\n可以提出风险提示、人工复核、理由说明和申诉纠错等改进建议。总体准确率不意味着每个人均被合理对待，尤其需要考虑误判分布和错误成本。\n\n刑法上区分异常标签与诈骗构成，宪法上区分私人平台与公共机关，法理上讨论效率和程序保障。历史制度仅提供有边界的比较，不能直接替代现行法律依据。","lectureHtml":"\u003cp>\u003cstrong>教学假设：\u003c/strong> 平台以模型评分自动拒绝物流理赔。应审查合同约定、格式条款、事实证据和个人信息自动化决策等规则。模型预测金额与法律上应赔金额不是同一概念。\u003c/p>\n\u003cp>可以提出风险提示、人工复核、理由说明和申诉纠错等改进建议。总体准确率不意味着每个人均被合理对待，尤其需要考虑误判分布和错误成本。\u003c/p>\n\u003cp>刑法上区分异常标签与诈骗构成，宪法上区分私人平台与公共机关，法理上讨论效率和程序保障。历史制度仅提供有边界的比较，不能直接替代现行法律依据。\u003c/p>\n","answer":"AI可以帮助安排理赔核查，但风险分数不能代替合同和法律判断。需要审查拒赔依据、证据、格式条款和自动化决策的权利保障，并考虑人工复核与纠错，因为模型误差可能影响正当请求。","follow":[["高风险标签就是违法认定吗？","不是，模型标签与法定构成、事实证据有不同性质。"],["第24条要求所有自动决定都必须人工参与？","不能绝对化，应区分透明公平要求及对个人权益有重大影响等情形下的特定权利。"]],"refs":["civil2","pipl","criminal"],"subject":"cross"},{"id":"综03","title":"AI司法：技术辅助与审判责任","priority":"P0","where":"宪法国家机构／法理程序／司法AI意见","question":"AI未来会取代法官吗？","lecture":"先列适合辅助的环节：检索、信息整理、类案提示、文书校对。再列必须依法负责的环节：争议事实认定、规范解释、证据评价和最终裁判。最高法法发〔2022〕33号强调辅助审判等原则。\n\n风险不能只说失业，要讲幻觉、偏差、数据安全、不可解释和责任不明。改进也要具体：引用可核验、敏感信息依法处理、提供人工复核、保留记录与救济。\n\n法理上效率不是唯一价值，宪法上审判权属于法定机关，民法上工具服务出现损害仍要具体分配责任。不要把自己推荐系统的体验夸大成已掌握法律大模型研发。","lectureHtml":"\u003cp>先列适合辅助的环节：检索、信息整理、类案提示、文书校对。再列必须依法负责的环节：争议事实认定、规范解释、证据评价和最终裁判。最高法法发〔2022〕33号强调辅助审判等原则。\u003c/p>\n\u003cp>风险不能只说失业，要讲幻觉、偏差、数据安全、不可解释和责任不明。改进也要具体：引用可核验、敏感信息依法处理、提供人工复核、保留记录与救济。\u003c/p>\n\u003cp>法理上效率不是唯一价值，宪法上审判权属于法定机关，民法上工具服务出现损害仍要具体分配责任。不要把自己推荐系统的体验夸大成已掌握法律大模型研发。\u003c/p>\n","answer":"我更看好AI成为可靠的法律工作助手，用于检索和整理等环节。裁判涉及事实、法律、程序和责任，不能简单交给模型。最高法相关意见强调辅助审判，我认为关键是核验依据、保护数据、保留人工判断和救济。","follow":[["你自己的优势是什么？","了解数据、模型和软件流程，能帮助识别技术边界；法律规范与实务能力仍需系统训练。"],["意见等于立法机关制定的法律吗？","不是，要准确说明发布机关和文件性质。"]],"refs":["judicialAI","constitution","curriculum"],"subject":"cross"},{"id":"综04","title":"AI生成内容：创新、著作权与标识","priority":"P0","where":"著作权／生成式AI规章／标识文件","question":"AI生成的内容都有著作权吗？","lecture":"先区分三个问题：生成物是否符合著作权法的作品条件，使用训练或输出内容是否侵害他人权利，传播时是否需要标识。三者不会自动相互决定。\n\n作品需独创性并能以一定形式表现，应结合自然人的具体智力投入和成果特征判断，不能将所有AI输出一概纳入或一概排除。不要把单个文生图案例扩大为所有模型、所有提示词的统一规则。\n\n可以谈促进创新与保护作者利益的平衡，但不能仅说训练需要大量数据，所以所有抓取都应合法。","lectureHtml":"\u003cp>先区分三个问题：生成物是否符合著作权法的作品条件，使用训练或输出内容是否侵害他人权利，传播时是否需要标识。三者不会自动相互决定。\u003c/p>\n\u003cp>作品需独创性并能以一定形式表现，应结合自然人的具体智力投入和成果特征判断，不能将所有AI输出一概纳入或一概排除。不要把单个文生图案例扩大为所有模型、所有提示词的统一规则。\u003c/p>\n\u003cp>可以谈促进创新与保护作者利益的平衡，但不能仅说训练需要大量数据，所以所有抓取都应合法。\u003c/p>\n","answer":"不能一概而论。要看是否满足作品条件和人的具体智力投入，还要与是否侵犯他人权利、是否履行生成合成内容标识义务区分。标识解决部分透明问题，不自动决定著作权归属或内容合法性。","follow":[["有AI标识就能随便用别人图片吗？","不能，权利许可或法定使用依据还要单独判断。"],["如何避免回答过度绝对？","区分基本规则与适用条件，检查是否有法定例外；只引用确实核对过的法条和案例，不猜条号。"]],"refs":["copyright","genAI","labels"],"subject":"cross"},{"id":"综05","title":"健康推荐：敏感信息与责任边界","priority":"P1","where":"人格权／个保法／合同和侵权","question":"健康推荐工具正式提供服务，应考虑什么？","lecture":"**教学假设：** 一个健康推荐工具从实验走向正式服务。首先应明确用途、数据来源、合法处理基础、健康信息的敏感性、访问权限、保存期限和纠错机制。一个同意按钮不能完成全部合规。\n\n推荐与诊断性质不同，输出营养建议不能自动证明医疗效果。是否涉及行业准入等要求要结合真实功能判断。用户协议与法定义务分别审查，不能通过免责条款转移一切责任。\n\n发生损害时，应依关系分析合同、侵权、因果和过错；是否构成犯罪另看刑法构成。技术材料帮助查明事实，但不能代替法律判断。","lectureHtml":"\u003cp>\u003cstrong>教学假设：\u003c/strong> 一个健康推荐工具从实验走向正式服务。首先应明确用途、数据来源、合法处理基础、健康信息的敏感性、访问权限、保存期限和纠错机制。一个同意按钮不能完成全部合规。\u003c/p>\n\u003cp>推荐与诊断性质不同，输出营养建议不能自动证明医疗效果。是否涉及行业准入等要求要结合真实功能判断。用户协议与法定义务分别审查，不能通过免责条款转移一切责任。\u003c/p>\n\u003cp>发生损害时，应依关系分析合同、侵权、因果和过错；是否构成犯罪另看刑法构成。技术材料帮助查明事实，但不能代替法律判断。\u003c/p>\n","answer":"应先明确服务性质与用途，审查数据合法基础、健康信息保护和输出边界，设置必要纠错。推荐不能冒充诊断，免责条款不能排除法定义务；出现损害还需具体分析合同、侵权等责任。","follow":[["用户主动提供健康信息就能永久保存吗？","不能，还需考虑处理目的、必要范围、保存期限及其他法定要求。"],["实验结果不错就说明可以正式诊疗吗？","不能，模型验证与行业准入、医疗效果及实际合规属于不同问题。"]],"refs":["pipl","civil3","civil6"],"subject":"cross"},{"id":"综06","title":"软件许可与涉外知识产权","priority":"P1","where":"知识产权／合同／涉外法律适用","question":"软件技术与技术许可有什么联系？","lecture":"软件系统可能包含代码、数据、模型和第三方组件，不同部分的权利来源与许可条件需要分别审查。AI辅助生成代码也不当然排除知识产权风险。\n\n技术许可需要明确权利范围、地域期限、费用、改进成果、保密和责任。跨境许可还涉及保护地域性、准据法、争议解决和有关监管，不能只翻译合同文本。\n\n技术知识有助于理解事实和材料，法律训练则帮助判断权利与责任。两者能够互补，但不能互相替代。","lectureHtml":"\u003cp>软件系统可能包含代码、数据、模型和第三方组件，不同部分的权利来源与许可条件需要分别审查。AI辅助生成代码也不当然排除知识产权风险。\u003c/p>\n\u003cp>技术许可需要明确权利范围、地域期限、费用、改进成果、保密和责任。跨境许可还涉及保护地域性、准据法、争议解决和有关监管，不能只翻译合同文本。\u003c/p>\n\u003cp>技术知识有助于理解事实和材料，法律训练则帮助判断权利与责任。两者能够互补，但不能互相替代。\u003c/p>\n","answer":"软件成果从实现到保护、利用，需要识别不同权利来源，并安排授权范围、费用、责任和保密。涉外许可又增加地域性、法律适用和争议解决等问题。技术知识帮助理解材料，法律规则决定权利与责任。","follow":[["开源代码都能任意商用吗？","不能，要看具体许可证条件、兼容性和其他权利问题。"],["所有软件创新都可以申请专利吗？","不是，要审查法定客体和相应授权条件，不能仅凭有代码认定。"]],"refs":["copyright","patent","civil2"],"subject":"cross"},{"id":"综07","title":"传统法制对数字治理的启发","priority":"P1","where":"法制史／法理／公共服务","question":"古代法律思想对今天的AI治理有帮助吗？","lecture":"可以借鉴价值和方法，不能直接移植制度。成文法公布提示规则可知，慎刑提醒关注错误成本，宋代复查分工提示事实与规则判断需要核验，马锡五审判方式提示方便群众、理解真实处境。\n\n现代数字治理则需现行权限、权利、程序和技术条件。古代身份等级、惩罚方式和权力结构不能作为今天的正当依据。比较最好只选一个点说清，不要把五千年历史泛化为一套AI答案。\n\n**教学假设：** 线上司法方便多数人，却可能让老年人操作困难。借鉴便民价值可以支持保留辅助渠道，但具体义务仍以现行法律制度为准。","lectureHtml":"\u003cp>可以借鉴价值和方法，不能直接移植制度。成文法公布提示规则可知，慎刑提醒关注错误成本，宋代复查分工提示事实与规则判断需要核验，马锡五审判方式提示方便群众、理解真实处境。\u003c/p>\n\u003cp>现代数字治理则需现行权限、权利、程序和技术条件。古代身份等级、惩罚方式和权力结构不能作为今天的正当依据。比较最好只选一个点说清，不要把五千年历史泛化为一套AI答案。\u003c/p>\n\u003cp>\u003cstrong>教学假设：\u003c/strong> 线上司法方便多数人，却可能让老年人操作困难。借鉴便民价值可以支持保留辅助渠道，但具体义务仍以现行法律制度为准。\u003c/p>\n","answer":"有启发，但主要在方法和价值层面。例如规则公开有助于可预期，审慎纠错提醒我们关注模型误判，便民司法提醒我们降低数字门槛。历史制度不能直接作为现行依据，必须转化到今天的权利、程序和技术条件中。","follow":[["可以直接拿古代规则裁判AI案吗？","不能，历史比较不是现行请求权或定罪依据。"],["最适合你谈的一点是什么？","可谈数据模型会误判，因此重视调查、复核和纠错；不要把历史制度与现代技术说成完全相同。"]],"refs":["curriculum","maxiwu"],"subject":"cross"},{"id":"综08","title":"老师追问：法律与代码有什么不同","priority":"P1","where":"法理学／跨专业动机","question":"学软件和学法律都是规则，有什么区别？","lecture":"相通处是拆解问题、澄清概念、识别条件、检查结果。不同处在于法律的事实可能争议、规范需要解释、价值可能冲突，最终要对人的权利义务与国家权力作可论证安排。软件需求本身也涉及人，不能说技术就是机械、法学才有温度。\n\n用一个例子更具体：代码里设置评分阈值，可以决定系统是否推荐；法律上是否应拒绝理赔，还需要合同依据、事实证据、权利保护和程序。阈值是技术选择，不自动成为法律标准。","lectureHtml":"\u003cp>相通处是拆解问题、澄清概念、识别条件、检查结果。不同处在于法律的事实可能争议、规范需要解释、价值可能冲突，最终要对人的权利义务与国家权力作可论证安排。软件需求本身也涉及人，不能说技术就是机械、法学才有温度。\u003c/p>\n\u003cp>用一个例子更具体：代码里设置评分阈值，可以决定系统是否推荐；法律上是否应拒绝理赔，还需要合同依据、事实证据、权利保护和程序。阈值是技术选择，不自动成为法律标准。\u003c/p>\n","answer":"两者都需要清晰概念和有条理地分析问题，但法律还需处理事实争议、规范解释和价值冲突。模型达到阈值只说明技术分类，不能直接决定赔偿权。技术分析与法律规范、程序和实务能力应相互补充。","follow":[["你是否认为文科生不理性？","不应这样概括。不同背景都有长处，法学也要求严密论证，自己的优势应以实际经历说明。"],["软件背景足以替代法学基础吗？","不能，技术帮助理解事实，法律规范、方法和实务需要系统训练。"]],"refs":["curriculum","pipl"],"subject":"cross"}],"introHtml":"\u003cp>下面均为模拟开放题；除明确标注的真实案例外，情景是教学假设。主答案先讲最直接的制度，追问再换学科。\u003c/p>\n"},"sources":{"civil0":{"title":"《民法典》总则编与七编目录","url":"https://www.cac.gov.cn/2020-06/01/c_1592561777268319.htm","kind":"法律","note":"2020年通过，2021年1月1日起施行；本页仅展示总则及目录，其他编见分页面。"},"civil1":{"title":"《民法典》物权编","url":"https://www.cac.gov.cn/2020-06/01/c_15925617772683191.htm","kind":"法律","note":"登记交付、合同效力与物权变动、善意取得和担保物权。"},"civil2":{"title":"《民法典》合同编","url":"https://www.cac.gov.cn/2020-06/01/c_15925617772683192.htm","kind":"法律","note":"通则、典型合同和准合同；不要遗漏无因管理、不当得利。"},"civil3":{"title":"《民法典》人格权编","url":"https://www.cac.gov.cn/2020-06/01/c_15925617772683193.htm","kind":"法律","note":"人格权、隐私、个人信息、声音保护等。"},"civil4":{"title":"《民法典》婚姻家庭编","url":"https://www.cac.gov.cn/2020-06/01/c_15925617772683194.htm","kind":"法律","note":"婚姻效力、夫妻财产债务、离婚和家庭关系；复杂财产分割还需相应解释。"},"civil5":{"title":"《民法典》继承编","url":"https://www.cac.gov.cn/2020-06/01/c_15925617772683195.htm","kind":"法律","note":"法定继承、遗嘱、遗产处理；现行法不再规定公证遗嘱当然优先。"},"civil6":{"title":"《民法典》侵权责任编","url":"https://www.cac.gov.cn/2020-06/01/c_15925617772683196.htm","kind":"法律","note":"一般规则与特殊侵权；无过错责任仍有构成条件。"},"criminal":{"title":"《刑法》基础条文（官方汇编至修正案十一）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_890f1333b6284c3cbb225c3cd2647c4b.html","kind":"法律／注意版本","note":"网页虽发布于2025年，正文沿革只到修正案十一。本文所用总则与相关条文据此核对，并另核修正案十二；不能将此网页称为全部现行刑法汇编。"},"amend11":{"title":"《刑法修正案（十一）》","url":"https://www.npc.gov.cn/npc/c2/c30834/202012/t20201226_309442.html","kind":"法律","note":"2021年3月1日起施行；核查12至14周岁特殊追责条件等。"},"amend12":{"title":"《刑法修正案（十二）》正式文本","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5233391/content.html","kind":"法律","note":"2024年3月1日起施行；主要涉及企业内部腐败、行贿等规定，不用草案说明代替最终文本。"},"constitution":{"title":"《宪法》（2018年修正文本）","url":"https://www.mofcom.gov.cn/xxgcxjpxsdzgtsshzysx/zywj/art/2018/art_45c1e16fe351469090d53e63178268c8.html","kind":"宪法","note":"核查根本制度、基本权利、国家机构、修宪程序；不采用未修正的旧国家机构条文。"},"legislation":{"title":"《立法法》（2023年修正）","url":"https://www.spp.gov.cn/spp/fl/202303/t20230314_608394.shtml","kind":"法律","note":"重点核查立法权限、效力与冲突处理、备案审查。部分人大及检察站点可能限制直接访问。"},"pipl":{"title":"《个人信息保护法》","url":"https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm","kind":"法律","note":"2021年11月1日起施行；第13条合法基础，第24条自动化决策，第28—30条敏感个人信息。"},"copyright":{"title":"《著作权法》（2020年修正）","url":"https://www.npc.gov.cn/c2/c30834/202011/t20201119_308796.html","kind":"法律","note":"作品需独创性并能以一定形式表现；软件、AI产出权利判断要具体分析，不能等同所有内容都有著作权。"},"patent":{"title":"《专利法》（2020年修正）","url":"https://www.cnipa.gov.cn/art/2020/11/23/art_97_155167.html","kind":"法律","note":"第22条发明和实用新型三性；算法及软件相关方案还需审查法定客体和具体技术方案。"},"genAI":{"title":"《生成式人工智能服务管理暂行办法》","url":"https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm","kind":"部门规章","note":"2023年8月15日起施行；重点看向境内公众提供生成式AI服务等适用范围，不把一切机器学习都称为生成式AI服务。"},"labels":{"title":"《人工智能生成合成内容标识办法》","url":"https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm","kind":"四部门规范性文件","note":"2025年9月1日起施行；区分显式和隐式标识、服务提供者与传播服务等主体义务。标识不是对内容合法性的全面担保。"},"judicialAI":{"title":"最高法《关于规范和加强人工智能司法应用的意见》","url":"https://www.court.gov.cn/fabu/xiangqing/382461.html","kind":"司法应用指导文件","note":"法发〔2022〕33号；辅助审判、透明可信等原则。不是全国人大法律，也不将其直接称作司法解释。"},"voice":{"title":"最高法：利用网络信息技术侵害人格权典型案例","url":"https://www.court.gov.cn/zixun/xiangqing/467511.html","kind":"真实典型案例","note":"殷某某声音AI化案例：人格权益与录音授权需要区分；不同主体责任按具体行为与过错分析。"},"yuhuan":{"title":"指导案例93号：于欢故意伤害案","url":"https://www.court.gov.cn/fabu/xiangqing/104262.html","kind":"真实指导性案例","note":"防卫起因与防卫限度分别判断；该案并非认定完全无罪，不与其他防卫案件混淆。"},"maxiwu":{"title":"最高法：在新时代继承和发展马锡五审判方式","url":"https://www.court.gov.cn/jianshe/xiangqing/217661.html","kind":"司法史解读","note":"调查研究、联系群众、方便诉讼、依法处理。属于历史与价值讨论，不是现行具体案件裁判条文。"},"xi2025":{"title":"司法部：习近平法治思想学习纲要2025年版的丰富发展","url":"https://www.moj.gov.cn/pub/sfbgw/gwxw/xwyw/ywzfyw/202512/t20251210_529238.html","kind":"官方理论解读","note":"新增依法治国和依规治党有机统一为第十二个坚持；第五项表述也有发展。已通过官方检索摘要及其他官方报道交叉核查。"},"xi2026":{"title":"中国人大网：深入学习贯彻习近平法治思想（2026）","url":"https://www.npc.gov.cn/npc/c2/c30834/202603/t20260325_453450.html","kind":"官方理论解读","note":"交叉核查2025年丰富发展的十二个坚持表述，不把旧讲义历史版本当作最新。"},"commonprogram":{"title":"中国人大网：宪法制定和发展完善历程","url":"https://www.npc.gov.cn/npc/c12434/dzlfxzgcl70nlflc/202108/t20210824_313204.html","kind":"宪法史资料","note":"共同纲领及1954、1975、1978、1982年宪法的历史线索。"},"curriculum":{"title":"课程框架说明","url":"#sources","kind":"学习框架","note":"采用常见法硕五科结构重新串讲；历史制度与理论方法不冒充现行法条。公开版不提供私人讲义、简历或本地文件。"}},"core":["民01","民02","民04","民07","民13","刑01","刑05","刑06","刑07","刑08","宪01","宪02","宪04","宪06","宪07","理03","理04","理08","理09","理13","史02","史05","史08","史09","史11"],"planHtml":"\u003ch2>你只有不到两天：先完成学习闭环\u003c/h2>\n\u003cp>页面内容分为三层：\u003cstrong>救急25题\u003c/strong>是时间最紧时每科五个锚点；\u003cstrong>P0先掌握\u003c/strong>是进一步需要能口述的主干；\u003cstrong>P1再展开\u003c/strong>补充比较和特殊规则。标签是学习优先级，不是学校真题频率或命中率。\u003c/p>\n\u003ch3>第一天：先把五科都放进脑中（专业课约6小时）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时段\u003c/th>\n\u003cth>操作\u003c/th>\n\u003cth>检验结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20分钟\u003c/td>\n\u003ctd>看五科地图及答题方法\u003c/td>\n\u003ctd>能说出每科解决什么问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80分钟\u003c/td>\n\u003ctd>民法：地图＋救急五题，再补合同物权、人格、家庭继承、时效\u003c/td>\n\u003ctd>脱稿说七编及两组区别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80分钟\u003c/td>\n\u003ctd>刑法：地图＋救急五题，再补共同犯罪、刑罚与常见罪名\u003c/td>\n\u003ctd>脱稿说构成、停止形态和一个例外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60分钟\u003c/td>\n\u003ctd>宪法：重点机关表、基本权利、修宪程序\u003c/td>\n\u003ctd>分清人大、政府、法院、检察院和监委\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60分钟\u003c/td>\n\u003ctd>法理：概念、规则原则、解释、程序与AI\u003c/td>\n\u003ctd>用一个具体场景说明价值冲突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60分钟\u003c/td>\n\u003ctd>法史：年代线＋救急五题\u003c/td>\n\u003ctd>讲清春秋、唐、清末、根据地四个节点\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>每25—40分钟短休息。另留至少45分钟英语听题、30分钟简历与一分钟介绍练习；专业课不能挤掉你最薄弱的英语。\u003c/p>\n\u003ch3>第二天：从能理解变成能开口（专业课约4—5小时）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>50分钟\u003c/strong>：五科各一轮60秒框架复述，哪里断就回对应课。\u003c/li>\n\u003cli>\u003cstrong>90分钟\u003c/strong>：抽题模式选救急25，先不开答案，每题45—90秒；一题答完再看示范和两轮追问。\u003c/li>\n\u003cli>\u003cstrong>60分钟\u003c/strong>：只练标记“待复习”的题，重点修正原则、例外和混淆，不再扩充大量新内容。\u003c/li>\n\u003cli>\u003cstrong>40分钟\u003c/strong>：热点跨科，练AI声音、自动理赔、AI司法和软件许可，每题只选一个主要方向说深。\u003c/li>\n\u003cli>\u003cstrong>30分钟\u003c/strong>：五科混合抽题，训练听完题先停两秒、直接给结论，再展开。\u003c/li>\n\u003cli>\u003cstrong>20分钟\u003c/strong>：看速查表和易错句，结束大规模输入。保留睡眠，面试前不临时硬背几十个新条号。\u003c/li>\n\u003c/ol>\n\u003ch3>如果实际只剩半天\u003c/h3>\n\u003cp>五科地图20分钟 → 救急25题各2—3分钟 → 八个易错点20分钟 → 随机抽题40分钟 → 英语与简历至少60分钟。暂不读全部P1，遇到追问再用具体知识定位。\u003c/p>\n\u003ch3>每题自检，不用追求朗诵感\u003c/h3>\n\u003cul>\n\u003cli>我有没有先正面回答？\u003c/li>\n\u003cli>我能否说明它属于哪个领域，并说对规则？\u003c/li>\n\u003cli>我有没有讲错“可以/应当”“无效/可撤销”“领导/监督”？\u003c/li>\n\u003cli>我能否举一个确实相关的例子，并说明例外？\u003c/li>\n\u003cli>不确定的条号、案例、个人经历有没有乱编？\u003c/li>\n\u003c/ul>\n\u003cp>“能接追问”须自己说过主答案和至少一轮追问再标记。看过答案不等于掌握；本页不进行AI评分，也不保证录取。\u003c/p>\n","methodHtml":"\u003ch2>老师更容易听懂的回答顺序\u003c/h2>\n\u003cp>\u003cstrong>直接结论 → 定位制度 → 解释规则与原因 → 一个例外或比较 → 一个相关例子。\u003c/strong> 不必每题集齐所有元素，30秒答概念，60秒加条件，90秒再联系实际。不要为报章节和谚语迟迟不回答问题。\u003c/p>\n\u003cp>例如“格式条款有效吗”：先说“不一律无效”，再定位合同编，解释提示说明、内容效力、解释规则三层，最后用平台免责条款作教学例子。真实案例须记准结论；教学假设直接说“例如假设”。\u003c/p>\n\u003ch2>五科各自的导航句\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>学科\u003c/th>\n\u003cth>回答定位\u003c/th>\n\u003cth>必须进一步说的东西\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>民法\u003c/td>\n\u003ctd>这涉及合同编／总则的行为效力等\u003c/td>\n\u003ctd>谁向谁主张何种权利，条件和例外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>刑法\u003c/td>\n\u003ctd>这涉及犯罪论的停止形态／责任能力等\u003c/td>\n\u003ctd>构成、主观状态、阶段与法定后果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宪法\u003c/td>\n\u003ctd>这涉及基本权利／国家机构等\u003c/td>\n\u003ctd>机关性质、权限和监督关系，权利边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法理\u003c/td>\n\u003ctd>这涉及规则原则／法律解释／正义等\u003c/td>\n\u003ctd>概念区别、分析方法与论证理由\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法史\u003c/td>\n\u003ctd>这属于某朝某阶段的制度\u003c/td>\n\u003ctd>内容、变化原因、影响与限度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>不会时如何保持表达有内容\u003c/h2>\n\u003cp>可以说：“具体条号我需要再核对，但这个问题属于……，我理解其核心规则是……，还需要进一步区分……。”只说确实知道的内容。完整框架帮助你分析，不是要求把不确定结论包装成确定。\u003c/p>\n\u003ch2>先修正八句高风险说法\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>不要这样说\u003c/th>\n\u003cth>更准确的方向\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>民法典有知识产权编\u003c/td>\n\u003ctd>无单独编，知识产权另有专门立法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>欺诈合同一律无效\u003c/td>\n\u003ctd>通常分析可撤销；效力分类有区别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>过三年债权自动消灭\u003c/td>\n\u003ctd>时效抗辩，不是当然消灭债权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12岁以后所有犯罪都负责\u003c/td>\n\u003ctd>12—14岁严格限定罪行、结果情节与核准程序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>于欢案认定无罪\u003c/td>\n\u003ctd>指导案例认定具有防卫起因但防卫过当\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国务院是最高权力机关\u003c/td>\n\u003ctd>全国人大是，国务院是最高行政机关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI判高风险就是违法\u003c/td>\n\u003ctd>风险标签不等于法定构成和证据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>古代慎刑等于现代人权制度\u003c/td>\n\u003ctd>可以比较价值，但须说明时代与制度差异\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","count":75}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('courseData').textContent),subjects=[...D.subjects,D.cross],all=subjects.flatMap(s=>s.lessons),byId=Object.fromEntries(all.map(l=>[l.id,l])),main=document.getElementById('main');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='public-law-course-20260914-v1';let book={items:{},notes:{}},subject='civil',scope='all',mode='overview',current='民01',examSubject='all',examScope='core',examReview=false,deck=[],examId=null,examRevealed=false,followIndex=0,seconds=90,timer=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object'){book.items=saved.items&&typeof saved.items==='object'?saved.items:{};book.notes=saved.notes&&typeof saved.notes==='object'?saved.notes:{}}}catch(e){notice('浏览器未能读取进度；仍可学习，建议导出备份。')}
function notice(t){$('notice').textContent=t}function save(){try{localStorage.setItem(KEY,JSON.stringify(book))}catch(e){notice('当前浏览器无法保存进度，请用“导出进度”备份。')}}
function sub(id){return subjects.find(s=>s.id===id)}function status(id){return book.items[id]?.level}function inScope(l,s){return s==='all'||s==='core'&&D.core.includes(l.id)||l.priority===s}function filtered(s=subject,p=scope){return (s==='all'?all:sub(s).lessons).filter(l=>inScope(l,p))}
function badge(l){return '<span class="badge">'+esc(l.priority)+'</span> '+(D.core.includes(l.id)?'<span class="badge core">救急25</span>':'')}
function refHTML(l){return '<div class="refs">对应资料：'+l.refs.map(id=>{const r=D.sources[id];return '<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>'}).join('')+'</div>'}
function markHTML(l){return '<div class="marks row noprint" aria-label="掌握情况">'+[[0,'待复习'],[1,'能讲主干'],[2,'能接追问']].map(([n,t])=>'<button data-mark="'+n+'" data-id="'+l.id+'" aria-pressed="'+(status(l.id)===n)+'">'+t+'</button>').join('')+'</div>'}
function notesHTML(l){return '<div class="notes"><label for="lessonNote">记下自己的说法 / 还会卡住的地方</label><textarea id="lessonNote" data-note="'+l.id+'" placeholder="写一句规则、一个容易忘的条件，或你自己的例子。">'+esc(book.notes[l.id]||'')+'</textarea><div class="tiny muted">输入后自动保存。自评代表你的练习判断，不是系统评分。</div></div>'}
function refreshSide(){
 document.body.dataset.mode=mode;
 $('subjectSelect').innerHTML=subjects.map(s=>'<option value="'+s.id+'" '+(s.id===subject?'selected':'')+'>'+s.name+'</option>').join('');$('scopeSelect').value=scope;
 const ls=filtered(),done=all.filter(l=>status(l.id)===2).length;
 $('sideProgress').innerHTML='<div>能接追问 '+done+' / '+all.length+'（含跨科题）</div><progress value="'+done+'" max="'+all.length+'" aria-label="自评进度"></progress>';
 $('sideTitle').textContent=sub(subject).name+' · '+ls.length+' 个专题';
 $('toc').innerHTML=ls.length?ls.map(l=>'<button class="lesson-link '+(mode==='lecture'&&l.id===current?'active':'')+'" data-lesson="'+l.id+'">'+(status(l.id)===2?'✓ ':status(l.id)===0?'↺ ':'')+esc(l.id+' '+l.title)+'</button>').join(''):'<p class="muted">此学科在当前范围中没有专题，可切换“全部专题”。</p>';
 document.querySelectorAll('.topnav button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});
}
function stopTimer(){if(timer)clearInterval(timer);timer=null;const b=$('timerStart');if(b)b.textContent='开始计时'}
function go(m,id){stopTimer();mode=m;if(id&&byId[id]){current=id;subject=byId[id].subject;mode='lecture'}if(mode==='lecture'&&!filtered().some(l=>l.id===current)){const f=filtered();if(f.length)current=f[0].id}history.replaceState(null,'',mode==='lecture'?'#lesson='+encodeURIComponent(current):'#'+mode);render();window.scrollTo(0,0)}
function followHTML(l){return l.follow.map((f,i)=>'<details><summary>追问 '+(i+1)+'：'+esc(f[0])+'</summary><p>'+esc(f[1])+'</p></details>').join('')}
function lecture(l){return '<div class="crumb">'+esc(sub(l.subject).name)+' / '+l.id+' '+badge(l)+'</div><h2>'+esc(l.title)+'</h2><div class="loc">定位：'+esc(l.where)+'</div><div class="lecture">'+l.lectureHtml+'</div><div class="lesson-check">先合上讲解，用自己的话回答：<strong>'+esc(l.question)+'</strong></div><details id="modelAnswer"><summary>我已试着回答，展开口述示范</summary><p class="answer">'+esc(l.answer)+'</p></details><h3>老师可能继续问</h3>'+followHTML(l)+markHTML(l)+notesHTML(l)+refHTML(l)}
function overview(){main.innerHTML='<div class="eyebrow muted">先看全貌，再逐门展开</div><h2>五门课，一套有条理的回答方式</h2><p>你要练成的不是逐字朗诵，而是听到问题后，能定位领域、说清规则、区分例外，再用相关例子解释。</p><div class="stats"><div class="stat"><strong>'+D.count+'</strong><span>五科完整串讲专题</span></div><div class="stat"><strong>'+D.cross.lessons.length+'</strong><span>热点跨科场景</span></div><div class="stat"><strong>'+all.reduce((n,l)=>n+l.follow.length,0)+'</strong><span>追问与参考回答</span></div></div><div class="accent"><strong>不到两天，先学什么？</strong><p>先读每科地图，再完成“救急25题”，然后补P0主干并随机抽问。每科都先形成框架，别在民法一个细节上耗掉全部时间。</p><div class="row"><button class="primary" data-lesson="民01">从民法第一课开始</button><button data-go="plan">看两天安排</button></div></div><h3>选择一门课</h3><div class="cards">'+D.subjects.map(s=>'<div class="card" style="border-top:3px solid '+s.color+'"><h3>'+s.name+'</h3><p>'+esc(s.subtitle)+'</p><p class="muted">'+s.lessons.length+' 个专题 · '+s.lessons.filter(l=>l.priority==='P0').length+' 个P0</p><button data-map="'+s.id+'">看本科学习地图</button> <button data-lesson="'+s.lessons[0].id+'">开始串讲</button></div>').join('')+'</div>'+D.methodHtml+'<div class="row noprint"><button data-print="all">打印全部课程与答案</button><button data-export>导出学习进度</button></div>'}
function subjectMap(s){main.innerHTML='<div class="crumb">学科地图</div><h2>'+s.name+' · '+esc(s.subtitle)+'</h2><div class="lecture">'+s.introHtml+'</div><div class="accent">'+esc(s.route)+'</div><h3>本课目录</h3><div class="results">'+s.lessons.map(l=>'<button data-lesson="'+l.id+'">'+badge(l)+' '+esc(l.id+' '+l.title)+'<small>'+esc(l.where)+'</small></button>').join('')+'</div>';refreshSide()}
function render(){refreshSide();if(mode==='overview')return overview();if(mode==='lecture'){
 const ls=filtered(),l=byId[current];if(!ls.length){main.innerHTML='<h2>当前范围暂无专题</h2><p>将学习范围切换为全部专题，或选择其他学科。</p>';return}
 const i=ls.findIndex(x=>x.id===l.id);main.innerHTML=lecture(l)+'<div class="row between stepnav"><button data-step="-1" '+(i<=0?'disabled':'')+'>← 上一专题</button><button data-map="'+subject+'">回本科地图</button><button data-step="1" '+(i>=ls.length-1?'disabled':'')+'>下一专题 →</button></div><div class="row noprint"><button data-practice="'+l.id+'">单练这一题</button><button data-print="current">打印本课</button></div>';return}
 if(mode==='exam')return renderExam();if(mode==='cross'){subject='cross';refreshSide();return subjectMap(D.cross)}if(mode==='review')return review();if(mode==='plan'){main.innerHTML=D.planHtml+'<div class="row"><button data-core>开始救急25题抽问</button><button data-go="review">看待复习题</button></div>';return}
 if(mode==='sources')main.innerHTML='<h2>法源、资料和版本</h2><p>专题讲解为重新组织的学习材料；法条提供制度依据，案例提供具体分析参考，历史和法理不强行对应虚构条号。核对日期：2026-09-14。公开版未包含个人简历、联系方式、原始材料或真实个人项目经历。</p><div class="accent">注意：刑法基础全文网页的发布日期不等于其修正版本；第十二修正案单列核对。2025年版法治思想纲要的“十二个坚持”也已与旧资料区分。官方个别站点可能限制直接访问。</div>'+Object.entries(D.sources).map(([id,r])=>'<div class="source-card" id="source-'+id+'"><span class="badge">'+esc(r.kind)+'</span><h3><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a></h3><p>'+esc(r.note)+'</p></div>').join('');
}
function eligible(){return filtered(examSubject,examScope).filter(l=>!examReview||status(l.id)===0)}
function draw(){stopTimer();const pool=eligible();deck=deck.filter(id=>pool.some(l=>l.id===id));if(!deck.length){deck=pool.map(l=>l.id);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}if(deck.length>1&&deck.at(-1)===examId)[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];examId=deck.pop()||null;examRevealed=false;followIndex=0;seconds=90;renderExam()}
function renderExam(){const l=byId[examId],valid=l&&eligible().some(x=>x.id===l.id);main.innerHTML='<h2>抽题面试</h2><p class="muted">先说45—90秒，再看答案；答完主问题后，再展示两轮追问。题目为模拟，不是学校真题。</p><div class="examtools"><label>学科 <select id="examSubject">'+[{id:'all',name:'五科＋跨科'},...subjects].map(s=>'<option value="'+s.id+'" '+(s.id===examSubject?'selected':'')+'>'+s.name+'</option>').join('')+'</select></label><label>范围 <select id="examScope">'+[['core','救急25题'],['P0','P0主干'],['all','全部专题'],['P1','P1扩展']].map(([v,t])=>'<option value="'+v+'" '+(v===examScope?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label><input type="checkbox" id="examReview" '+(examReview?'checked':'')+'> 只抽待复习</label><button id="draw" class="primary">抽一道题</button></div><div class="countline">当前题池 '+eligible().length+' 题 · 本轮待抽 '+deck.length+' 题。题池内抽完后重新洗牌。</div>'+(!valid?'<div class="empty">'+(eligible().length?'点击“抽一道题”开始。':'当前题池为空。可切换范围，或先给题目标记“待复习”。')+'</div>':'<div class="crumb">'+esc(sub(l.subject).name)+' · '+l.id+' '+badge(l)+'</div><div class="question" id="examQuestion">'+esc(l.question)+'</div><div class="row noprint"><span id="timer" class="timer" aria-live="off">'+seconds+' 秒</span><button id="timerStart">开始计时</button><button id="timerReset">重置90秒</button><button id="showAnswer" class="primary">'+(examRevealed?'收起答案':'我已回答，查看示范')+'</button></div><div id="examAnswer" class="'+(examRevealed?'':'hidden')+'"><div class="loc">定位：'+esc(l.where)+'</div><p class="answer">'+esc(l.answer)+'</p><div class="lesson-check">自查：有没有正面回答？规则、条件和例外是否准确？例子是否相关？能否说明不确定的边界？</div><button id="nextFollow" '+(followIndex>=l.follow.length?'disabled':'')+'>继续追问（'+followIndex+'/'+l.follow.length+'）</button><div id="followArea">'+l.follow.slice(0,followIndex).map((f,i)=>'<p class="follow-question">追问 '+(i+1)+'：'+esc(f[0])+'</p><details><summary>展开这轮追问的参考回答</summary><p>'+esc(f[1])+'</p></details>').join('')+'</div>'+markHTML(l)+notesHTML(l)+'<button data-lesson="'+l.id+'">回到对应串讲</button>'+refHTML(l)+'</div>');
}
function review(){const pending=all.filter(l=>status(l.id)===0),partial=all.filter(l=>status(l.id)===1),done=all.filter(l=>status(l.id)===2);main.innerHTML='<h2>易错复习与自己的笔记</h2><p>不是记录“看过几页”，而是记录能否独立表达。你的笔记和自评不会覆盖英语页或旧手册的记录。</p><div class="stats"><div class="stat"><strong>'+pending.length+'</strong><span>待复习</span></div><div class="stat"><strong>'+partial.length+'</strong><span>能讲主干</span></div><div class="stat"><strong>'+done.length+'</strong><span>能接追问</span></div></div><div class="row noprint"><button data-review-exam class="primary">只抽待复习题</button><button data-export>导出进度和笔记</button><button data-import>导入进度</button></div><p class="muted">导入会合并相同题号的记录，文件中的记录覆盖同题旧值；其他题保持原状。</p><h3>待复习</h3><div class="results">'+(pending.length?pending.map(reviewButton).join(''):'<p class="empty">还没有待复习题。抽题后可标记不会的题，不需要刻意清零。</p>')+'</div><h3>能讲主干，继续补追问</h3><div class="results">'+(partial.length?partial.map(reviewButton).join(''):'<p class="muted">暂无记录。</p>')+'</div><h3>保存过的笔记</h3><div class="results">'+(all.filter(l=>book.notes[l.id]).map(reviewButton).join('')||'<p class="muted">在任一专题或抽题答案下记录自己的说法。</p>')+'</div>'+D.methodHtml}
function reviewButton(l){return '<button data-lesson="'+l.id+'">'+esc(l.id+' '+l.title)+'<small>'+esc((book.notes[l.id]||l.question).slice(0,140))+'</small></button>'}
function search(){stopTimer();const q=$('searchInput').value.trim().toLowerCase();mode='search';refreshSide();if(!q){main.innerHTML='<h2>搜索课程</h2><p>请输入概念、法条关键词、朝代或问题。</p>';return}const hits=all.filter(l=>[l.title,l.where,l.question,l.lecture,l.answer,...l.follow.flat()].join(' ').toLowerCase().includes(q));main.innerHTML='<h2>搜索结果</h2><p>全站找到 '+hits.length+' 个相关专题，点击进入原文。搜索不受左侧学习范围限制。</p><div class="results">'+(hits.map(l=>'<button data-search-lesson="'+l.id+'">'+esc(l.id+' '+l.title)+'<small>'+esc(l.where)+' · '+esc(l.question)+'</small></button>').join('')||'<p class="empty">没有匹配内容。可以尝试近义词，或从学科地图定位。</p>')+'</div>'}
function exportBook(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:D.version,exported:new Date().toISOString(),...book},null,2)],{type:'application/json'}));a.href=u;a.download='五科口试进度与笔记.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function printPage(full){stopTimer();if(full){$('printFull').innerHTML='<h1>五科专业课完整串讲</h1><p>2026-09-14 · 主讲'+D.count+'专题＋'+D.cross.lessons.length+'跨科情景</p>'+D.methodHtml+D.planHtml+subjects.map(s=>'<section><h1>'+s.name+'</h1>'+s.introHtml+s.lessons.map(l=>'<article><h2>'+l.id+' '+esc(l.title)+'</h2><p>'+esc(l.where)+'</p>'+l.lectureHtml+'<h3>问题与示范</h3><p><strong>'+esc(l.question)+'</strong></p><p>'+esc(l.answer)+'</p>'+l.follow.map(f=>'<p><strong>'+esc(f[0])+'</strong><br>'+esc(f[1])+'</p>').join('')+refHTML(l)+'</article>').join('')+'</section>').join('');document.body.classList.add('printAll')}const closed=[...main.querySelectorAll('details:not([open])')];closed.forEach(d=>d.open=true);const cleanup=()=>{document.body.classList.remove('printAll');closed.forEach(d=>d.open=false);window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);window.print()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mode){if(b.dataset.mode==='lecture'&&subject==='cross')subject='civil';go(b.dataset.mode);return}
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.dataset.lesson||b.dataset.searchLesson){const id=b.dataset.lesson||b.dataset.searchLesson;if(!inScope(byId[id],scope))scope='all';go('lecture',id);return}
 if(b.dataset.map){stopTimer();subject=b.dataset.map;mode='map';history.replaceState(null,'','#map='+subject);subjectMap(sub(subject));window.scrollTo(0,0);return}
 if(b.dataset.step){const ls=filtered(),i=ls.findIndex(l=>l.id===current)+Number(b.dataset.step);if(ls[i])go('lecture',ls[i].id);return}
 if(b.dataset.mark!==undefined){book.items[b.dataset.id]={level:Number(b.dataset.mark),updated:new Date().toISOString()};save();main.querySelectorAll('[data-mark][data-id="'+b.dataset.id+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mark===b.dataset.mark)));refreshSide();return}
 if(b.dataset.practice){examSubject=byId[b.dataset.practice].subject;examScope='all';examReview=false;deck=[];examId=b.dataset.practice;examRevealed=false;followIndex=0;seconds=90;go('exam');return}
 if(b.hasAttribute('data-core')){examSubject='all';examScope='core';examReview=false;deck=[];examId=null;go('exam');draw();return}
 if(b.hasAttribute('data-review-exam')){examSubject='all';examScope='all';examReview=true;deck=[];examId=null;go('exam');draw();return}
 if(b.hasAttribute('data-export'))return exportBook();if(b.hasAttribute('data-import'))return $('fileImport').click();if(b.dataset.print)return printPage(b.dataset.print==='all');
 if(b.id==='searchButton')return search();if(b.id==='draw')return draw();if(b.id==='showAnswer'){stopTimer();examRevealed=!examRevealed;renderExam();return}
 if(b.id==='nextFollow'){stopTimer();followIndex=Math.min(followIndex+1,byId[examId].follow.length);renderExam();return}
 if(b.id==='timerReset'){stopTimer();seconds=90;$('timer').textContent=seconds+' 秒';return}
 if(b.id==='timerStart'){if(timer){stopTimer();return}if(seconds<=0)seconds=90;b.textContent='暂停';timer=setInterval(()=>{seconds--;$('timer').textContent=seconds+' 秒';if(seconds<=0){stopTimer();notice('时间到。先收住结论，再查看答案和追问。')}},1000);return}
});
document.addEventListener('input',e=>{if(e.target.dataset.note){book.notes[e.target.dataset.note]=e.target.value;save()}});
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('subjectSelect').onchange=e=>{subject=e.target.value;const ls=filtered();current=ls[0]?.id||sub(subject).lessons[0].id;go('lecture')};$('scopeSelect').onchange=e=>{scope=e.target.value;go('lecture')};
document.addEventListener('change',e=>{if(['examSubject','examScope','examReview'].includes(e.target.id)){stopTimer();if(e.target.id==='examSubject')examSubject=e.target.value;if(e.target.id==='examScope')examScope=e.target.value;if(e.target.id==='examReview')examReview=e.target.checked;deck=[];examId=null;renderExam()}});
$('fileImport').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v||typeof v!=='object'||Array.isArray(v)||!v.items||!v.notes||typeof v.items!=='object'||typeof v.notes!=='object')throw Error('格式不符');let n=0;for(const [id,x]of Object.entries(v.items)){if(byId[id]&&x&&[0,1,2].includes(x.level)){book.items[id]={level:x.level,updated:String(x.updated||'')};n++}}for(const[id,x]of Object.entries(v.notes)){if(byId[id]&&typeof x==='string')book.notes[id]=x.slice(0,20000)}save();notice('已合并 '+n+' 个题目的自评及有效笔记。');go('review')}catch(err){notice('导入失败：请选择本页导出的进度JSON；原有记录未清空。')}e.target.value=''};
function loadHash(){const h=location.hash;if(h.startsWith('#lesson=')){let id;try{id=decodeURIComponent(h.slice(8))}catch(e){}if(byId[id]){current=id;subject=byId[id].subject;scope='all';mode='lecture';render();return}}if(h.startsWith('#map=')&&sub(h.slice(5))){subject=h.slice(5);mode='map';subjectMap(sub(subject));return}const m=h.slice(1);mode=['overview','lecture','exam','cross','review','plan','sources'].includes(m)?m:'overview';render()}
window.addEventListener('hashchange',()=>{stopTimer();loadHash()});loadHash();
</script></body></html>
